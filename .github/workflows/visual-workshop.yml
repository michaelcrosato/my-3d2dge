name: Visual Workshop
on:
  push:
    branches: [workshop/visual-review-tool]
  pull_request:
    paths:
      - 'tools/visual-workshop/**'
      - 'tools/visual-workshop.mjs'
      - 'tools/ed-workshop-test.mjs'
      - 'engine/**'
      - 'src/emberdeep/**'
      - '.github/workflows/visual-workshop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tools/ed-workshop-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-workshop
          path: |
            check-output/visual-workshop/
            examples/visual-workshop.html
          retention-days: 14
