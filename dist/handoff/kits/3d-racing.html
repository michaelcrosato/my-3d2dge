  "brief": "The my-3D2dge 3D starter: a title menu of small 3D games, one per genre, each a complete slice to copy and change. Its menus and notices are short, arcade-like, mostly in capitals; keep them short, since they sit on a 320 x 240 screen over the 3D picture. The player is unnamed and unseen in the menus; address them with the familiar \"you\" where a line needs one.\n\nThe 3D racing slice: a kart circuit in a green valley, like Mario Kart 64: you and five drivers, three laps, drifts that charge a boost, item boxes, a dirt shortcut, and a split screen for two players. The words are short menus, HUD notes and a results board, in capitals and upbeat. The player is addressed as \"you\" only in the manual; their driver, NOVA, is never gendered in the words.\n\nLines with ids starting engine. are the engine's own words: its pause menu, settings, controls screen, save slots, notices and key names, shown on every game made with it. Keep them short: they sit on buttons and in narrow rows."
