  "names": ["my-3D2dge","Pip","Finn","Morwen","Bruno","Bram","SCUMM","Sierra","Monkey Island"],
  "brief": "The my-3D2dge starter: a title menu of small games, one per genre, each a complete slice to copy and change. Its menus and notices are short, arcade-like, mostly in capitals; keep them short, since they sit on a 320 x 240 screen. The player is unnamed and unseen in the menus; address them with the familiar \"you\" where a line needs one.\n\nThe point-and-click slice, The Light on Gull Rock: a comic adventure in the manner of Monkey Island, warm and wry. On a fishing harbour at dusk the lighthouse on Gull Rock has gone dark with the fleet out in the fog, and Pip, a young deckhand (a boy: the others call him lad), relights it. Pip speaks most lines, in the first person, describing what the player points at and tries (often with a dry joke); Finn, an old fisherman, Bruno, the tavern keeper (a man), and Morwen, the harbour master (a woman, proud of never losing a riddle contest), talk with him. Morwen's three riddles must work in your language with the same right answers (see their notes). Gull Rock and the Salty Gull (the tavern) are place names you may translate.\n\nLines with ids starting engine. are the engine's own words: its pause menu, settings, controls screen, save slots, notices and key names, shown on every game made with it. Keep them short: they sit on buttons and in narrow rows."
