  "brief": "The my-3D2dge starter: a title menu of small games, one per genre, each a complete slice to copy and change. Its menus and notices are short, arcade-like, mostly in capitals; keep them short, since they sit on a 320 x 240 screen. The player is unnamed and unseen in the menus; address them with the familiar \"you\" where a line needs one.\n\nThe RPG slice: a short JRPG in the manner of Dragon Quest and Final Fantasy. The town of Brightwater's wells ran dry when the Dread Knight took the cave in the northern mountains; three heroes, Rowan (he, the leader and swordsman), Lyra (she, a black mage) and Sera (she, a healer), clear the cave. Townsfolk speak to the party warmly and plainly, the Dread Knight menaces; the tone is light and friendly. Battle commands, menus and items follow Final Fantasy's English conventions (Potion, Hi-Potion, Phoenix Down, Ether); keep them short: they sit in narrow windows and buttons.\n\nLines with ids starting engine. are the engine's own words: its pause menu, settings, controls screen, save slots, notices and key names, shown on every game made with it. Keep them short: they sit on buttons and in narrow rows."
