# my-3D2dge API card (v0.8.0)

my-3D2dge ("My 3D 2D Game Engine") is a general-purpose retro-modern 2D game engine built for AI models. Use it to port, remaster, reimagine and remix games from the 8-bit to 64-bit eras (NES, SNES, Genesis, N64, PS1), or to make spiritual successors to them. Everything is drawn by code: no image or sound files. Characters are 3D skeletons drawn as pixel art, and the camera can be any classic 2D view.

**In the single file:** this card, the engine script (do not edit it), and a starter game between `GAME START` and `GAME END`. The starter has a title menu and five vertical slices (a genre kit file holds only one): ADVENTURE (Zelda-like), PLATFORMER (Mario / Mega Man), BRAWLER (Final Fight / Streets of Rage), SHOOTER (1942 / Xevious) and RPG BATTLE (Dragon Quest / Final Fantasy), plus an ANIMATION LAB (every move, pose and reaction on every skin, in every view; read it to see how each animation is driven). **To make a game, copy the slice closest to your genre, then replace everything between `GAME START` and `GAME END` with only your game: its own title scene, play scene(s) and game-over scene. Delete the starter's menu and the slices you do not use.**

## Quick start (a complete game)
```js
(() => {
const E = My3D2dge, { px, clamp } = E;            // always start like this
const game = new E.Game({ canvas: 'screen', res: 'snes', view: 'threequarter' });
const map = new E.TileMap({
  rows: ['##########', '#@...s...#', '#..##....#', '#........#', '##########'],
  legend: { '#': 1, '@': 'hero', 's': 'slime' },  // number = wall type, string = spawn tag
  types: { 1: { h: 30, top: '#57506a', side: '#3d3750' } },
  floorTex: (x, y) => E.tex.flagstone(x, y, { stones: ['#4b4559', '#554f64'].map(E.hex), mortar: E.hex('#221e2b'), hi: E.hex('#6f6782'), lo: E.hex('#322d3e'), speck: E.hex('#2a2634') })
});
game.cam.bounds = v => map.bounds(v);
const s = map.find('hero'), hero = new E.Body({ x: s.x, y: s.y, r: 5 });
const rig = new E.Humanoid({ hat: 'pointed' });
game.start({
  update(dt) {
    const m = game.input.move(), d = game.view.screenDirToGround(m[0], m[1]);
    hero.vx = d[0] * 80; hero.vy = d[1] * 80; hero.update(dt, map);
    if (Math.hypot(d[0], d[1]) > .1) hero.facing = Math.atan2(d[1], d[0]);
    rig.update(dt, { x: hero.x, y: hero.y, z: hero.z, vx: hero.vx, vy: hero.vy, facing: hero.facing || 0 });
    game.focus(hero.x, hero.y, 10);                // the camera looks here: call every update
  },
  draw(r) {
    map.drawFloor(r); r.shadow(hero.x, hero.y, 5); map.queueWalls(r);
    r.actor(hero.x, hero.y, hero.z, (g, ox, oy) => rig.draw(g, ox, oy, r.view));
    r.text('HELLO', 4, 4, '#ffffff');              // HUD text in screen pixels
  }
});
})();
```

## Look target (read this before drawing anything)
Aim above SNES, level with the best PS1 / N64 2D games (Symphony of the Night, Metal Slug, Legend of Mana, Klonoa). Games that skip these steps look like Atari games. **Every game should use all of them:**
1. **Resolution** `res: 'ps1'` (320x240) or `'snes'`, and characters 40-60 px tall: `new E.Humanoid({ size: 1.3 })` (HD style is the default: shaded volumetric limbs, outfits, hair).
2. **Dress the character**: `outfit: 'tunic' | 'robe' | 'coat'`, `hair: 'short' | 'spiky' | 'long' | 'ponytail'`, `hat`, `armor: true`, `cape`, `sleeves`, and a real palette in `colors` (never leave the defaults on everyone).
3. **Backdrop behind every level**: `const bg = new E.Backdrop('castle-night')` then `bg.draw(r)` first in `draw`. Presets: `day dusk night castle-night city-night desert forest ocean cave space`, or your own `{ sky, sun | moon, stars, starsY: .7, layers: [{ kind: 'mountains' | 'hills' | 'forest' | 'city' | 'castle' | 'clouds' | 'sea' | 'fog' | 'stalactites', color, y, height, parallax, fill }] }` (`starsY` = how far down the stars reach; a layer fills the screen below its skyline unless `fill: false`).
4. **Textured tiles**: PlatformMap styles `stone` (with `moss`), `brick`, `wood`, `metal`, `ground` (with `flower`), `block`, `pipe`, `bonus`; TileMap floors from `E.tex.*`, TileMap walls with `face: 'brick' | 'stone' | 'rock' | 'plank' | 'timber' | 'plaster' | 'hedge'` and tops with `roof: 'tiles' | 'slab' | 'leaves' | 'grass'` (a village = timber and plaster houses with tile roofs, hedges, rock cliffs).
5. **Props in every room** (3-8 per screen): `r.prop(name, x, y, z, { size, color, light: true })` with `torch candle candelabra chandelier brazier window banner pillar statue crate barrel chest pot sign fence lamp door tree pine bush flowers grass rock crystal bones skull vines cobweb lantern streetlamp awning hydrant trashcan firedrum sandbags cactus palm mushroom`. Flames animate, glow and can light the scene. `chest` / `door` take `{ open: true }`, `pillar` takes `{ broken: true }`, `window` is a gothic rose window with lead cames (`colors: [...]` for the glass, `size: 2-3` for a cathedral); hang `vines`, `cobweb`, `lantern` with `{ anchor: 'top' }`. With heroes at size 1.2+, give the scene `propSize: 1.4` (or set `E.style.propSize`) so props match them.
6. **Effects on every hit**: `particles.explosion(x, y, z, size)`, `smoke`, `fire`, `glints`, `sparks`, `game.flash(color, s)`, `game.freeze`, `game.shake`.
7. **Color**: `E.tones(hex)` gives `{ deep, sh, base, lt, hi }` hue-shifted shades and `E.ramp(hex, n)` a palette ramp. Shade everything you draw yourself with them (shadow side `sh`, lit edge `lt`, a `hi` sparkle).
8. **Typography**: the default font is a 5x7 proportional font with lower case. Titles: `E.font.title(g, 'NAME', x, y, { scale: 3, colors: [...], align: 'center' })`. HUD text: `{ shadow: '#000', outline: false }` or `gradient: [top, bottom]`. `font: 'tiny'` is the old 3x5 font.
9. **Faces in dialog**: `talk.say(lines, { name: 'MIRA', portrait: miraRig })` puts a live close-up of that Humanoid (blinking, hair, hat) beside every line. `rig.drawPortrait(g, x, y, 40)` draws one anywhere (HUD, RPG party windows).

## Coordinates: what x, y, z mean in each view
World units: one tile = 16. **z is always up.** Game logic never stores screen pixels.

| View | Looks like | Ground plane | Use for levels | Move with |
|---|---|---|---|---|
| `'iso'` (yaw 45, pitch 30) | Diablo, Landstalker | x/y ground, z up | `E.TileMap` | `E.Body` |
| `'threequarter'` (pitch 55) | Zelda LttP, Stardew | x right, y down the screen | `E.TileMap` | `E.Body` |
| `'topdown'` (pitch 80) | GTA 1, Hotline Miami | x right, y down | `E.TileMap` | `E.Body` |
| `'brawler'` (pitch 25) | Final Fight, 2.5D | x right, y into the screen | `E.TileMap` or `E.PlatformMap` | `E.Body` or `E.Platformer` |
| `'side'` (pitch 0) | Mario, Mega Man | **x right, z up, y = 0 (depth)** | `E.PlatformMap` | `E.Platformer` |
| `'overhead'` (pitch 90, scale 1) | 1942, Tetris, Pac-Man | x = screen x px, y = screen y px | none, or a TileMap | your own x/y, or `E.Body` |

- In `'side'` the screen shows x (right) and z (up). **y is depth and is normally 0.** Focus the camera with `game.focus(hero.x, 0, hero.z + 24)`.
- In ground views, the screen direction the player pushes becomes a world direction through `game.view.screenDirToGround(mx, my)`.
- `r.actor(x, y, z, (g, ox, oy) => ...)` calls your function with `(ox, oy)` = the buffer pixel where world point (x, y, z) lands. Draw the character around that point.

## Rules
1. Keep game logic in world units, and use `dt` everywhere. `update(dt)` runs in fixed steps of about 1/120 s.
2. Draw only with `E.px.*`, `E.font`, `E.ui`, sprites, props and the `r.*` helpers. Never use `ctx.arc`, `ctx.stroke`, `ctx.fillText` or canvas gradients on the game buffer (they blur pixels). For translucency and glow use `px.blend(g, alpha, 'add' | 'multiply' | 'screen' | 'normal', () => {...})`, `px.polyDither`, `px.ddisc`, `r.glowDisc` and `r.shadow`: they use stepped alpha and blend modes like PS1 / SNES hardware (or dithering with `E.style.trans = 'dither'` for an NES / Genesis look).
3. Anything that can overlap anything else goes through `r.actor`, `r.sprite` or `r.queue` (depth sorted). Backgrounds (`r.sky`, `map.drawFloor`, `level.draw`) come first in `draw`.
4. Read input only in `update`. Use `pressed(a)` for one-shot actions (menus, jumps, shots), `down(a)` for held actions, and `buffered(a)` + `consume(a)` for forgiving combat input.
5. Animate from continuous values (velocity, timers, easing), never from frame lists.
6. Colors are `'#rrggbb'` (or `'#rgb'`) strings.
7. Put the whole game in one IIFE `(() => { ... })();` between the markers, and start it with `game.start(...)`.

## Common mistakes (check these first)
- Nothing on screen: the camera looks at the wrong place. Use `game.follow(hero)` once (in the scene's `enter`), or call `game.focus(...)` every update. In side view the hero has y = 0.
- Walls or level missing: you forgot `map.drawFloor(r)` + `map.queueWalls(r)` (TileMap) or `level.draw(r)` (PlatformMap).
- Using a TileMap for a side-scroller. Side-scrollers use `E.PlatformMap` + `E.Platformer`.
- HUD drawn in world coordinates. Use `r.text(...)` or `r.overlay(g => ...)` with screen pixels (`r.W`, `r.H`).
- An old key layout: platformers want `input: 'PLATFORMER'` (Space jumps), shooters `input: 'SHMUP'` (Space fires).
- Errors show in a red box on screen and in the console. Fix the first one first.

## Game
`new E.Game({ canvas: 'screen', view, views, res, input, bg })`
- `res`: `'nes'` 256x240, `'snes'` 256x224, `'genesis'` 320x224, `'gb'` 160x144, `'gba'` 240x160, `'ps1'` / `'n64'` 320x240, `'wide'` 400x225, or `[w, h]`. Fixed pixels, whole-number scaling. Leave it out for an adaptive size.
- Adaptive size: `minW` / `minH` set the scale (the screen shows at least that many pixels), `maxW` / `maxH` cap the view (the rest is letterboxed). `portrait: { maxH: 1000 }` overrides them while the screen is taller than wide, so a phone held upright (9:16) is filled instead of showing a band across its middle. `game.screen.portrait` says which way it is.
- `input`: `'DEFAULT'` (top-down action), `'PLATFORMER'`, `'SHMUP'`, or your own `{ action: ['KeyQ', 'Pad0'] }`.
- `views`: the views your game supports; `game.nextView()` cycles them (bind it to a key).
- Start: `game.start({ update(dt), draw(r) })`, or with scenes (below).
- Methods: `follow(obj, { z: 16, lead: 20 })` (camera tracks it automatically), `focus(x, y, z)` (or aim it yourself every update), `setView(id)`, `nextView()`, `freeze(s)` (hit-stop), `shake(n)`, `after(s, fn)`, `every(s, fn)` (timers in game time, return `{ cancel() }`), `mouseGround()`, `go(scene, data)`, `enableGPU({ map })`.
- Fields: `W`, `H` (screen pixels), `time`, `real`, `timeScale` (0.25 = slow motion), `paused`, `input`, `audio`, `particles`, `lights`, `view`, `errors`, `cam`.
- Camera zoom and turn: `game.setZoom(1.5)` (.5 .. 3; everything drawn by the engine re-rasterizes crisply, the HUD stays), `game.rotateView(45)` (ground views only), `game.resetCamera()`, `game.zoom`, `game.yaw`, `game.note('ZOOM 2x')` (a short notice at the top of the screen). Custom painters can read `r.view.zoom` (undefined at 1x) to scale their own art. The starter binds `-` / `=` / mouse wheel to zoom, `[` / `]` to turn and `0` to reset; a scene limits it with `camera: { zoom: [.75, 2] | false, rotate: true }`.
- Camera: `cam.offset = [dx, dy]` sits the focus that many screen pixels from the centre (above a phone's touch buttons: `[0, -60]`); `cam.bounds = v => map.bounds(v)` keeps it inside the level (in side views a level shorter than the screen sits on the bottom edge; `cam.align = 'center'` to change); `cam.room = [160, 128]` moves screen by screen (Zelda, Metroid) and `cam.moving` is true while it slides; `cam.smooth` = lag in seconds (0 = locked to the target, no lag).

## Scenes (title, play, game over)
```js
game.start({ scene: 'title', scenes: {
  title: { update(dt) { if (game.input.pressed('start')) game.go('play', { level: 1 }); },
           draw(r) { r.sky(['#101848', '#402a70']); r.text('PRESS START', r.W / 2, 100, '#fff', { align: 'center', scale: 2 }); } },
  play: { pausable: true, view: 'side', input: 'PLATFORMER', res: 'snes', views: ['side', 'brawler'], touch: ['jump', 'attack'],
          enter(data) { /* build the level */ }, exit() {}, update(dt) {}, draw(r) {} }
} });
```
`game.go(name, data)` switches before the next step; timers and particles are cleared. `pausable: true` lets Escape / P / Start pause it (a PAUSED screen is drawn for you). `view`, `views`, `input`, `res`, `touch`, `propSize` are applied on entry.

## Input: `game.input`
- Actions in every preset: `up down left right` (WASD, arrows, d-pad), `start` (Enter, Start), `pause` (Escape, P, Start), `confirm` (Enter, Space, J, Z, pad A), `cancel` (Escape, Backspace, X, K, pad B).
- DEFAULT adds `attack` (J, X, click), `dash` (Space, Shift, K), `skill` (L, E, right click), `jump` (Z). PLATFORMER: `jump` (Space, Z, K, pad A), `attack` (X, J, click), `dash` (Shift, C, L), `skill`. SHMUP: `fire` (Space, Z, J, click), `bomb` (X, K).
- `down(a)`, `pressed(a)`, `released(a)`, `repeat(a, delay, rate)` (menus), `buffered(a, win)` + `consume(a)`, `consumeAll()`, `anyPressed()`, `move()` (screen direction `[x, y]`, length up to 1), `use(preset)`, `touchButtons(['jump', 'attack'])`.
- `clear()` releases held inputs, pending presses, virtual sticks and touch buttons; focus loss does this automatically. `suppress(a)` blocks an action for the current tick; `suppressCode('Mouse0')` lets a HUD widget consume that mouse button while other devices bound to the action still work.
- Controller settings: `deadzone` (default `.18`, radial and rescaled), `invertAimY`; diagnostics: `padIndex`, `padId`, `padAxes`, `padPrev`, `lastDevice`. Controllers are detected in any browser slot, and disconnects release their inputs. Bind `PadAxisUp/Down/Left/Right` to menu actions for left-stick navigation.
- Touch settings: `touchEnabled`, `stickSide` (`'left'` or `'right'`), `stickRadius` (CSS pixels), `touchFilter(event)` (return false to reserve a canvas tap for UI). `bindButtons(root)` wires `[data-act]` elements with independent pointer tracking and cancellation cleanup.

## Drawing: `r` in `draw(r)`
- Background: `r.sky(['#top', '#mid', '#bottom'])`, `r.starfield({ count, speed, dir: 'down' | 'left' })`.
- Depth sorted: `r.actor(x, y, z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { flash: '#ffffff', flashMix: .75, alpha, xray, outline, ghost, emissive })` (the flash tints over the sprite so shading shows; `flashMix: 1` is solid; actors up to about 250 px tall), `r.sprite(x, y, z, sprite, { flip, anchor: 'bottom' | 'center', glow, flash })`, `r.queue(x, y, z, g => {...}, { bias })`, `r.box(g, x0, y0, z0, x1, y1, z1, top, side)` (inside a queue function).
- Floor marks: `r.shadow(x, y, radius, alpha, color, surfaceZ)`, `r.decal(g => r.groundArc(...))`, `r.groundDisc`, `r.groundRing`, `r.groundPts(x, y, rad, n, z)`.
- On top, unlit, screen pixels: `r.text(str, x, y, color, { align, scale, outline })`, `r.textAt(x, y, z, str, color)`, `r.overlay(g => {...})`.
- `r.w(x, y, z)` = buffer pixel of a world point. `r.W`, `r.H`, `r.ix`, `r.iy` (pass to dither functions), `r.view`, `r.visible(x, y, z)`.
- X-ray: `r.actor(..., { xray: true })` shows a checkered silhouette of the actor wherever a wall, a prop (`r.prop` hides by default; `hides: false` opts one out) or anything queued with `{ hides: true }` is drawn in front of it. `xray: { color, outline: '#e8fdff', actors: true }` picks the fill color, adds a solid 1-px outline around the hidden part (reads on busy or light surfaces), and with `actors: true` other bodies drawn in front hide it too (a hero stays findable inside a crowd). Afterimages: `ghost: { color, life, alpha, owner }`; `owner` (the actor's `{x, y, z}`) keeps a trail left nearer the camera sorted behind the live body.
- Glowing things you draw yourself: `r.queue(x, y, z, fn, { emissive: true })` is drawn again after lighting so darkness never dims it (flames, lasers, magic, neon). It still hides behind whatever stands in front of it: walls and `r.actor` bodies do this on their own, and any other queued draw can join them with `{ solid: true }`. (Canvas lighting builds a depth-ordered mask for this; `game.r.glowMask = false` skips it on slow machines.)

## Pixels, sprites, text, UI
- `px.rect(g, x, y, w, h, c)`, `dot`, `line(g, x0, y0, x1, y1, c, width)`, `disc(g, x, y, r, c)`, `ell`, `poly(g, pts, c)`, `polyDither(g, pts, c, 0..1, r.ix, r.iy)`, `ddisc`, `sprite(g, spr, x, y, flip)`, `glow(g, 0..1)` (GPU glow for what follows).
- Sprites from strings (for coins, bullets, ships, icons, NES-style enemies): `const COIN = E.sprite(['.yy.', 'yYYy', '.yy.'], { y: '#f0b020', Y: '#fff0a0' }, scale)`. `.` and space are transparent.
- Font (5x7 proportional with lower case; `font: 'tiny'` for 3x5): `E.font.text(g, str, x, y, color, { outline, shadow, gradient, scale, align, wrap, font })`, `E.font.title(g, str, x, y, { scale, colors, outline, depth, depthColor, align })`, `E.font.width(str, opts)`, `E.font.lineHeight(opts)`, `E.font.wrap(str, maxW, opts)`. Glyphs: ASCII plus `♥ ★ ← → ↑ ↓ • × ♪ ▸ ©`.
- UI (inside `r.overlay(g => ...)`): `E.ui.box(g, x, y, w, h, { bg, border, gradient, alpha })` (a gradient window like Final Fantasy; `bg` can be `[top, bottom]`, `gradient: false` for flat, `alpha: .6` for a see-through HUD panel), `E.ui.bar(g, x, y, w, h, 0..1, color)`, `E.ui.hearts(g, x, y, hp, max)` (half hearts allowed), `rig.drawPortrait(g, x, y, size, { zoom: 3, turn: .6, bg, frame, cape: false, weapon: false, tint: '#808080' })` (character close-up; it stays upright while the rig kneels or lies down; `tint` greys out a KO'd hero).
- Dialog: `const talk = new E.Dialog(game)`; `talk.say(['Line one.', 'Page two.'], { name: 'ELDER', portrait: elderRig, onDone, choices: ['YES', 'NO'], onChoice(i) })`; in update `if (talk.update(dt)) return;`; in draw `talk.draw(r)`. `portrait` takes a Humanoid (live close-up; `portraitSize: 40`, `portraitOpts: { zoom, turn }`) or a function `(g, x, y, size) => {...}`. Radio chatter during play: `talk.say('Enemy fighters ahead!', { name, portrait, auto: 2.5, modal: false })` turns its pages and closes by itself while the game keeps running. Per line: `place: 'top' | 'middle' | 'bottom'`, `y` (pixels) and `alpha` (see-through box). A portrait's mouth moves while its text types.
- Menu: `const menu = new E.Menu(game, ['START', { label: 'LOAD', disabled: true }], { x: 'center', y: 100, title, onPick(i, item), onCancel })`; `menu.update(dt)`; `menu.draw(r)`.

## Sound: `game.audio` (chip synth, no files, starts after the first key press)
- `sfx(name, { vol, pitch })`. Presets: `jump jump2 land step coin pickup key powerup oneup heal hit hurt stomp bump swing whoosh punch kick shoot laser charge explode boom door secret warp die select confirm cancel pause text blip`.
- Custom: `sfx({ wave: 'square' | 'pulse' | 'pulse12' | 'triangle' | 'saw' | 'sine' | 'noise', freq: 440 or 'A4', to: 880, dur: .2, vol: .3, arp: [0, 4, 7], step: .05, vib: [8, .03] })`, or `audio.define('zap', voice)`.
- Music: `music('title' | 'adventure' | 'dungeon' | 'boss' | 'victory')` (built in; any other name is an error), or your own `{ bpm: 120, steps: 4, tracks: [{ wave: 'square', vol: .15, notes: 'C5 - E5 - G5 . . . | ...' }, { wave: 'triangle', notes: '...' }, { wave: 'drums', notes: 'k . h . s . h .' }] }`. Tokens: a note (`C4`, `F#3`, `Bb2`), `-` holds, `.` rests, `|` is ignored; drums `k s h o c t`. `music(null)` stops. `mute()`, `setVolume(0..1)`.

## Levels
**TileMap** (top-down, isometric, brawler): walls stand on the ground plane.
- `new E.TileMap({ rows, legend, types, floorTex, block: ['water', 'lava'], ao: 5 })` (`ao` = width of the contact shadow along wall bases, 0 = none). `types[id] = { h, top, side, line, course, cut: true, cutH, face, roof, beam }` (`cut` lowers walls that block the camera; `face`: `'brick'` (default) `'stone' 'rock' 'plank' 'timber' 'plaster' 'hedge' 'none'`; `roof`: `'speckle'` (default) `'plain' 'tiles' 'slab' 'leaves' 'grass'`; `beam` = timber color). `floorTex(x, y, floorTag, view)` returns `[r, g, b]` (or `[r, g, b, glow]`); ready-made: `E.tex.flagstone`, `grass`, `dirt`, `water`, `planks`, `checker`, `plain`.
- Legend values: a number = wall type, a string = spawn tag, `{ tile, floor, spawn, block }` for both. `block: true` (or the map's `block` list of floor tags) makes deep water, lava or pits stop walkers (jumping bodies pass over); `walkable(cx, cy)`, `block(cx, cy, on)` (a bridge appears). FlowField paths go around blocked cells.
- `find(tag)` / `findAll(tag)` give `{ x, y, z, cx, cy }`. Also `cell(cx, cy)`, `set(cx, cy, id)` (open doors), `toCell(x, y)`, `center(cx, cy)`, `heightAt(x, y)`, `floorAt(x, y)`, `groundAt(x, y, r, z)`, `collide(body)`, `los(x0, y0, x1, y1)`, `bounds(view)`, `drawFloor(r)`, `queueWalls(r)`.

**PlatformMap** (side-scrollers; 2.5D in tilted views): tiles on the x/z plane, top row first.
- `new E.PlatformMap({ rows, legend, types })`. `types[id] = { kind, style, side, top, line }`. Example: `rows: ['      ?    ', '   ===     ', '@  g   ^^  ', '###########']`, `legend: { '#': 1, '=': 2, '?': 3, '^': 4, '@': 'hero', 'g': 'walker' }`, `types: { 1: { style: 'ground', side: '#8a5a32' }, 2: { kind: 'oneway' }, 3: { style: 'bonus', side: '#e8a830' }, 4: { kind: 'hazard' } }`. Kinds: `'solid'` (default), `'oneway'` (jump up through), `'ladder'`, `'slope'` (`dir: 1` rises to the right, `-1` to the left; `from` / `to` heights 0..1 for gentle slopes), `'hazard'` (spikes, lava), `'deco'`, `'back'` (background wall). Styles: `'block' 'brick' 'ground' 'plank' 'spikes' 'ladder' 'pipe' 'bonus' 'liquid' 'plain'`.
- Spawns: `find(tag)` gives `{ x, z }` with z = the bottom of that cell (feet). Standing on the ground means z = the top of the floor tiles (`level.groundBelow(x, z)`, which returns `null` over a pit), not z = 0. `cell(cx, cz)` / `set(cx, cz, id)` count cz from the bottom row. `slopeZ(cx, cz, x)`, `touching(body, 'hazard')`, `cellsTouching(body, kind)`, `groundBelow(x, z)`, `solidAt(x, z)`, `move(body, dt, solids)`, `bounds(view)`, `draw(r)` (call first, after `r.sky`), `width`, `height`.

## Movement and physics
**Platformer** (side-scroller character): `const hero = new E.Platformer({ x, z, w: 8, h: 22, run: 95, jump: 285, gravity: 800, airJumps: 0, wallJump: false, dash: 0 })`.
- Each update: `hero.update(dt, level, game.input, movingPlatforms)`. For enemies pass `{ x: -1..1, jump, jumpPressed, up, down, dash }` instead of the input.
- Read: `onGround`, `jumped`, `landed`, `facing` (1 or -1), `air`, `climbing`, `hitWall`, `hitCeiling`, `bumped` (`{ cx, cz, id }` of a block hit from below). Methods: `knock(dir)`, `rigState(extra)` (feed it to `rig.update`).
- Built in: coyote time, jump buffering, variable jump height (let go early for a short hop), slopes and small steps (sticks to the ground going down), ladders (up / down), drop through one-way tiles (down + jump), optional double jump, wall jump and dash.
- Moving platforms: `{ x, z, w, h, vx, vz }` boxes you move yourself and pass as `solids`; riders are carried.

**Body** (top-down / isometric / brawler): `new E.Body({ x, y, r: 5, friction: 0, bounce: 0, gravity: 700 })`. Set `vx`, `vy`, then `body.update(dt, map)`. Also `push(ix, iy, iz)` (knockback), `jump(v)`, and `onGround`, `z`, `groundZ`, `hitWall`, `landed`, `bounced` (hit the ground and bounced: dust, a thud). Walls lower than your feet are walkable, so bodies can jump onto blocks.

**Attack** (melee timing for swords, punches, kicks): `const slash = new E.Attack('slash')` (a move from `E.MOVES`, optionally with overrides: `new E.Attack('thrust', { reach: 10 })`) or a spec `{ a0, a1, z0, z1, reach, wind, active, recover }`. `if (input.buffered('attack') && slash.start()) input.consume('attack')`; `slash.update(dt)` (returns the phase that just began); `slash.hits(enemies, e => E.inArc(hero, facing, e, 22, 1.4), e => {...})` hits each target once per swing during `'active'` (moves wait until `hitAt: .35` of the swing, so hit-stop freezes the strike, not the wind-up); `rig.update(dt, { ..., attack: slash.state })`. Also `busy`, `active`, `cancel()`. **Combo**: `const combo = new E.Combo(['jab', 'cross', 'hook', 'uppercut'], { window: .3 })` (names, specs or Attacks); `combo.press()` starts or chains the next hit; `update`, `hits`, `state`, `step` work the same. **Knockback**: `E.knockback(attacker, target, 160, up)` pushes a Body (or anything with vx / vy) away.

**Bullets**: `const shots = new E.Bullets(game, { plane: 'ground' | 'side' })`; `shots.fire({ x, y, z, vx, vy, vz, r: 2, team: 'player', color, life, dmg, pierce, sprite })`; `shots.burst(base, E.pattern.spread(angle, n, arc, speed))`; `shots.update(dt, map)`; `shots.hit(targets, (b, t) => {...}, 'player')`; `shots.draw(r)`; `shots.clear(team)`. Patterns: `E.pattern.dir(angle, speed)`, `aim(a, b, speed)`, `aimSide(a, b, speed)`, `spread(angle, n, arc, speed)`, `ring(n, speed, offset)`. In side view the second number of a pattern velocity is vz.

**Helpers**: `E.dist(a, b)`, `E.angleTo(a, b)`, `E.overlap(a, b)` (circles x, y, r), `E.overlapBox(a, b)` (side boxes x center, z feet, w, h), `E.inArc(a, facing, b, range, halfAngle)` (melee cone), `E.rand(a, b)`, `E.randInt(a, b)`, `E.pick(list)`, `E.chance(p)`, `E.prune(list, fn)`, `E.store.get(key, fallback)` / `set(key, value)` (save data), `new E.SpatialHash(32)` (`build(list)`, `near(x, y, r, fn)`), `new E.FlowField(map)` (`update(tx, ty)`, `dir(x, y, tx, ty)` walks around walls), math `clamp lerp approach ease.* angDiff approachAng smoothDamp rng(seed) noise2 hex shade mix`; `E.version` (the release) and `E.versionLabel()` ('v0.7.0 · a1b2c3d 2026-10-07': show it on a title or a debug screen).

## Characters
**Humanoid** (knights, heroes, soldiers, zombies): `new E.Humanoid({ size: 1.3, build: 'chibi' (default) | 'heroic' (tall, SotN) | 'bulky' (brawlers, bosses) | 'skeleton' (rib cage, skull, glowing eye sockets; tint with colors.bone), weapon: 'sword' (the default) | 'gun' | 'staff' | null (fists), outfit: 'shirt' | 'tunic' | 'robe' | 'coat', hair: 'short' | 'spiky' | 'long' | 'ponytail' | 'bald', hat: 'cap' | 'pointed' | 'helmet' | 'band' | 'crown' (or { style, color }), sleeves: 'short' | 'long' | 'none', armor, hood, cape: { len: 6, width: 5, seg: 2.5 }, eyeGlow, hunch, lean, style: 'hd' (default) | 'classic' (stick figures for huge crowds), colors: { skin, hair, cloth, coat, pants, boot, belt, trim, glove, cape, capeIn, metal, plate, hilt, eye, iris } })` (`metal` colors the weapon, `plate` the armor, defaulting to `metal`).
- `rig.update(dt, { x, y, z, vx, vy, facing, dash, hurt, air, point, aim, attack })`. `facing` is an angle (side view: 0 = right, `Math.PI` = left). `air: true` tucks the legs for jumps; `point: true` holds a gun forward; `aim` tilts it (radians, + = up: `aim: .8` shoots diagonally up, `Math.PI / 2` straight up).
- **Moves** (`E.MOVES`, use them instead of hand-made specs; every one has anticipation, a committed strike with lunge / step / lean / twist, follow-through and a clean return to the stance, on every build and in every view):
  - blades and clubs: `slash backslash overhead rising thrust spin plunge twohand`;
  - fists: `jab` (left hand) `cross hook uppercut haymaker elbow`;
  - kicks: `kick roundhouse sweep flyingkick knee axekick`;
  - other: `cast` (both hands) `throw bash claw`.
  Give each character its own set (a knight: `overhead`, `thrust`, `spin`; a mage: `cast`; a monk: `jab`, `cross`, `roundhouse`; a boss: `haymaker`, `sweep`). `E.move('uppercut', .5)` is the attack state of any move at any moment (previews, cutscenes).
- `attack: { spec, phase: 'wind' | 'active' | 'recover', u: 0..1 }`, spec `{ a0, a1, z0, z1, reach, r0, r1, hand, rel, blade, spin, kick, plane, lunge, hop, crouch, lean, twist, hold }`. Angles are relative to facing (+ = right hand side). `rel: true`: heights relative to the shoulder and reach scaled by arm length (kick heights as a share of hip height). `r0`/`r1`: reach that extends (thrusts, jabs). `hand: 'L' | 'both'`. In side views horizontal swings turn into the screen plane (a Castlevania chop) by themselves; `plane: 'side' | 'ground'` (or the rig option `swingPlane`) chooses. `lunge` steps into the strike (body motion in local units, clamped to -4..5; to move the character itself, add speed to your body), `hop` lifts the body, `crouch` dips in the wind-up, `hold` is how long the end pose holds (share of recover). You time the phases.
- In steep ground views (threequarter) rigs and Blobs are drawn from a lower, sprite-like angle so faces show, like SNES RPG sprites (`charView: false` turns it off for one rig, `E.style.charPitch = false` for all).
- Faces (eyes with catch-lights, brows, mouth), a cheated 3/4 turn toward the camera in side views (`cheat: .5`, 0 turns it off) and hair layers are automatic. `face: { eyes: 'big' (anime / Mana style), bangs: 0..1 }`.
- Poses: `rig.update(dt, { ..., pose: 'cheer' | 'cast' | 'guard' | 'kneel' | 'crouch' | 'wave' | 'hips' | 'down' })` (victory with the weapon raised, spell casting, a boxer's guard, hurt or resting, ducking, greeting, a cocky idle, knocked out; they blend in and out), `'block'` (weapon held upright across the body), `'die'` (a stagger, the knees give, then the body topples), `expr: 'smile' | 'shout' | 'angry' | 'wince'` (faces and portraits), `run: 0..1` (run in place), or `down: 0..1` to lie a defeated body flat (centred on its position). `stance: 'guard'` keeps fists up while walking (brawlers; the free hand guards the chin during punches), `stance: 'ready'` holds the weapon forward. `climb: true` with `vz` climbs a ladder hand over hand (`Platformer.rigState()` passes both). Every wind-up starts from the rig's current pose, so chained hits and hand changes never snap. Idle rigs breathe and shift their weight by themselves.
- `rig.draw(g, ox, oy, view)` inside `r.actor`, `rig.drawSmear(r)` (a glowing trail along the real blade, fist or foot path, in every view), `rig.debug(r)` (skeleton), `rig.kick(v)` (squash and stretch), `rig.hand()` and `rig.tip()` (world points to spawn bullets from).
**Blob** (slimes, rabbites, bats, imps, round monsters): `new E.Blob({ R: 6, colors: { dk, base, lt, spec, eye, pupil }, ears: 'rabbit' | 'cat', horns: true, wings: true, feet: true, tail: true, mouth: true | 'fangs', face: 'front' })`, `update(dt, { squash: -0.4..0.4, look: [dx, dy], squint, walk: 0..1, flap: 0..1 (wing speed; 0 folds them), hang: true (roost upside down) })`, `kick(v)`, `draw(g, ox, oy, view)`. Mix the parts for a bestiary: `wings` + `mouth: 'fangs'` is a bat, `ears: 'rabbit'` + `feet` a Mana rabbite, `horns` + `tail` an imp.

## Effects and lighting
- Particles: `game.particles.explosion(x, y, z, size)` (fireball, smoke, sparks, debris, ring, shake, sound), `fire(x, y, z, n, { size })`, `smoke(x, y, z, n, { size, color })`, `glints(x, y, z, n, color)`, `dust(x, y, z, n)`, `sparks(x, y, z, n, angle)`, `bits(x, y, z, n, colors)`, `ring(x, y, r0, r1, color, dur)`, `text(x, y, z, '12', color, { scale: 2, bounce: true })` (bouncing damage numbers), `add({ kind: 'dust' | 'spark' | 'bit' | 'ember' | 'fire' | 'smoke' | 'glint', ... })`. `explosion(x, y, z, size, { debris, freeze: false, shake: 0 })` for chains of small blasts. Side-scrollers: `particles.ground = (x, y, z) => level.groundBelow(x, z)` so sparks and debris bounce on platforms. Screen flash: `game.flash('#ffffff', .12, strength 0..1)`.
- Lighting (works in every view, side-scrollers included, no WebGPU needed): `game.lights.enabled = true; game.lights.ambient = .5;` then every draw `game.lights.add(x, y, z, radius, intensity, { color: '#ffa050' })`. Dark areas get a smooth cool tint, lights add their own color, and emissive items (flames, sparks, bullets, `emissive: true`) stay bright. `lights.darkness` (0..1) and `lights.tint` tune it. Props with flames can light the scene: `r.prop('torch', x, y, z, { light: true })`. Lamps, street lamps, lanterns and crystals glow on their own (`haloR`, `haloColor`, `halo: false`); `cone: true` adds a light cone under a street lamp.
- Hits: `game.hitFx(x, y, z, { power: 1, angle, damage: 12, textScale: 2, textZ: 22 })` does hit-stop, shake, an impact star, sparks, a bouncing damage number (`bounce: false` floats it) and a sound in one call; `particles.impact(x, y, z, size, color)` for the star alone.
- GPU lighting (optional, ground views with a TileMap): `const gpu = game.enableGPU({ map })`; mark glowing things with `px.glow(g, 1)`; add `lights.caster(x, y, r, top)` and `lights.heat(x, y, z, w)`. It falls back to Canvas lighting by itself.

## Genre playbook (NES, SNES, Genesis, N64, PS1)
| Genre (examples) | View | Build it with | Copy slice |
|---|---|---|---|
| Platformer (Mario, Mega Man, Sonic, Castlevania) | `side` (+ `brawler` for 2.5D) | PlatformMap, Platformer, Humanoid, sprites, Bullets `'side'` | PLATFORMER |
| Metroidvania (Metroid, Symphony of the Night) | `side` | PlatformMap per room, `cam.room`, Platformer with `dash`, `wallJump` | PLATFORMER |
| Action adventure (Zelda, Secret of Mana) | `threequarter` or `topdown` | TileMap rows, `cam.room`, Body, Humanoid + `E.Attack` sword, Dialog, `E.ui.hearts` | ADVENTURE |
| Action RPG / dungeon (Diablo, Landstalker) | `iso` | TileMap, FlowField, Body (jump onto blocks), GPU lighting | ADVENTURE |
| Beat-'em-up (Final Fight, Streets of Rage, TMNT) | `brawler` | TileMap street strip, Body, Humanoid (`weapon: null`) + `E.Combo` punches and `kick: true` kicks, `E.knockback`, waves that lock the screen | BRAWLER |
| Fighting (Street Fighter II) | `side` | PlatformMap floor, two Platformers, Humanoid + `E.Attack` moves, `overlapBox` hitboxes | BRAWLER + PLATFORMER |
| Shoot-'em-up (1942, Gradius, R-Type) | `overhead` (vertical) or `side` (horizontal) | sprites, Bullets, `E.pattern`, `r.starfield`, a timeline of waves | SHOOTER |
| Twin-stick / run-and-gun (Smash TV, Contra) | `topdown` / `side` | Body or Platformer, Bullets, `weapon: 'gun'`, `point: true` | SHOOTER + ADVENTURE |
| JRPG (Dragon Quest, Final Fantasy, EarthBound) | `threequarter` town, `brawler` battles | TileMap towns, Dialog, Menu, scenes, `E.store` saves | RPG BATTLE + ADVENTURE |
| Puzzle (Tetris, Dr. Mario, Puyo) | `overhead` | a grid array, `input.repeat`, `px.rect`, `E.font`, fixed `res` | SHOOTER (setup) |
| 3D platformer or adventure remake (Mario 64, Ocarina, Crash) | `iso` / `threequarter` / `brawler` | TileMap blocks of different heights + Body `jump()` (z is real height) | ADVENTURE |
| Racing (RC Pro-Am, Micro Machines) | `topdown` / `iso` | TileMap track (floorTex), Body with friction, cars drawn with `px.poly` on `r.w()` corner points | ADVENTURE |

**Sizes:** at 320x240, heroes should be 40-60 px tall: `new E.Humanoid({ size: 1.2-1.4 })` in the default views. Bosses 1.8-2.4. Small things (coins, bullets, ships, pickups) are string sprites designed at 8-16 px, drawn at scale 2 if they are the player's ship. Keep hitboxes smaller than the art.

**Feel numbers** (world units per second, tile = 16): walk 70-90, run 95-140, jump 250-320 with gravity 800, fall cap 330, dash 200-260, bullets 250-320 (player) and 70-120 (enemy), enemy walk 25-45. Hit feedback: `game.freeze(.05)`, `game.shake(2)`, `particles.sparks`, `audio.sfx('hit')`.

## Before you hand the game back
- One IIFE between the markers, starting with `const E = My3D2dge`. Only your game: no leftover starter menu or unused slices. No other files, no network, no libraries.
- Title screen and game-over screen as scenes; `pausable: true` on gameplay scenes.
- The camera follows the player (`game.focus` every update) and shows the level; the HUD uses screen pixels.
- Sound effects on jump, hit, pickup and death; music per scene.
- The look target list above: backdrop, textured tiles, props, sized and dressed HD characters, effects, title font. Compare your screenshots with Symphony of the Night or Metal Slug, not with NES games.
- If you can run commands: `node tools/check.mjs game.html` (add `#scene` to jump to a scene). It presses start, plays, cycles the views, prints how much of the screen is filled and how many colors it uses, adds look notes (flat areas, checkerboard dithering, low contrast, a thin palette), and fails on any error. Act on every look note. `node tools/filmstrip.mjs game.html#scene --steps "wait:1500 press:Enter wait:800 rec:16:2 press:KeyJ" --crop x,y,w,h` records an animation frame by frame into one contact sheet: check every attack with it (a swing must wind up, strike, and settle back without jerks or backward sweeps).
- Animation variety: every character has its own moves from `E.MOVES` (not one shared swing), enemies telegraph with a visible wind-up, and reactions play out (hurt, knockback, `down`, victory `cheer`).

<script>
/* ---- inlined from engine/my-3d2dge.js (minified; the readable engine is in the repo) ---- */
/*!
 * my-3D2dge v0.8.0  (My "3D" 2D Game Engine)
 * Procedural pixel-puppet engine for every 2D perspective.
 * https://github.com/michaelcrosato/my-3d2dge  (MIT License)
 *
 * READ THIS FIRST (humans and AI models extending a my-3D2dge game)
 * -----------------------------------------------------------------------------
 * 0. EVERY GAME STARTS WITH  const E = My3D2dge;  and then uses E.Game, E.px, ...
 * 1. WORLD SPACE IS 3D. x = east, y = south, z = up. One floor tile = 16 units.
 *    Game logic never thinks about screen pixels.
 * 2. A VIEW turns world points into screen pixels. Swap the view and the whole game
 *    re-renders from another angle: E.VIEWS.iso, .threequarter, .topdown,
 *    .brawler, .side  (or build your own: new E.View(id, label, yaw, pitch, scale, zBoost)).
 * 3. CHARACTERS ARE RIGS, NOT SPRITES. E.Humanoid and E.Blob recompute their
 *    joints from math every step, in 3D, then project them. That is why they move
 *    fluidly and can face any angle in any view without extra art. Small things
 *    (coins, bullets, icons) can be pixel sprites written as strings: E.sprite().
 * 4. PIXEL RULES. Draw with E.px (rect, line, disc, ell, poly, sprite...). Every shape
 *    snaps to whole pixels. Never use ctx.arc / ctx.stroke / ctx.fillText on the game
 *    buffer: they anti-alias and break the look. Translucency and glow go through
 *    px.blend / polyDither / ddisc / r.glowDisc: stepped alpha and blend modes like PS1
 *    hardware (E.style.trans = 'dither' switches to NES / Genesis style dithering).
 * 5. FRAME ORDER (handled by the Renderer):
 *      background (r.sky, map.drawFloor or level.draw) -> decals (ground marks, shadows)
 *      -> sorted queue (walls, props, actors, particles) -> lighting -> overlays -> present
 *    Anything that can be in front of or behind something else goes through
 *    r.queue(x, y, z, fn), r.actor(x, y, z, drawFn, opts) or r.sprite(...).
 * 6. TIME. game.start({ update(dt), draw(r) }) or game.start({ scenes, scene }).
 *    update runs in fixed ~1/120 s substeps, so motion is identical at 60, 120 or
 *    144 Hz. game.freeze(s) = hit-stop, game.shake(n) = screen shake,
 *    game.timeScale = slow motion, game.paused = pause, game.after(s, fn) = timer.
 * 7. LEVELS. Top-down / isometric / brawler floors: E.TileMap (walls on the ground
 *    plane). Side-scrollers: E.PlatformMap + E.Platformer (tiles on the x/z plane,
 *    solid, one-way, ladders, hazards, moving platforms). Both read ASCII rows.
 * 8. SOUND, TEXT, MENUS. game.audio.sfx('jump'), game.audio.music(song);
 *    E.font.text(...) (5x7 proportional font), E.font.title(...), E.ui.box/bar/hearts,
 *    new E.Dialog(game), new E.Menu(game, items).
 * 8b. LOOK. Aim for PS1 / N64 era 2D, not NES: HD rigs (size, outfit, hair, armor),
 *    new E.Backdrop('castle-night') behind levels, textured tiles (stone, brick, wood,
 *    metal), r.prop('torch', ...) set dressing, particles.explosion / smoke / fire,
 *    game.flash, and E.tones(hex) / E.ramp(hex) for hue-shifted shading.
 * 9. GPU LIGHTING is optional: game.enableGPU({ map }). Mark glowing things with
 *    px.glow(g, 1) inside queue callbacks, pass { color, shadow } to lights.add, and
 *    register shadow casters with game.lights.caster(). Falls back to Canvas lighting.
 * Errors in your game are shown on screen and in the console (game.errors).
 * The compact API card is API.md (also embedded in the single-file edition).

<script>
/* ---- inlined from src/starter (00-shell.js, 30-shooter.js, 90-start.js) ---- */
/* ============================== GAME START ==============================
 * MY-3D2DGE STARTER: a title menu, five vertical slices and an animation lab (a genre kit file holds one). Each slice is a complete
 * small game, written to be copied and changed:
 *   SLICE 1  ADVENTURE   top-down action adventure (Zelda, Secret of Mana): rooms, sword,
 *                        key and locked door, NPC dialog, hearts, rupees, torch lighting
 *   SLICE 2  PLATFORMER  side-scroller (Mario, Mega Man): E.PlatformMap + E.Platformer,
 *                        stomp and shoot, ? blocks, ladder, moving platform, 2.5D view (V)
 *   SLICE 3  SHOOTER     vertical shoot-'em-up (1942, Xevious): E.Bullets, waves, boss
 *   SLICE 4  RPG BATTLE  turn-based battle (Dragon Quest, Final Fantasy): E.Menu, turns
 *   SLICE 5  BRAWLER     beat-'em-up (Final Fight, Streets of Rage): E.Combo punches, kicks,
 *                        knockback, depth lanes, waves that lock the screen, a boss
 * To make your own game: copy the slice closest to your genre, then replace everything
 * between GAME START and GAME END with ONLY your game: its own title, play and game-over
 * scenes. Delete this menu and the slices you do not use. Deep links: #adventure (etc.).
 * ======================================================================== */
(() => {
'use strict';
const E = My3D2dge, { px, clamp, lerp, approach, TAU } = E;

/* ---- SHELL: one game, several scenes. Each slice switches view, keys and resolution on entry ---- */
const game = new E.Game({ canvas: 'screen', res: 'ps1', view: 'side', bg: '#07060d' });
const P = game.particles, L = game.lights, A = game.audio;
const scenes = {};
let gpu = null;                               // WebGPU lighting, used by the adventure slice only
const best = (k, v) => { const old = E.store.get('best:' + k, 0); if (v > old) E.store.set('best:' + k, v); return Math.max(old, v); };
const SLICES = [
  { id: 'adventure', label: 'ADVENTURE', about: 'TOP-DOWN ACTION ADVENTURE' },
  { id: 'platformer', label: 'PLATFORMER', about: 'SIDE-SCROLLING PLATFORMER' },
  { id: 'brawler', label: 'BRAWLER', about: 'SIDE-SCROLLING BEAT-EM-UP' },
  { id: 'shooter', label: 'SHOOTER', about: 'VERTICAL SHOOT-EM-UP' },
  { id: 'rpg', label: 'RPG BATTLE', about: 'TURN-BASED BATTLE' },
  { id: 'animlab', label: 'ANIMATION LAB', about: 'EVERY MOVE, SKIN AND VIEW' }
];
/* keys every slice shares: V changes the camera view, - and = (or the mouse wheel) zoom, [ and ] turn the camera,
   0 resets it, G toggles GPU lighting, M mutes. A scene limits the camera with camera: { zoom: [min, max] | false, rotate: true } */
const ZOOMS = [.5, .75, 1, 1.25, 1.5, 2, 2.5, 3];
const camOpt = () => (game.scene && game.scene.camera) || {};
const zoomStep = d => {
  const lim = camOpt().zoom; if (lim === false) return;
  const [lo, hi] = lim || [.75, 2], i = ZOOMS.findIndex(z => z >= game.zoom - 1e-6), z = clamp(ZOOMS[clamp(i + d, 0, ZOOMS.length - 1)], lo, hi);
  game.setZoom(z); game.note('ZOOM ' + z + 'x');
};
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'KeyV') { game.nextView(); game.note(game.view.label.toUpperCase() + ' VIEW'); }
  else if (e.code === 'Minus' || e.code === 'NumpadSubtract') zoomStep(-1);
  else if (e.code === 'Equal' || e.code === 'NumpadAdd') zoomStep(1);
  else if (e.code === 'Digit0') { game.resetCamera(); game.note('CAMERA RESET'); }
  else if ((e.code === 'BracketLeft' || e.code === 'BracketRight') && camOpt().rotate) { game.rotateView(e.code === 'BracketLeft' ? -45 : 45); game.note('TURN ' + game.yaw); }
  else if (e.code === 'KeyM') A.mute();
  else if (e.code === 'KeyG' && gpu) gpu.enabled = !gpu.enabled;
});
let wheelT = 0;
addEventListener('wheel', e => { const t = performance.now(); if (t - wheelT > 120) { wheelT = t; zoomStep(e.deltaY < 0 ? 1 : -1); } }, { passive: true });

/* ---- TITLE: a lineup of HD heroes on a torch-lit castle ledge under a dusk sky ---- */
const stage = new E.PlatformMap({ rows: ['SSSSSSSSSSSSSSSSSSSSSSSSSSSSSS', 'SSSSSSSSSSSSSSSSSSSSSSSSSSSSSS'], legend: { S: 1 },
  types: { 1: { style: 'stone', side: '#6a5a78', moss: '#4a6a3a' } }, edges: 'open' });
const titleBg = new E.Backdrop('castle-night');
const HEROES = [   // one hero per genre slice, each dressed with the HD rig options
  { x: 170, face: 0, rig: new E.Humanoid({ size: 1.25, build: 'heroic', armor: true, hair: 'short', cape: { len: 6, width: 6, seg: 2.6 }, colors: { cloth: '#3a5ab0', cape: '#b02a3a', capeIn: '#5a1020', hair: '#e0b050', trim: '#e8c860' } }) },
  { x: 205, face: 0, rig: new E.Humanoid({ size: 1.25, outfit: 'tunic', hair: 'spiky', hat: { style: 'pointed', color: '#3aa050' }, colors: { cloth: '#3aa050', pants: '#e8dcc0', hair: '#e0b040', trim: '#8a5a2a' } }) },
  { x: 240, face: 0, rig: new E.Humanoid({ size: 1.3, build: 'bulky', weapon: null, hat: { style: 'band', color: '#e03a3a' }, colors: { cloth: '#f0f0f0', pants: '#2f5fd0' } }) },
  { x: 275, face: Math.PI, rig: new E.Humanoid({ size: 1.25, weapon: 'gun', hat: 'cap', sleeves: 'long', colors: { cloth: '#d83a2a', pants: '#2f5fd0', glove: '#f0f0f0' } }) },
  { x: 310, face: Math.PI, rig: new E.Humanoid({ size: 1.25, weapon: 'staff', outfit: 'robe', hair: 'ponytail', sleeves: 'long', colors: { cloth: '#6a3ab0', hair: '#c8402a', trim: '#e8c860' } }) }
];
const titleMenu = new E.Menu(game, SLICES.map(s => s.label), { y: 76, onPick: i => game.go(SLICES[i].id) });
scenes.title = {
  view: 'side', views: ['side', 'brawler'], input: 'DEFAULT', res: 'ps1',
  enter() { A.music('title'); game.resetCamera(); game.follow(null); game.focus(240, 0, 84); game.cam.room = null; game.cam.bounds = null; if (gpu) gpu.enabled = false; L.enabled = false; },
  update(dt) {
    titleMenu.update(dt);
    const t = game.time;
    HEROES.forEach((h, i) => {
      const u = (t * .45 + i * .37) % 3, swing = u < .5 ? { spec: { a0: 1.4, a1: -1.6, z0: 12, z1: 8, reach: 7.5 }, phase: u < .15 ? 'wind' : 'active', u: u < .15 ? u / .15 : (u - .15) / .35 } : null;
      h.rig.update(dt, { x: h.x, y: 0, z: 32, facing: h.face, vx: 0, vy: 0, attack: swing, point: i === 3 && u < .6 });
    });
  },
  draw(r) {
    titleBg.draw(r);
    stage.draw(r);
    for (const x of [140, 340]) r.prop('torch', x, 0, 32, { size: 1.3, light: false });
    for (const x of [187, 293]) r.prop('banner', x, -8, 64, { size: 1.1, color: '#8a1a2a' });
    for (const h of HEROES) r.actor(h.x, 0, 32, (g, ox, oy) => h.rig.draw(g, ox, oy, r.view));
    r.overlay(g => {
      E.font.title(g, 'my-3D2dge', r.W / 2, 12, { align: 'center', scale: 4, colors: ['#fffbe8', '#ffe08a', '#ffb347', '#e0662a'], depth: 3 });
      E.font.text(g, 'My "3D" 2D Game Engine', r.W / 2, 48, '#e8e0ff', { align: 'center', gradient: ['#ffffff', '#c8b8f0'], shadow: '#140c1c', outline: false });
      E.font.text(g, SLICES[titleMenu.i].about, r.W / 2, r.H - 14, '#ffe7a8', { align: 'center', shadow: '#000', outline: false });
    });
    titleMenu.draw(r);
    r.text('Arrows + Enter   V view   - = zoom   M mute   ? API', r.W / 2, r.H - 26, '#b8b0d8', { align: 'center', shadow: '#000', outline: false });
  }
};

/* ---- GAME OVER: shared by every slice ---- */
const overMenu = new E.Menu(game, ['Retry', 'Title'], { y: 118, onPick: i => game.go(i === 0 ? overMenu.from : 'title') });
const overBg = new E.Backdrop({ sky: ['#12040c', '#3a0c1c', '#6a1a28'], moon: { x: .5, y: .3, r: 16, color: '#e8a0a0' }, stars: 30,
  layers: [{ kind: 'mountains', color: '#2a0c16', y: .72, height: .3, parallax: 0 }, { kind: 'fog', color: '#8a2a3a', y: .9, height: .12, parallax: 0, drift: 4 }] });
scenes.over = {
  view: 'side', input: 'DEFAULT', res: 'ps1',
  enter(d) { overMenu.from = d.from; overMenu.i = 0; A.music(null); A.sfx('die'); game.follow(null); game.focus(0, 0, 0); if (gpu) gpu.enabled = false; L.enabled = false; },
  update(dt) { overMenu.update(dt); },
  draw(r) { overBg.draw(r); r.overlay(g => E.font.title(g, 'GAME OVER', r.W / 2, 60, { align: 'center', scale: 4, colors: ['#ffe0e0', '#ff7a6a', '#c8202a'], depthColor: '#3a0810' })); overMenu.draw(r); }
};

/* =====================================================================================
 * SLICE 3  SHOOTER  (vertical shoot-'em-up: Raiden, 1943, Strikers 1945)
 * A tall "tate" screen (240 x 320) scrolls up over farmland, a river town and an air base where a flying fortress waits.
 * 'overhead' maps world x/y to screen pixels; the 272 px world pans a little with the ship. z only orders the drawing:
 * ground 0-3, air shadows 4, clouds 5-6, aircraft 8-12, air blasts 14, ship bullets 20; foe bullets over every panel.
 * PS1 LOOK: real alpha and additive light (px.blend), never dither; altitude shadows, one-point perspective buildings.
 * HUD on top, radio calls in a see-through box at the bottom edge. Z / Space fires (a tap: a burst), X bombs.
 * game.go('shooter', { at: 30 }) starts at the boss.
 * ===================================================================================== */
const SHOOT = (() => {
  const W = 240, H = 320, WW = 272, MAP_H = 84 * 16, SCROLL = 32, PERSP = .0042, D = Math.PI / 2, INTRO = 3.2;   // screen, world width, stage length, scroll px/s, building perspective, stage card seconds

  /* ---- 1. PS1 LIGHT: px.blend draws with real alpha ('normal') or additive light ('add') ---- */
  // a round glow baked once per size and color: 4 nested discs (visible steps)

  const charge = (o, secs, fire) => { o.chg = o.chg0 = secs; o.shot = fire; };
  function bossFire(f) {   // pods: aimed fans; core: rings, then a needle spiral; wing guns: needles down their line of fire
    const [L, R, core] = f.parts, rage = L.hp <= 0 && R.hp <= 0, pat = E.pattern; f.fire = rage ? .09 : .12; f.n++;

  /* ---- 7. UPDATE ---- */

      if (inp.pressed('fire')) ship.burst = .5;

        fireT = .07; ship.gun = .035; A.sfx('shoot', { vol: .2 });
        for (const [dx, da] of [[-5, 0], [5, 0], [-10, -.08], [10, .08], [-13, -.2], [13, .2], [-4, -.34], [4, .34]].slice(0, power * 2)) shots.fire({ x: ship.x + dx, y: ship.y - 16, z: 20, vx: Math.sin(da) * 440, vy: -Math.cos(da) * 440, r: 3, life: .9, team: 'ship' });
      }

    }
    for (const f of foes) {

        else if (f.art?.[4]) {   // heli, bomber: the nose gun flashes and the craft recoils
          const heli = f.kind === 'heli', m = muzzle(f); f.fire = heli ? 1.3 : 1.1; f.kick = 1; add({ k: 'flash', x: m[0], y: m[1], r: heli ? 4 : 6, life: .1, air: true });

  /* ---- 8. DRAW ---- */
  function craft(r, f, z, o) {   // r.actor adds outline, rim light, hit flash; a gun's kick rocks the craft back 2 px
    const [parts, pal, s, alt] = f.art || [], k = (f.kick || 0) * 2, fn = parts ? (g, x, y) => plane(g, x - Math.cos(f.a) * k, y - Math.sin(f.a) * k, f.a, f.bank, parts, PAL[pal], s) : (g, x, y) => (f.kind === 'tank' ? tank : gun)(g, x, y, f);
    // the altitude shadow (a depth cue since 1943): hull and wings as one see-through silhouette, offset along the sun
    if (alt) { const sil = f.art.sil ??= parts.filter(p => /hull|wing/.test(p[0])); r.actor(f.x + alt * SUN[0], f.y + alt * SUN[1], 4, (g, x, y) => plane(g, x, y, f.a, f.bank, sil, PAL.dead, s), { flash: '#04080e', flashMix: 1, alpha: .75, outline: false }); }
    r.actor(f.x, f.y, z, fn, o);
    if (parts && !PAL[pal].off) r.queue(f.x, f.y, z + .2, g => { for (const q of nozzles(parts, ...r.w(f.x, f.y), f.a, s)) glow(g, q[0], q[1], 3 + 3 * s, '#ff8030', .7); });
    if (f.kind === 'heli') r.queue(f.x, f.y, z + .3, g => {   // the tail rotor turns edge-on (a blade that grows and shrinks), then the main rotor
      const [x, y] = r.w(f.x, f.y), T = frame(x, y, f.a, 1.3), c = Math.cos(f.t * 37) * 3.5; px.line(g, ...T(3, -23 - c), ...T(3, -23 + c), '#9aa4ae'); rotor(g, x, y, f.t);
    });

      const u = 1 - f.fire / TELL, [x, y] = r.w(...muzzle(f)), c = f.kind === 'heli' ? '#ff4a9a' : '#ff8a30';
      glow(g, x, y, 2 + u * 6, c, u); px.blend(g, u, 'add', () => ring(g, x, y, 2 + (1 - u) * 12, 1, c));
    });
  }
  function draw(r) {
    map.drawFloor(r);
    r.decal(g => {   // craters; glints drifting downstream make the river flow
      for (const c of craters) crater(g, r, c);
      px.blend(g, .5, 'normal', () => { for (let i = 0; i < 30; i++) { const y = scroll - 10 + (i * 53 + game.time * 22) % (H + 20), x = RIVER(y) + (i * 29 % 21) - 10; if (river(x, y) < -4) px.rect(g, ...r.w(x, y), 2 + i % 3, 1, '#a8d4e8'); } });
    });
    for (const b of BLDS) if (b.y < scroll + H + 20 && b.y + b.d > scroll - 30) r.queue(b.x + b.w / 2, b.y + b.d, 1, g => building(g, r, b));
    for (const p of PROPS) if (p.y > scroll - 4 && p.y < scroll + H + 44) r.prop(p.name, p.x, p.y, 0, { size: p.s, color: TINT[p.name] });

      const x = c.x, y = scroll + c.y;
      r.queue(x, y, 1.6, g => px.blend(g, .25, 'normal', () => g.drawImage(c.art.s, ...r.w(x + 26, y + 36).map(Math.round))));

    for (const f of foes) if (f.kind === 'boss') bossLayers(r, f); else craft(r, f, f.air ? (f.kind === 'bomber' ? 8 : 10) : 2, { flash: f.flash > 0 && '#ffffff' });
    for (const it of items) r.queue(it.x, it.y, 18, g => {   // a capsule spinning (width = cos)
      const [x, y] = r.w(it.x, it.y), w = Math.abs(Math.cos(it.t * 5)) * 6 + 1, c = E.tones(it.type === 'P' ? '#e8482e' : '#3ab04a');
      glow(g, x, y, 12, c.lt, .6); px.ell(g, x, y, w + 1, 7, '#1a0a10'); px.ell(g, x, y, w, 6, c.base); px.ell(g, x - w * .3, y - 2, w * .5, 3, c.hi);
    });
    if (ship.respawn <= 0) {   // muzzle flashes; wingtip vapor in a hard bank; a pulsing shield while invulnerable
      craft(r, ship, 12);
      r.queue(ship.x, ship.y, 12.5, g => { const [x, y] = r.w(ship.x, ship.y), vapor = Math.abs(ship.bank) - .4; if (ship.gun > 0) for (const d of [-5, 5]) { glow(g, x + d, y - 21, 8, '#ffc050'); px.rect(g, x + d - 1, y - 25, 3, 7, '#fff8d0'); }
        if (vapor > 0) for (const s of [-1, 1]) { const q = frame(x, y, -D, 1.2)(12.8 * roll(ship.bank, s), -6); px.blend(g, vapor, 'add', () => px.line(g, q[0], q[1], q[0] - ship.bank * 4, q[1] + 11, '#c8dcff')); }
        if (ship.inv > 0) px.blend(g, .5 + Math.sin(game.real * 20) * .25, 'add', () => ring(g, x, y, 22, 2, '#58b8ff')); });
    } else if (ship.respawn > 1.6) { const u = (2 - ship.respawn) / .4;   // spinning out: turns, rolls and drops (the shadow slides in), flickering red
      craft(r, { ...ship, a: u * u * 4 - D, bank: Math.sin(u * 12), art: [PLAYER, 'player', 1.2 - u * .5, 40 - u * 40] }, 12, { flash: game.real * 20 % 2 < 1 && '#ff6a40' });
    }
    r.queue(0, scroll, 20, g => bullets(g, r, 'ship')); r.overlay(hud); talk.draw(r); r.overlay(g => bullets(g, r, 'foe'));   // never hidden by a panel
  }

  /* ---- 9. HUD: see-through windows (E.ui.box alpha) on top, led by the pilot's live portrait. Radio chatter (Star Fox 64):

  const LIFE = E.sprite(['....w....', '...wbw...', '...www...', '.r.www.r.', 'rrrwwwrrr', 'rr.www.rr', '...w.w...', '...o.o...'], { w: '#e8e4ee', b: '#5ab0f0', r: '#c83a30', o: '#ff9a30' });

  const PILOT = new E.Humanoid({ size: 1.3, weapon: null, hair: 'spiky', face: { eyes: 'big', bangs: .8 }, colors: { hair: '#e0a040', cloth: '#c83a30', trim: '#2f58d0', skin: '#f0c8a0' } });
  const HQ = new E.Humanoid({ size: 1.3, weapon: null, build: 'bulky', hair: 'bald', hat: { style: 'cap', color: '#4a5a3a' }, colors: { skin: '#d8a880', cloth: '#4a5a3a', trim: '#e8c060' } });
  const BLUE = ['#3a4c98', '#0a0e2a'], RED = ['#8a2a36', '#1c060c'], GOLD = '#e8c870';
  const talk = new E.Dialog(game, { lines: 2, border: GOLD });
  // radio calls: a see-through box on the bottom edge (Star Fox 64), clear of the lanes where enemies enter. The speaker's live
  // close-up acts out the line: mood is its rig.update state (a pose, expr), cam its portrait framing; the mouth moves while it types
  const radio = (rig, name, line, mood, cam) => {
    PILOT.mood = HQ.mood = null; rig.mood = mood; talk.bg = rig === HQ ? RED : BLUE;
    talk.say(line, { name, auto: 2.5, modal: false, alpha: .7, portrait: rig, portraitOpts: { zoom: 3, turn: .4, upright: false, ...cam } });
  };
  const txt = (g, s, x, y, c, o) => E.font.text(g, s, x, y, c, Object.assign({ shadow: '#05060c', outline: false }, o));
  function hud(g) {
    const mid = W / 2, win = (x, y, w, h, bg) => E.ui.box(g, x, y, w, h, { bg, border: GOLD, alpha: .8 });
    const band = (y, h, c) => { px.blend(g, .6, 'normal', () => px.rect(g, 0, y, W, h, c)); for (const yy of [y, y + h - 1]) px.rect(g, 0, yy, W, 1, GOLD); };   // see-through band, gold rules
    // pilot portrait; score, lives, bombs
    PILOT.drawPortrait(g, 4, 4, 21, { zoom: 2.2, turn: .4, upright: false, bg: ship.respawn > 0 ? RED : BLUE, border: GOLD });
    win(27, 2, 74, 25, BLUE); txt(g, '1P', 31, 5, '#ffd36a'); txt(g, pad(score), 46, 5, '#fff', { gradient: ['#ffffff', '#9ac0ff'] });
    for (let i = 0; i < lives; i++) px.sprite(g, LIFE, 31 + i * 10, 16); for (let i = 0; i < bombs; i++) px.sprite(g, BOMBI, 94 - i * 7, 17);
    // hi-score; lit power chevrons run hot
    win(W - 76, 2, 74, 25, RED); txt(g, 'HI', W - 72, 5, '#ff9a7a'); txt(g, pad(Math.max(score, E.store.get('best:shooter', 0))), W - 55, 5, '#fff', { gradient: ['#ffffff', '#ffc8a0'] });
    txt(g, power < 4 ? 'POW' : 'MAX', W - 72, 17, '#ffd36a');
    for (let i = 0; i < 4; i++) { const x = W - 48 + i * 10, on = i < power; px.poly(g, [[x, 16], [x + 5, 16], [x + 9, 20], [x + 5, 24], [x, 24], [x + 4, 20]], on ? ['#ffd040', '#ffa030', '#ff6a30', '#ff3a5a'][i] : '#5a6494'); px.line(g, x + 1, 16, x + 5, 16, on ? '#fff4c0' : '#9aa4d0'); }
    if (boss) {   // a pale damage trail drains after the health
      const f = boss.parts[2].hp / boss.parts[2].max, w = Math.round(118 * f); win(44, 30, 152, 13, RED); txt(g, 'BOSS', 48, 33, '#ff9a8a');
      E.ui.bar(g, 72, 34, 120, 6, boss.trail, '#ffe8b0', { border: '#140b12', bg: '#2a0a12' }); px.rect(g, 73, 35, w, 4, boss.flash > 0 ? '#ff8a90' : '#e8404a'); px.rect(g, 73, 35, w, 1, '#ff9aa0');
    }
    if (t < INTRO) {   // stage card above the radio call; nobody fires until it clears
      band(40, 62, '#080a1c'); E.font.title(g, 'STAGE 1', mid, 46, { align: 'center', scale: 3 });
      txt(g, 'EMERALD VALLEY', mid, 74, '#fff', { align: 'center', gradient: ['#ffffff', '#b8f0c0'] }); txt(g, 'Z shot     X bomb', mid, 87, '#c8d0f0', { align: 'center' });
    }
    if (warnT > 0) {
      band(60, 62, '#2a0406');
      E.font.title(g, 'WARNING', mid, 75, { align: 'center', scale: 3, colors: ['#ffffff', Math.floor(warnT * 5) % 2 ? '#ff8a7a' : '#ffe0d0', '#e0202a'], depthColor: '#3a0808' }); txt(g, 'A HUGE ENEMY APPROACHES', mid, 101, '#ffd0c0', { align: 'center' });
    }
    if (won && t - won > 2.2) { win(12, 64, W - 24, 52, BLUE); E.font.title(g, 'STAGE CLEAR', mid, 70, { align: 'center', scale: 3 }); txt(g, 'SCORE  ' + pad(score), mid, 98, '#fff', { align: 'center', gradient: ['#ffffff', '#ffe08a'] }); }
  }
  return { view: 'overhead', views: ['overhead'], input: 'SHMUP', res: [W, H], pausable: true, touch: ['fire', 'bomb'], propSize: 1,
    camera: { zoom: false },   // the playfield is the whole screen: zooming in would hide bullets and push the ship off the bottom
    enter(d) {   // the camera is shared: set it here, restore on exit
      reset((d && d.at) || 0); game.resetCamera(); Object.assign(game.cam, { bounds: null, room: null, smooth: 0 }); A.music('adventure'); L.enabled = false; if (gpu) gpu.enabled = false;
    },
    exit() { game.cam.smooth = .18; }, update, draw };
})();
scenes.shooter = SHOOT;

/* ---- START: the title menu, or a slice named in the address (#platformer) ---- */
// a genre kit file holds one slice: the menu lists only the slices in this file
for (let i = SLICES.length - 1; i >= 0; i--) if (!scenes[SLICES[i].id]) SLICES.splice(i, 1);
titleMenu.items = SLICES.map(s => s.label);
const first = (location.hash || '').slice(1);
game.start({ scenes, scene: scenes[first] ? first : 'title' });
window.__game = { game, scenes };
})();
/* =============================== GAME END =============================== */

</script>
