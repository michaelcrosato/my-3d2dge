# my-3D2dge API card (v0.93.0)

my-3D2dge ("My 3D 2D Game Engine") is a general-purpose retro-modern 2D game engine built for AI models. Use it to port, remaster, reimagine and remix games from the 8-bit to 64-bit eras (NES, SNES, Genesis, N64, PS1), or to make spiritual successors to them. Everything is drawn by code: no image or sound files. Characters are 3D skeletons drawn as pixel art, and the camera can be any classic 2D view.

**Start from a kit:** each genre has one, a complete small game written to be copied (the Genre playbook below names it). In a single file it sits between `GAME START` and `GAME END`: the starter's shell (the game, its title menu, the proof), the slice and the start; a genre kit holds one slice, `dist/my-3d2dge.html` every one and the ANIMATION LAB (how each animation is driven). In the handoff package each kit's game is `kits/<id>.js` (a 3D kit's `kits/3d-<id>.js`), readable. **To make a game, change the slice into yours, with its own title, play and game-over scenes, and delete the starter's menu and the slices you do not use. The engine is yours to change too:** fix, extend or rewrite any of it as you see fit.

**This kit's engine** leaves out the sections its game never calls (the kit diet: the file's header lists them). A name from one warns once, naming its section, and a class throws; the card describes the full engine, `dist/my-3d2dge.html`.

**Looking a name up:** grep `API-INDEX.md` (every public name, one line; members are filed under instance names: `rig.`, `talk.`, `mover.`, `flow.`, `map.`), not the engine's source. It, the guide (`AI_GUIDE.md`) and the tools are in the handoff package (`dist/handoff/`) and the repository. A 3D name (`E.World3D`, `world.camera`) is in the 3D engine's header, its manual (`engine/my-3d2dge-3d.js`; `my-3d2dge-3d.js` in the handoff package).

## Quick start (a complete game)
This kit's engine leaves out `E.TileMap`, `E.tex`, `E.Body`, which the card's quick start (a top-down walk) is built on. This kit's quick start is its own game, between `GAME START` and `GAME END`: the slice's header says what it plays and how. `API.md` and the reference editions have the card's.

## Look target (read this before drawing anything)
Aim above SNES, level with the best PS1 / N64 2D games (Symphony of the Night, Metal Slug, Legend of Mana, Klonoa). Games that skip these steps look like Atari games. **Every game should use all of them:**
1. **Resolution** `res: 'ps1'` (320x240) or `'snes'`, with `expand: true` so it fills any screen (anchor the HUD to `r.W` / `r.H`), and characters 40-60 px tall: `new E.Humanoid({ size: 1.3 })` (HD style is the default: shaded volumetric limbs, outfits, hair).
2. **Dress the character**: an `outfit`, `hair`, a `hat`, `armor`, a `cape`, `sleeves` (Characters), and a real palette in `colors` (never leave the defaults on everyone).
3. **Backdrop behind every side-view level**: `const bg = new E.Backdrop('castle-night')` then `bg.draw(r)` first in `draw` (a ground view's floor runs on to the screen's edges: `map.outside`). Presets: `day dusk night castle-night city-night desert forest ocean cave space`, or your own `{ sky, sun | moon, stars, starsY: .7, layers: [{ kind: 'mountains' | 'hills' | 'forest' | 'city' | 'castle' | 'clouds' | 'sea' | 'fog' | 'stalactites', color, y, height, parallax, fill }] }` (`starsY` = how far down the stars reach; a layer but clouds, fog and stalactites fills the screen below its skyline unless `fill: false`).
4. **Textured tiles**: PlatformMap styles `stone` (with `moss`), `brick`, `wood`, `metal`, `ground` (with `flower`), `block`, `pipe`, `bonus`; TileMap floors from `E.tex.*`, TileMap walls with `face: 'brick' | 'stone' | 'rock' | 'plank' | 'timber' | 'plaster' | 'hedge'` and tops with `roof: 'tiles' | 'slab' | 'leaves' | 'grass'` (a village = timber and plaster houses with tile roofs, hedges, rock cliffs).
5. **Props in every room** (3-8 per screen): `r.prop(name, x, y, z, { size, color, light: true })` with `torch candle candelabra chandelier brazier window banner pillar statue crate barrel chest pot sign fence lamp door tree pine bush flowers grass rock crystal bones skull vines cobweb lantern streetlamp awning hydrant trashcan firedrum sandbags cactus palm mushroom`. Flames animate, glow and can light the scene. `chest` / `door` take `{ open: true }`, `pillar` takes `{ broken: true }`, `window` is a gothic rose window with lead cames (`colors: [...]` for the glass, `size: 2-3` for a cathedral); hang `vines`, `cobweb`, `lantern` with `{ anchor: 'top' }`. With heroes at size 1.2+, give the scene `propSize: 1.4` (or set `E.style.propSize`) so props match them.
6. **Effects on every hit**: `particles.explosion(x, y, z, size)`, `smoke`, `fire`, `glints`, `sparks`, `game.flash(color, s)`, `game.freeze`, `game.shake`.
7. **Color**: `E.tones(hex)` gives `{ deep, sh, base, lt, hi }` hue-shifted shades and `E.ramp(hex, n)` a palette ramp. Shade everything you draw yourself with them (shadow side `sh`, lit edge `lt`, a `hi` sparkle).
8. **Typography**: the default font is a 5x7 proportional font with lower case. Titles: `E.font.title(g, 'NAME', x, y, { scale: 3, colors: [...], align: 'center' })`. HUD text: `{ shadow: '#000', outline: false }` or `gradient: [top, bottom]`. `font: 'tiny'` is the old 3x5 font.
9. **Light every scene**: `game.lights.enabled = true; game.lights.ambient = .5` in a scene's `enter`, then each draw a few lights where light comes from (`r.prop('lamp', x, y, 0, { light: true })`, `game.lights.add(x, y, z, 60, .9, { color })`): dusk, torchlight and glows give depth. It looks the same in every browser and check; `game.enableGPU({ map })` adds shadows in ground views, and falls back to it.
10. **Faces in dialog**: `talk.say(lines, { name: 'MIRA', portrait: miraRig })` puts a live close-up of that Humanoid (blinking, hair, hat) beside every line. `rig.drawPortrait(g, x, y, 40)` draws one anywhere (HUD, RPG party windows).

## Coordinates: what x, y, z mean in each view
World units: one tile = 16. **z is always up.** Game logic never stores screen pixels.

| View | Looks like | Ground plane | Use for levels | Move with |
|---|---|---|---|---|
| `'iso'` (yaw 45, pitch 30) | Diablo, Landstalker | x/y ground, z up | `E.TileMap` | `E.Body` |
| `'threequarter'` (pitch 55) | Zelda LttP, Stardew | x right, y down the screen | `E.TileMap` | `E.Body` |
| `'topdown'` (pitch 80) | GTA 1, Hotline Miami | x right, y down | `E.TileMap` | `E.Body` |
| `'brawler'` (pitch 25) | Final Fight, 2.5D | x right, y into the screen | `E.TileMap` or `E.PlatformMap` | `E.Body` or `E.Platformer` |
| `'side'` (pitch 0) | Mario, Mega Man | **x right, z up, y = 0 (depth)** | `E.PlatformMap` | `E.Platformer` |
| `'overhead'` (pitch 90, scale 1) | 1942, Galaga, Pac-Man | x = screen x px, y = screen y px | none, or a TileMap | your own x/y, or `E.Body` |

- A unit is `r.ppu` pixels: at zoom 1 iso 1.41, overhead 1, the others 1.5 (a tile about 24). A sprite's pixel is a screen pixel (`{ world: true }`: it grows with the view, as rigs and maps do).
- In `'side'` the screen shows x (right) and z (up). **y is depth and is normally 0.** Focus the camera with `game.focus(hero.x, 0, hero.z + 24)`.
- In ground views, the screen direction the player pushes becomes a world direction through `game.view.screenDirToGround(mx, my)`.
- `r.actor(x, y, z, (g, ox, oy) => ...)` calls your function with `(ox, oy)` = the buffer pixel where world point (x, y, z) lands. Draw the character around that point.

## Rules
1. Keep game logic in world units, and use `dt` everywhere. `update(dt)` runs in exact fixed steps: every 1/120 s of real time is one step of `dt = 1/120 * game.timeScale`, the same at any refresh rate (`game.alpha` = the part of a step left over).
2. Draw only with `E.px.*`, `E.font`, `E.ui`, sprites, props and the `r.*` helpers. Never use `ctx.arc`, `ctx.stroke`, `ctx.fillText` or canvas gradients on the game buffer (they blur pixels). For translucency and glow use `px.blend(g, alpha, 'add' | 'multiply' | 'screen' | 'normal', () => {...})`, `px.polyDither`, `px.ddisc`, `r.glowDisc` and `r.shadow`: they use stepped alpha and blend modes like PS1 / SNES hardware (or dithering with `E.style.trans = 'dither'` for an NES / Genesis look).
3. Anything that can overlap anything else goes through `r.actor`, `r.sprite` or `r.queue` (depth sorted). Backgrounds (`r.sky`, `map.drawFloor`, `level.draw`) come first in `draw`.
4. Read input only in `update`. Use `pressed(a)` for one-shot actions (menus, jumps, shots), `down(a)` for held actions, and `buffered(a)` + `consume(a)` for forgiving combat input.
5. Animate characters from continuous values (velocity, timers, easing): the rigs, not frame lists.
6. Colors are `'#rrggbb'` (or `'#rgb'`) strings.
7. Put the whole game in one IIFE `(() => { ... })();` between the markers, and start it with `game.start(...)`.

## Common mistakes (check these first)
- Nothing on screen: the camera looks at the wrong place. Use `game.follow(hero)` once (in the scene's `enter`), or call `game.focus(...)` every update. In side view the hero has y = 0.
- Walls or level missing: you forgot `map.drawFloor(r)` + `map.queueWalls(r)` (TileMap) or `level.draw(r)` (PlatformMap).
- Using a TileMap for a side-scroller. Side-scrollers use `E.PlatformMap` + `E.Platformer`.
- HUD drawn in world coordinates. Use `r.text(...)` or `r.overlay(g => ...)` with screen pixels (`r.W`, `r.H`).
- An old key layout: platformers want `input: 'PLATFORMER'` (Space jumps), shooters `input: 'SHMUP'` (Space fires).
- Errors show in a red box on screen and in the console. Fix the first one first.
- Colours are `'#rrggbb'`, `rgb()`, `hsl()` or a basic name ('orange'); any other draws magenta.
- `mouseGround()` is `[x, y]`; `settings.reset(group)` resets a group ('Sound'; none: all), not a key; `particles.explosion()` adds a hit-stop and a shake (`{ freeze: false, shake: 0 }`); `E.font.text` outlines unless `outline: false`.
- A frame past 50 ms gives up its time (no catch-up): a test in a slow browser waits on the game's state, not the clock.

## Game
`new E.Game({ canvas: 'screen', view, views, res, expand, input, bg })`
- `res`: `'nes'` 256x240, `'snes'` 256x224, `'genesis'` 320x224, `'gb'` 160x144, `'gba'` 240x160, `'ps1'` / `'n64'` 320x240, `'wide'` 400x225, or `[w, h]`. Fixed pixels: whole-number scaling on a desktop screen, the largest fit on a phone (Settings, Pixel scaling). Leave it out for an adaptive size.
- `expand: true`: full screen at any shape, no bars. `res` becomes the least the screen shows and `r.W` x `r.H` grows to fill the window (a 16:9 monitor shows about 427x240 of `'ps1'`, a phone held upright about 320x690). Anchor the HUD to `r.W` and `r.H`, and give the level something to show in the extra space (more of it, a backdrop, a HUD deck under it on a tall screen). `expand: { maxW, maxH }` caps the growth. A scene may set it too.
- Adaptive size: `minW` / `minH` set the scale (the screen shows at least that many pixels), `maxW` / `maxH` cap the view (the rest is letterboxed). `portrait: { maxH: 1000 }` overrides them while the screen is taller than wide, so a phone held upright (9:16) is filled instead of showing a band across its middle. `game.screen.portrait` says which way it is.
- `input`: `'DEFAULT'` (top-down action), `'PLATFORMER'`, `'SHMUP'`, `'THIRDPERSON'`, or your own `{ action: ['KeyQ', 'Pad0'] }`.
- `views`: the views your game supports; `game.nextView()` cycles them (bind it to a key).
- Start: `game.start({ update(dt), draw(r) })`, or with scenes (below).
- Methods: `follow(obj, { z: 16, lead: 20 })` (camera tracks it automatically), `focus(x, y, z)` (or aim it yourself every update), `setView(id)`, `nextView()`, `freeze(s)` (hit-stop: `update` waits; `game.hitstop` is the time left), `shake(n)`, `after(s, fn)`, `every(s, fn)` (timers in game time, return `{ cancel() }`), `hook('input' | 'step' | 'enter', fn)` (your own each step, paused too for input; returns its removal), `mouseGround()`, `go(scene, data)`, `enableGPU({ map })`.
- Fields: `W`, `H` (screen pixels), `time`, `real`, `timeScale` (0.25 = slow motion), `paused`, `input`, `audio`, `particles`, `lights`, `view`, `errors`, `cam`. `game.fail('my power', err)` reports an error in your code (logged, in `errors`, on the error panel) and plays on.
- Camera zoom and turn: `game.setZoom(1.5)` (.5 .. 3; everything drawn by the engine re-rasterizes crisply, the HUD stays), `game.rotateView(45)` (ground views only), `game.resetCamera()` (to the scene's zoom), `game.zoom`, `game.yaw`, `game.note('ZOOM 2x')` (a short notice at the top of the screen; `game.shownNote` is the one showing). Custom painters can read `r.view.zoom` (undefined at 1x) to scale their own art.
- The player's zoom: a scene's `camera: { zoom: [.75, 2], start: 1, tall: 1.5 }` lets the player zoom within `zoom` from `start` (wheel, `-` `=`, pinch, Settings; `false`: none; `AI_GUIDE.md`, Camera).
- Tests and tools: `new E.Game({ headless: true })` (the default in Node: no screen, sound or DOM; `draw` is skipped, or with `draw: true` run on a stand-in, its errors in `game.errors`) or `{ loop: false }` runs only by `game.advance(seconds, { draw })` (exact fixed steps at once); `input.tap(action)` presses for one step, `input.hold(action, on)`; `game.debug = { snapshot() {...} }` is your game's handle (`tools/check.mjs` prints it); `game.stop()`, `start()`, `dispose()`.
- Sessions: `?record=1`, then the pause menu's Save session; `node tools/replay.mjs session.json` replays it exactly, headless (`AI_GUIDE.md`, Sessions).
- Camera: `cam.offset = [dx, dy]` sits the focus that many screen pixels from the centre (above a phone's touch buttons: `[0, -60]`); `cam.bounds = v => map.bounds(v)` keeps it inside the level (in side views a level shorter than the screen sits on the bottom edge; `cam.align = 'center'` to change); `cam.room = [160, 128]` moves screen by screen (Zelda, Metroid) and `cam.moving` is true while it slides; `cam.smooth` = lag in seconds (0: locked to the target); `cam.window = [48, 24]` a dead zone the focus moves in before the camera follows; `cam.snapY = true` follows a followed body's height only when it lands (side-scrollers); `cam.frame([p1, p2], { margin, zoom: [.5, 1] })` keeps them all in view, zooming out as they part (`frame(null)` stops); `cam.free = { keys, edge: 10, drag, speed: 300, bounds: [x0, y0, x1, y1] }` a free camera (strategy, sims): keys, a stick, the screen's edge or a drag pan it, a zoom goes toward the pointer or the pinch.

## Scenes (title, play, game over)
```js
game.start({ scene: 'title', scenes: {
  title: { update(dt) { if (game.input.pressed('start')) game.go('play', { level: 1 }); },
           draw(r) { r.sky(['#101848', '#402a70']); r.text('PRESS START', r.W / 2, 100, '#fff', { align: 'center', scale: 2 }); } },
  play: { pausable: true, view: 'side', input: 'PLATFORMER', res: 'snes', views: ['side', 'brawler'], touch: ['jump', 'attack'],
          enter(data) { /* build the level */ }, exit() {}, update(dt) {}, draw(r) {} }
} });
```
`game.go(name, data)` switches after a short dithered fade (`game.fadeTime`: a test advances past it; `{ fade: 0 }` cuts; `{ fade: 'wipe' | 'iris' | 'mosaic' | 'swirl' | 'dissolve' | 'white', seconds: .4, at: hero }` a transition, a plain fade under reduce motion); timers (but `after(s, fn, { keep: true })`) and particles are cleared, a hit-stop ends (`timeScale` stays). `pausable: true`: Escape / P / Start pauses it, with the pause menu (below). `view`, `views`, `input`, `res`, `expand`, `touch`, `camera`, `propSize` are options applied on entry (a method so named warns). A scene is one object every visit: reset its state in `enter`. `back()` takes a phone's back gesture first (true if it went back: a sub-menu closed).

## Motion and timing: tweens, scripts, paths, weather
- Tweens (Phaser's): `game.tween(door, { y: 40 }, .5, { ease: 'outBack', delay, repeat, yoyo, onDone, keep })` eases numbers on game time: paused with the game, slowed by `timeScale`, ended by a scene change unless `keep`. Returns `{ done, cancel() }`. `E.ease` has Penner's set: `linear`, `inSine` `outSine` `inOutSine`, `inQuad` `outQuad` `inOutQuad`, the same for `Cubic`, `Back`, `Elastic`, `Bounce`.
- Scripts (Unity's coroutines) for cutscenes, boss patterns, wave timelines, tutorials:
```js full-script
game.script(function* () {
  yield 1;                                   // seconds of game time
  yield E.until(() => door.open);            // a condition
  yield game.tween(boss, { y: 80 }, 1.5);    // a tween (or another script, or a generator) finishing
  for (let w = 0; w < 3; w++) { spawnWave(w); yield E.any([8, () => enemies.length === 0]); }
});
```
  `E.all([...])` waits for all; a bare `yield` waits one step. It runs at once to its first `yield`, the same at any refresh rate; `{ keep: true }` outlives the scene; `.cancel()`, `.done`, `.value`.
- Paths: `const p = new E.Path([[x, y, z], ...], { closed, smooth: 'catmull' })`: `p.length`, `p.at(d)` (`{ x, y, z, angle }` by distance along: moving platforms, dives, rails), `p.nearest(x, y)` (a racer's progress), `p.draw(r)` to see it.
- Weather: `game.weather = { kind: 'rain' | 'snow' | 'ash' | 'leaves' | 'sand', amount: .8, wind: .3, lightning: .2 }` (null: clear) falls through the world in every view, settles or splashes, flashes and thunders; cosmetic only (its own random stream), and it ends with the scene: set it in `enter`.
- Wrap-around (Asteroids): `x = E.wrap(x, 0, W)`, `E.wrapDiff(a, b, W)` (the short way across the seam), and `wrap: [W, H]` on `r.sprite` or `r.actor` draws a copy across each edge.

## Standard features (every game has them: don't build your own)
With no code: a **pause menu** on pausable scenes (Resume, Settings, Controls, Full screen, Quit to title; keys, mouse, gamepad and touch), **settings** saved per game (`game.settings`: volume, music, effects, mute, reduce motion, shake and flashes, pixel scaling, a screen filter, the frame rate and its readout), **controls** the player rebinds (conflicts said first; dead zone, invert aim and move, button symbols, vibration; touch button side, size, opacity), **full screen** (a phone's first tap, a top-right button, the menu; turning it off is remembered), a **menu button** at the top right (on a touch screen it stays in play: it is the touch START), a **way out** of every menu screen, the **back gesture** stepping back in the game (`game.back()`) before it leaves the page, **pausing** when the page is hidden or the controller unplugs, and a page set up for phones (safe areas, no scrolling, zooming or pull to refresh on the canvas).
- Adjust: `new E.Game({ menu: { items: [['Restart', fn]], settings: [{ key: 'hints', label: 'Hints', value: true }, { key: 'difficulty', options: ['Easy', 'Normal', 'Hard'], value: 'Normal' }], controls: { attack: 'Sword', skill: false }, quit: 'title' } })`, then read `game.settings.hints`. Leave parts out: `menu: false` (your own pause), `fullscreen: 'button' | false`, `corner: false`, `backGesture: false`, `autoPause: false`, `touch: 'never'` (a phone is told a controller or keyboard is needed). `game.cornerArea()`: where the corner's buttons cover the screen (or null): keep a HUD clear of it.
- Save slots (`game.saves`): three slots and an autosave, each with its place, level and time played. `game.saves.write = () => ({ data, place, level })` and `read = save => {...}`; then `save(slot)` (0, 1, 2 or `'auto'`), `load(slot)`, `copy(a, b)`, `erase(slot)`, `autosave()`, `list()`, `latest()` (a title's Continue). `menu: { saves: true }` (or `{ slots, version, migrate(data, from) }`) puts Save (while `saves.canSave`: a save point) and Load in the pause menu, and `saves.show('save' | 'load')` opens the screen from your own menu. Blocked storage keeps them for the visit.
- Prompts: `game.input.label('jump')` is that action's key or button on the player's device, after rebinding ('Space', 'A', '✕'). PlayStation symbols by default: `settings: [{ key: 'glyphs', value: 'playstation' }]` (a standard key without a label sets its default). A canvas title's OPTIONS: `game.menu('settings')`. From code: `game.settings.set(key, v)`, `game.fullscreen.toggle()` (from a key, click or tap), `game.pause(reason)`, `game.resume()`. `live: true` (or `game.menu(name, { pause: false })`): menus over a world that keeps stepping (online play).
- **Boot**: heavy setup in steps behind a boot screen, and a report for any error before play: `game.start({ scenes, scene, boot: { title, steps: [['Building the city', () => { map = build(); }]] } })` (`AI_GUIDE.md`, Boot).

## Input: `game.input`
- Actions in every preset: `up down left right` (WASD, arrows, d-pad), `start` (Enter, Start), `pause` (Escape, P, Start), `confirm` (Enter, Space, J, Z, pad A), `cancel` (Escape, Backspace, X, K, pad B).
- DEFAULT adds `attack` (J, X, click), `dash` (Space, Shift, K), `skill` (L, E, right click), `jump` (Z). PLATFORMER: `jump` (Space, Z, K, pad A), `attack` (X, J, click), `dash` (Shift, C, L), `skill`. SHMUP: `fire` (Space, Z, J, click), `bomb` (X, K). THIRDPERSON: `sprint` (Shift), `jump` (Space), `crouch` (C, Ctrl), `interact` (E, F), `attack` (J), `block` (K), `dodge` (L), `use` (Q), `map` (M, Tab).
- `down(a)`, `pressed(a)`, `released(a)`, `repeat(a, delay, rate)` (menus), `buffered(a, win)` + `consume(a)`, `consumeAll()`, `anyPressed()`, `move()` (screen direction `[x, y]`, length up to 1), `use(preset)`, `touchButtons(['jump', 'attack'])`, `touchSet('confirm', 'TALK', near)` (a context button: relabel it, or hide it while it has nothing to do).
- Moves: `input.motion('236', 'attack', { facing })` is true on the step a quarter circle forward and punch ends (numpad notation, mirrored when `facing` is -1: `'623'`, `'41236'`); `input.sequence(['up', 'up', 'down', 'down+right', 'attack'], { window: .5 })` any run of inputs (a cheat code); `input.history` the last second of them (`{ t, dir, pressed }`, for an input display).
- Players (two to four on one machine): `game.players` is `[game.input, ...]`, each an input with this API, its `player` number, `name` (`'P2'`), `color` (`E.PLAYER_COLORS`) and device. `game.allowJoin({ max: 2, onJoin: (input, n) => {} })` lets them in: Start on a free gamepad, or 2 on the keyboard (player 2 takes its right half: arrows, `.` `/` `,` and the numpad; player 1 keeps WASD with F G H; a preset's `halves: { left: { pass: ['KeyR'] }, right: {...} }` its own); `game.addPlayer({ pad: 0 })` or `({ keys: 'right' })`, `game.removePlayer(p)`. Prompts, the pause (P2 PAUSED), a lost controller and the Controls screen are per player. One screen: `cam.frame(heroes)`. Split: `game.splitScreen(2, { follow: [h1, h2], layout: 'auto' })` (`'columns'`, `'rows'`, `'grid'`; up to 4) draws the scene once per viewport (`r.viewport` is `{ i, x, y, w, h }`), then `scene.hud(r)` once over the whole screen; `game.viewports[i].follow(t)` or `.focus(x, y)`.
- `clear()` releases held inputs, pending presses, virtual sticks and touch buttons; focus loss does this automatically. `suppress(a)` blocks an action for the current tick; `suppressCode('Mouse0')` lets a HUD widget consume that mouse button while other devices bound to the action still work.
- Controller settings: `deadzone` (default `.18`, radial and rescaled), `invertAimY`, `lastDevice` (the index has the rest). The left stick and the touch stick, pushed past halfway, press `up` / `down` / `left` / `right` as the d-pad does (menus, dialog choices, ladders); bind `PadAxisUp/Down/Left/Right` to your own menu actions for the same; the right stick is `PadRAxisUp/Down/Left/Right`, the wheel `WheelUp`/`WheelDown`; `value(a)`: 0 to 1 (a trigger's travel, a stick's push). Options while Create is held is no press (the AI Hub's chord).
- Touch settings: `touchEnabled`, `stickSide` (`'left'` or `'right'`), `stickRadius` (CSS pixels), `touchFilter(event)` (return false to reserve a canvas tap for UI). `touchArea()`: where the touch buttons cover the screen (`{ x0, y0, x1, y1 }`, or null): keep a prompt clear of it. `clicked()`: where a click or tap on the canvas landed (`[x, y]` in screen pixels) the step after it, else null; `pointer()`: the mouse in screen pixels; `drag()`: how far the stick's finger moved this step (`[dx, dy]`, or null), to steer one to one; `steer = 'drag'`: a finger anywhere steers, no stick drawn (`stickOn`: a finger is on it). `zones = [{ x0, y0, x1, y1, act }]` (fractions of the canvas): a finger in one holds its act until it lifts (a pinball's halves). Gestures (a mouse or one finger, screen pixels): `box()` → `{ x0, y0, x1, y1, done }` (a left drag; on touch a long press, then a drag), `longPress()`, `doubleTap()`, `pan()` → `[dx, dy]` (a finger's drag on open ground, a middle or right drag), `zoomPoint()`; `feed('down' | 'move' | 'up', x, y, { touch, button, id })` plays a pointer in a test. `bindButtons(root)` wires `[data-act]` elements.

## Drawing: `r` in `draw(r)`
- Background: `r.sky(['#top', '#mid', '#bottom'])`, `r.starfield({ count, speed, dir: 'down' | 'left' })`.
- Depth sorted: `r.actor(x, y, z, (g, ox, oy) => rig.draw(g, ox, oy, r.view), { flash: '#ffffff', flashMix: .75, alpha, xray, outline, ghost, emissive, every, key })` (the flash tints over the sprite so shading shows: `flashMix` .5 by default, 1 solid; `every: 2, key: npc` redraws a background character every other frame; actors up to about 250 px tall), `r.sprite(x, y, z, sprite, { flip, anchor: 'bottom' | 'center', glow, flash })`, `r.queue(x, y, z, g => {...}, { bias })` (sorted by that one point: a long wall by `r.queueSpan(a, b, z, h, fn)`), `r.actorNow(...)` (as `r.actor`, drawn at once over what is drawn so far), `r.box(g, x0, y0, z0, x1, y1, z1, top, side)` (inside a queue function). `{ pick: unit }` on any of them (and `r.shape`), then `r.pick(sx, sy)` → what the last frame drew under a screen point, front to back.
- Floor marks: `r.shadow(x, y, radius, alpha, color, surfaceZ)`, `r.decal(g => r.groundArc(...))`, `r.groundDisc`, `r.groundRing`, `r.groundPts(x, y, rad, n, z)`.
- On top, unlit, screen pixels: `r.text(str, x, y, color, { align, scale, outline })`, `r.textAt(x, y, z, str, color)`, `r.overlay(g => {...})`.
- `r.w(x, y, z)` = buffer pixel of a world point. `r.W`, `r.H`, `r.ix`, `r.iy` (pass to dither functions), `r.view`, `r.visible(x, y, z)`.
- X-ray: `r.actor(..., { xray: true })` shows the actor's hidden part, a translucent tint with a 1-px outline (a checker in `E.style.trans = 'dither'`), wherever a wall, a prop or shape at least chest high (22; `hides: true | false` says otherwise) or anything queued with `{ hides: true }` is drawn in front of it; not by one rising less than 8 above its feet (the roof it stands on, a cut-down wall). `xray: { color, outline (false: none), actors: true }`: with `actors` other bodies in front hide it too (a hero stays findable in a crowd). Afterimages: `ghost: { color, life, alpha, owner }`; `owner` (the actor's `{x, y, z}`) keeps a trail left nearer the camera sorted behind the live body.
- Glowing things you draw yourself: `r.queue(x, y, z, fn, { emissive: true })` is drawn again after lighting so darkness never dims it (flames, lasers, magic, neon). It still hides behind whatever stands in front of it: walls and `r.actor` bodies do this on their own, and any other queued draw can join them with `{ solid: true }`. (Canvas lighting builds a depth-ordered mask for this; `game.r.glowMask = false` skips it on slow machines.)

## Pixels, sprites, text, UI
- `px.rect(g, x, y, w, h, c)`, `dot`, `line(g, x0, y0, x1, y1, c, width)`, `disc(g, x, y, r, c)`, `ell`, `poly(g, pts, c)`, `polyDither(g, pts, c, 0..1, r.ix, r.iy)`, `ddisc`, `sprite(g, spr, x, y, flip)` (or `{ flip, rot, scale }`), `glow(g, 0..1)` (GPU glow for what follows).
- Sprites from strings (for coins, bullets, ships, icons, NES-style enemies): `const COIN = E.sprite(['.yy.', 'yYYy', '.yy.'], { y: '#f0b020', Y: '#fff0a0' }, scale)`. `.` and space are transparent. Frames: `const walk = E.anim([f1, f2, f3], 8, { pingpong })` (or one sheet: `E.anim(sheet, 8, { frames: 4 })`), drawn with `r.sprite(x, y, z, walk, { t })`. `r.sprite(..., { rot: angle, scale })` turns and scales in whole pixels (cached in 16 steps a turn; `steps: 32`); `E.recolor(spr, { '#3a8a4a': '#8a3a4a' })` swaps a palette.
- Font (5x7 proportional with lower case: ASCII, the face buttons, arrows, ★ ♥ ♪ ✓ … ° € £, the accented Latin letters; a letter it lacks, Chinese or Arabic, is drawn with the device's font; `font: 'tiny'` for 3x5): `E.font.text(g, str, x, y, color, { outline, shadow, gradient, scale, align, wrap, font })`, `E.font.title(g, str, x, y, { scale, colors, outline, depth, depthColor, align })`, `E.font.width(str, opts)`, `E.font.lineHeight(opts)`, `E.font.wrap(str, maxW, opts)`. Glyphs: ASCII plus `♥ ★ ← → ↑ ↓ • × ♪ ▸ ©`.
- UI (inside `r.overlay(g => ...)`): `E.ui.box(g, x, y, w, h, { bg, border, gradient, alpha })` (a gradient window like Final Fantasy; `bg` can be `[top, bottom]`, `gradient: false` for flat, `alpha: .6` for a see-through HUD panel), `E.ui.bar(g, x, y, w, h, 0..1, color)`, `E.ui.hearts(g, x, y, hp, max)` (half hearts allowed), `rig.drawPortrait(g, x, y, size, { zoom: 3, turn: .6, bg, frame, cape: false, weapon: false, tint: '#808080' })` (character close-up; it stays upright while the rig kneels or lies down; `tint` greys out a KO'd hero).
- Dialog: `const talk = new E.Dialog(game)`; `talk.say(['Line one.', 'Page two.'], { name: 'ELDER', portrait: elderRig, onDone, choices: ['YES', 'NO'], onChoice(i) })` (choices show on the last page: the keys, or a tap or click on one, pick); in update `if (talk.update(dt)) return;` (true while a modal box is open: play waits); in draw `talk.draw(r)`. `portrait` takes a Humanoid (live close-up; `portraitSize: 40`, `portraitOpts: { zoom, turn }`) or a function `(g, x, y, size) => {...}`. Radio chatter during play: `talk.say('Enemy fighters ahead!', { name, portrait, auto: 2.5, modal: false })` turns its pages and closes by itself while the game keeps running. Per line: `place: 'top' | 'middle' | 'bottom'`, `y` (pixels) and `alpha` (see-through box). `new E.Dialog(game, { speed, lines, color, nameColor, voice, width, bg, border, vars })` (`voice`: a sound, or `(ch, i, talk) => {}` per letter); `talk.close()`, `talk.open`. Markup in the text: `{c=#ffd36a}gold{/c}` a color, `{w=.5}` a pause, `{s=12}slowly{/s}` letters a second, `{shake}..{/shake}`, `{wave}..{/wave}`, `{$name}` a value from `say(text, { vars })` or `talk.vars`.
- Menu: `const menu = new E.Menu(game, ['START', { label: 'LOAD', disabled: true }], { x: 'center', y: 100, title, onPick(i, item), onCancel, scale: 2, rows: 6 })` (rows: it scrolls); `menu.update(dt)`; `menu.draw(r)`. Keys, d-pad and sticks move it; a click or tap on an entry picks it (so a phone can leave a title), and the mouse over one moves the cursor. A tap on a dialog box turns its page as confirm does.
- HTML screens and HUD: `const ui = new E.Shell(game, { theme: { scale: 2 } (a TV; or `tv: true`), settings, screens: { pause, help, dev: { rows: ['glyphs'] } } })`; `ui.show('title' | 'results' | 'map' | ..., spec)`; each step `ui.hud({ objective, status, bars, prompt, minimap })` (`minimap: { map, fog, camera: true, markers, onClick(x, y) }`); `ui.toast(title, text)`.

## Languages (every word a line: AI Hub Languages v1, `docs/LANGUAGES.md`)
- Keep the words players read in the page's `<head>`: `<script type="application/json" id="game-lines">{"version": 1, "language": "en", "lines": {"menu.start": "START", "hud.lives": {"one": "{count} life", "other": "{count} lives"}, "help.jump": "Press {key:jump} to jump"}, "names": ["Pip"], "brief": "the game, its tone, who speaks"}<\/script>`; show each with `E.t('hud.lives', { count })`. Whole sentences with `{blanks}`, never glued; `{key:jump}` is the player's own key or button. A translation step adds a `game-translations` block later; the language follows `?lang=`, the Language menu (Settings), the browser; a missing translation shows the original.
- `E.lang`: `code`, `dir` (`'rtl'`: lines in a box start at its right edge), `upper(s)`, `num(n)`, `list(a)`, `compare(a, b)`, `load({ lines })` (headless tests). `node tools/lines.mjs page.html` adds the engine's own lines (`engine.*`: its menus) to the block; `?lang=en-XA` (brackets every line: plain text is a word left in code), `zh-XC`, `ar-XB` test it. Lay text out with `lineHeight()` and `width()`, never counted pixels.

## Sound: `game.audio` (chip synth, no files, starts after the first key press)
- `sfx(name, { vol, pitch, pan, loop })` → `{ stop(), set({ pan, vol }) }` (a loop sounds on: an engine, rain). Presets: `jump jump2 land step coin pickup key powerup oneup heal hit hurt stomp bump swing whoosh punch kick shoot laser charge explode boom door secret warp die select confirm cancel pause text blip`.
- Custom: `sfx({ wave: 'square' | 'pulse' | 'pulse12' | 'triangle' | 'saw' | 'sine' | 'noise', freq: 440 or 'A4', to: 880, dur: .2, vol: .3, arp: [0, 4, 7], step: .05, vib: [8, .03] })`, or `audio.define('zap', voice)`; `audio.instrument('pluck', (ctx, bus, time, freq, dur, vol) => ...)` is a `wave` too.
- Music: `music('title' | 'adventure' | 'dungeon' | 'boss' | 'victory')` (built in; any other name warns and plays nothing), or your own `{ bpm: 120, steps: 4, tracks: [{ wave: 'square', vol: .15, notes: 'C5 - E5 - G5 . . . | ...' }, { wave: 'triangle', notes: '...' }, { wave: 'drums', notes: 'k . h . s . h .' }] }`. Tokens: a note (`C4`, `F#3`, `Bb2`), `-` holds, `.` rests, `|` is ignored; drums `k s h o c t`. `music(null)` stops. `mute()`, `setVolume(0..1)` (or set `audio.musicVolume`, `sfxVolume`, then `audio.applyVolume()`), `duck(on)` (quieter music under your own pause or map screen). Your own Web Audio connects to `audio.bus('sfx' | 'music' | 'voice')`, under the volume and mute.
- The music clock (the full engine): a song's place is game time, headless too, and the sound follows it. `music(song, { sync: true })` pauses with the game (else it plays on); `audio.pos` → `{ t, step, beat, bar, at, loop, bpm, layers, playing }`; `at(step, fn)`, `onBeat(fn)` (on the update step); `tempo(bpm)`; `layer(name or index, vol, fade)` (a track's `name`, `on: false` starts it silent: the chase's drums in by layers); `music(song, { fade: 1 })` crossfades; `sting(song, { at: 'bar' })` over the music; `sfx(voice, { step })` on a step of the music. `settings.audioOffset` (ms, Settings, Sound: Calibrate) sets `audio.offset`; `audio.calibrate()` → `{ tap(), result, done, stop() }`.

## Levels
**TileMap** (top-down, isometric, brawler): walls stand on the ground plane.
- `new E.TileMap({ rows, legend, types, floorTex, block: ['water', 'lava'], ao: 5, outside })` (`ao` = width of the contact shadow along wall bases, 0 = none; `outside`: the ground past the map, a color, or `false` for none). `types[id] = { h, top, side, line, course, cut: true, cutH, face, roof, beam }` (`cut` lowers walls that block the camera, those `map.isFront(cx, cy, view)` says; a map may replace it; `face`: `'brick'` (default) `'stone' 'rock' 'plank' 'timber' 'plaster' 'hedge' 'none'`; `roof`: `'speckle'` (default) `'plain' 'tiles' 'slab' 'leaves' 'grass'`; `beam` = timber color). `floorTex(x, y, floorTag, view)` returns `[r, g, b]` (or `[r, g, b, glow]`); ready-made: `E.tex.flagstone`, `grass`, `dirt`, `water`, `planks`, `checker`, `plain`. A map of more than 128 x 128 cells bakes its floor in squares as the camera comes to them and lets the far ones go (`chunks: true | false` to choose; `map.floorBytes()` what it holds), so a 256 x 256 world map costs what the screen shows.
- Legend values: a number = wall type, a string = spawn tag, `{ tile, floor, spawn, block }` for both. `block: true` (or the map's `block` list of floor tags) makes deep water, lava or pits stop walkers (jumping bodies pass over); `walkable(cx, cy)`, `block(cx, cy, on)` (a bridge appears). FlowField paths go around blocked cells and follow `block` and `set` at their next `update`.
- `find(tag)` / `findAll(tag)` give `{ x, y, z, cx, cy }`. Also `cell(cx, cy)`, `set(cx, cy, id)` (open doors), `toCell(x, y)`, `center(cx, cy)`, `heightAt(x, y)`, `floorAt(x, y)`, `groundAt(x, y, r, z)`, `collide(body)`, `los(x0, y0, x1, y1)` (ground only), `bounds(view)` (`{ x0, y0, x1, y1 }`, buffer pixels), `drawFloor(r)`, `queueWalls(r)`.

**Heights** (collision, standing, sight, reach and navigation share one rule): a body's `z` is its feet; a cell's top is `map.height(cx, cy)` (0 = floor); a body stands on the highest top within `z + 2`. Eyes at `z + E.HEIGHTS.eye` (30) see a target at `z + E.HEIGHTS.chest` (22); a body's own `eye` / `chest` override them (crouching). Same level: `|dz| <= 8`. On a TileMap (`dir` = an angle or `[dx, dy]`): `ray(a, b, { eye, target })` → `{ clear, t, x, y, z }`, `sight(a, b)`, `standable(x, y, z, r)`, `ledge(from, dir)` → `{ x, y, z, rise, facing, edge }` (climb), `landing(from, dir)` → `{ x, y, z, d }` (a jump across a gap), `drop(from, dir)` → `{ x, y, z, fall }`, `arcClear(a, b, apex, r)`, `pick(sx, sy)` → `{ cx, cy, z, face }` (the cell under a screen point: `input.clicked()`, any view and turn). Helpers: `E.sameLevel(a, b)`, `E.targets(from, list, { range, arc, dz, sight: map })` → `[{ target, d, dz, angle }]` nearest first, `E.inArc(..., dz)`. `new E.FlowField(map, { climb, drop, jump })` paths over roofs, between levels and across gaps.

**PlatformMap** (side-scrollers; 2.5D in tilted views): tiles on the x/z plane, top row first.
- `new E.PlatformMap({ rows, legend, types })`. `types[id] = { kind, style, side, top, line, mat }` (`mat`: any material for a solid tile's face). Example: `rows: ['      ?    ', '   ===     ', '@  g   ^^  ', '###########']`, `legend: { '#': 1, '=': 2, '?': 3, '^': 4, '@': 'hero', 'g': 'walker' }`, `types: { 1: { style: 'ground', side: '#8a5a32' }, 2: { kind: 'oneway' }, 3: { style: 'bonus', side: '#e8a830' }, 4: { kind: 'hazard' } }`. Kinds: `'solid'` (default), `'oneway'` (jump up through), `'ladder'`, `'slope'` (`dir: 1` rises to the right, `-1` to the left; `from` / `to` heights 0..1 for gentle slopes), `'hazard'` (spikes, lava), `'deco'`, `'back'` (background wall). Styles: `'stone'` (`moss`) `'brick' 'wood' 'metal' 'ground'` (`flower`) `'block' 'pipe' 'bonus' 'plank' 'spikes' 'ladder' 'liquid' 'plain'`.
- Spawns: `find(tag)` gives `{ x, z }` with z = the bottom of that cell (feet). Standing on the ground means z = the top of the floor tiles (`level.groundBelow(x, z)`, which returns `null` over a pit), not z = 0. `cell(cx, cz)` / `set(cx, cz, id)` count cz from the bottom row. `slopeZ(cx, cz, x)`, `touching(body, 'hazard')`, `cellsTouching(body, kind)`, `groundBelow(x, z)`, `solidAt(x, z)`, `move(body, dt, solids)`, `bounds(view)`, `draw(r)` (call first, after `r.sky`), `width`, `height`.

## Movement and physics
**Platformer** (side-scroller character): `const hero = new E.Platformer({ x, z, w: 8, h: 22, run: 95, jump: 285, gravity: 800, airJumps: 0, wallJump: false, dash: 0 })`.
- Each update: `hero.update(dt, level, game.input, movingPlatforms)`. For enemies pass `{ x: -1..1, jump, jumpPressed, up, down, dash }` instead of the input.
- Read: `onGround`, `jumped`, `landed`, `facing` (1 or -1), `air`, `climbing`, `hitWall`, `hitCeiling`, `bumped` (`{ cx, cz, id }` of a block hit from below). Methods: `knock(dir)`, `rigState(extra)` (feed it to `rig.update`).
- Built in: coyote time, jump buffering, variable jump height (let go early for a short hop), slopes and small steps (sticks to the ground going down), ladders (up / down), drop through one-way tiles (down + jump), optional double jump, wall jump and dash.
- Further moves, each on request: `crouch` (down: half as tall, it crawls), `ledge` (catches a ledge falling past it; up climbs), `wallCling`, `momentum` (slopes, a roll, a charged dash); tile kinds `'water'` (it swims), `'rope'` (up grabs it), `'bars'` (it hangs and travels), grip `friction` (ice .15), `carry` (a conveyor), `bounce` (a spring), `crumble` and `respawn` (`level.update(dt)` each step); `hero.swingFrom(x, z)` (a grapple: a pendulum, jump lets go); draw `level.drawWater(r)` after the actors. State: `crouching`, `hanging`, `clinging`, `swimming`, `onRope`, `onBars`, `swinging`, `rolling`; `rigState()` poses them.
- Moving platforms: `{ x, z, w, h, vx, vz }` boxes you move yourself and pass as `solids`; riders are carried.

**Body** (top-down / isometric / brawler): `new E.Body({ x, y, r: 5, friction: 0, bounce: 0, gravity: 700 })`. Set `vx`, `vy`, then `body.update(dt, map)`. Also `push(ix, iy, iz)` (knockback), `jump(v)`, and `onGround`, `z`, `groundZ`, `hitWall`, `landed`, `bounced` (hit the ground and bounced: dust, a thud). Walls lower than your feet are walkable, so bodies can jump onto blocks.

**Mover** (third person): `const mover = new E.Mover({ x, y })`; `mover.update(dt, map, game.input)` (input `'THIRDPERSON'`) or an AI's `{ move: [dx, dy], sprint, crouch, jumpPressed }`: it sprints, sneaks, climbs, vaults, leaps gaps, hops down and rolls; `climbAny: true` climbs any wall (jump at it; up the screen is up the wall; jump leaps up, crouch lets go; `mover.wall`, `map.wall(from, dir)`), `glide: true` glides (jump again in the air; `lift`: an updraft), `staminaMax: 100` (climbing, gliding and sprinting spend `mover.stamina`); `rig.update(dt, mover.rigState())`; `mover.play('takedown', { other })`, your own `E.ACTIONS`. Stealth: `E.sees(guard, hero, { map })` → `{ seen, exposure }`, `E.hears`, `new E.Suspicion()` (`update(dt, seen, hero)` → `'calm' | 'notice' | 'search' | 'alert'`), `r.sightCone(guard, { map })`, `r.marker(x, y, z, { label })`.

**Attack** (melee timing for swords, punches, kicks): `const slash = new E.Attack('slash')` (a move from `E.MOVES`, optionally with overrides: `new E.Attack('thrust', { reach: 10 })`) or a spec `{ a0, a1, z0, z1, reach, wind, active, recover }`. `if (input.buffered('attack') && slash.start()) input.consume('attack')`; `slash.update(dt)` (returns the phase that just began); `slash.hits(enemies, e => E.inArc(hero, facing, e, 22, 1.4), e => {...})` hits each target once per swing during `'active'` (moves wait until `hitAt: .35` of the swing, so hit-stop freezes the strike, not the wind-up); `rig.update(dt, { ..., attack: slash.state })`. Also `busy`, `active`, `cancel()`. **Combo**: `const combo = new E.Combo(['jab', 'cross', 'hook', 'uppercut'], { window: .3 })` (names, specs or Attacks); `combo.press()` starts or chains the next hit; `update`, `hits`, `state`, `step` work the same. **Knockback**: `E.knockback(attacker, target, 160, up)` pushes a Body (or anything with vx / vy) away.

**Bullets**: `const shots = new E.Bullets(game, { plane: 'ground' | 'side' })`; `shots.fire({ x, y, z, vx, vy, vz, r: 2, team: 'player', color, life, dmg, pierce, sprite })`; `shots.burst(base, E.pattern.spread(angle, n, arc, speed))`; `shots.update(dt, map)`; `shots.hit(targets, (b, t) => {...}, 'player')`; `shots.draw(r)`; `shots.clear(team)`. Patterns: `E.pattern.dir(angle, speed)`, `aim(a, b, speed)`, `aimSide(a, b, speed)`, `spread(angle, n, arc, speed)`, `ring(n, speed, offset)`. In side view the second number of a pattern velocity is vz.

**Helpers**: `E.dist(a, b)`, `E.angleTo(a, b)`, `E.arc(a, b, gravity, { apex | time | speed })` → `{ vx, vy, vz, t }` (a throw that lands at b: a lob, a grenade), `E.overlap(a, b)` (circles x, y, r), `E.overlapBox(a, b)` (side boxes x center, z feet, w, h), `E.inArc(a, facing, b, range, halfAngle, dz)` (melee cone; `dz` limits the height difference), `E.rand(a, b)`, `E.randInt(a, b)`, `E.pick(list)`, `E.chance(p)`, `E.prune(list, fn)`, `E.store.get(key, fallback)` / `set(key, value)` (save data; slots: `game.saves`), `new E.SpatialHash(32)` (`build(list)`, `near(x, y, r, fn)`), `new E.FlowField(map)` (`update(tx, ty)` or `update([[x, y], ...])`: the nearest; `dir(x, y, tx, ty)` walks around walls and `map.solid` shapes), math `clamp lerp approach ease.* angDiff approachAng smoothDamp rng(seed) noise2 hex shade mix`; `E.version` (the release) and `E.versionLabel()` ('v0.7.0 · a1b2c3d 2026-10-07': show it on a title or a debug screen).

## Characters
**Humanoid** (knights, heroes, soldiers, zombies): `new E.Humanoid({ size: 1.3, build: 'chibi' (default) | 'heroic' (tall) | 'bulky' (brawlers, bosses) | 'skeleton' (tint with colors.bone), weapon: 'sword' (the default) | 'gun' | 'staff' | null (fists) | a game's own (`E.Humanoid.weapon(id, { length, rest, draw(w) })`; `.hat(id, draw)`, `.pose(id, (J, w) => ...)`; `draw: { under, over }`; state `tilt`, `roll`), outfit: 'shirt' | 'tunic' | 'robe' | 'coat', hair: 'short' | 'spiky' | 'long' | 'ponytail' | 'bald', hat: 'cap' | 'pointed' | 'helmet' | 'band' | 'crown' (or { style, color }), sleeves: 'short' | 'long' | 'none', armor, hood (in colors.hair), cape: { len: 6, width: 5, seg: 2.5 }, eyeGlow, hunch, lean, style: 'hd' (default) | 'classic' (stick figures for huge crowds), colors: { skin, hair, cloth, coat, pants, boot, belt, trim, glove, cape, capeIn, metal, plate, hilt, eye, iris } })` (`metal` colors the weapon, `plate` the armor, defaulting to `metal`).
- `rig.update(dt, { x, y, z, vx, vy, facing, dash, hurt, air, point, aim, attack })`. `facing` is an angle (side view: 0 = right, `Math.PI` = left). `air: true` tucks the legs for jumps; `point: true` holds a gun forward; `aim` tilts it (radians, + = up: `aim: .8` shoots diagonally up, `Math.PI / 2` straight up).
- **Moves** (`E.MOVES`, use them instead of hand-made specs; every one has anticipation, a committed strike with lunge / step / lean / twist, follow-through and a clean return to the stance, on every build and in every view):
  - blades and clubs: `slash backslash overhead rising thrust spin plunge twohand`;
  - fists: `jab` (left hand) `cross hook uppercut haymaker elbow`;
  - kicks: `kick roundhouse sweep flyingkick knee axekick`;
  - other: `cast` (both hands) `throw bash claw`.
  Give each character its own set (a knight: `overhead`, `thrust`, `spin`; a mage: `cast`; a monk: `jab`, `cross`, `roundhouse`; a boss: `haymaker`, `sweep`). `E.move('uppercut', .5)` is the attack state of any move at any moment (previews, cutscenes).
- `attack: { spec, phase: 'wind' | 'active' | 'recover', u: 0..1 }`, spec `{ a0, a1, z0, z1, reach, r0, r1, hand, rel, blade, spin, kick, plane, lunge, hop, crouch, lean, twist, hold }`. Angles are relative to facing (+ = right hand side). `rel: true`: heights relative to the shoulder and reach scaled by arm length (kick heights as a share of hip height). `r0`/`r1`: reach that extends (thrusts, jabs). `hand: 'L' | 'both'`. In side views horizontal swings turn into the screen plane (a Castlevania chop) by themselves; `plane: 'side' | 'ground'` (or the rig option `swingPlane`) chooses. `lunge` steps into the strike (body motion in local units, clamped to -4..5; to move the character itself, add speed to your body), `hop` lifts the body, `crouch` dips in the wind-up, `hold` is how long the end pose holds (share of recover). You time the phases.
- In steep ground views (threequarter) rigs and Blobs are drawn from a lower, sprite-like angle so faces show, like SNES RPG sprites (`charView: false` turns it off for one rig, `E.style.charPitch = false` for all).
- Faces (eyes with catch-lights, brows, mouth), a cheated 3/4 turn toward the camera in side views (`cheat: .5`, 0 turns it off) and hair layers are automatic. `face: { eyes: 'big' (anime / Mana style), bangs: 0..1 }`.
- Poses: `rig.update(dt, { ..., pose: 'cheer' | 'cast' | 'guard' | 'kneel' | 'crouch' | 'wave' | 'hips' | 'down' })` (they blend in and out), `'block'` (weapon upright across the body), `'die'` (a stagger, then the body topples), `expr: 'smile' | 'shout' | 'angry' | 'wince'` (faces and portraits), `run: 0..1` (run in place), or `down: 0..1` to lie a defeated body flat. `stance: 'guard'` keeps fists up while walking (brawlers; the free hand guards the chin during punches), `stance: 'ready'` holds the weapon forward. `climb: true` with `vz` climbs a ladder hand over hand (`Platformer.rigState()` passes both). Traversal: `crouch` (a sneaking gait), `sprint` (a lean), `hang` with `hangZ` (hands on an edge that high above the feet), `flip: 0..1` (a roll), `land: k` (a heavy landing); `mover.rigState()` sets them. Every wind-up starts from the rig's current pose, so chained hits and hand changes never snap. Idle rigs breathe and shift their weight by themselves.
- `rig.draw(g, ox, oy, view)` inside `r.actor`, `rig.drawSmear(r)` (a glowing trail along the real blade, fist or foot path, in every view), `rig.debug(r)` (skeleton), `rig.kick(v)` (squash and stretch), `rig.hand()` and `rig.tip()` (world points to spawn bullets from), `rig.worldOffset(p)` (where a point in the rig's own frame, such as a joint in `rig.J`, sits from its feet: to draw or spawn at any joint), `rig.lastView` (the view it last drew with), `rig.solvePose()` (sets `rig.J` from its state each step: wrap it on one rig to move joints).
**Blob** (slimes, rabbites, bats, imps, round monsters): `new E.Blob({ R: 6, colors: { dk, base, lt, spec, eye, pupil }, ears: 'rabbit' | 'cat', horns: true, wings: true, feet: true, tail: true, mouth: true | 'fangs', face: 'front' })`, `update(dt, { squash: -0.4..0.4, look: [dx, dy], squint, walk: 0..1, flap: 0..1 (wing speed; 0 folds them), hang: true (roost upside down) })`, `kick(v)`, `draw(g, ox, oy, view)`. Mix the parts for a bestiary: `wings` + `mouth: 'fangs'` is a bat, `ears: 'rabbit'` + `feet` a Mana rabbite, `horns` + `tail` an imp.

## Effects and lighting
- Particles: `game.particles.explosion(x, y, z, size)` (fireball, smoke, sparks, debris, ring, shake, sound), `fire(x, y, z, n, { size })`, `smoke(x, y, z, n, { size, color })`, `glints(x, y, z, n, color)`, `dust(x, y, z, n)`, `sparks(x, y, z, n, angle)`, `bits(x, y, z, n, colors)`, `ring(x, y, r0, r1, color, dur)`, `text(x, y, z, '12', color, { scale: 2, bounce: true })` (bouncing damage numbers), `add({ kind: 'dust' | 'spark' | 'bit' | 'ember' | 'fire' | 'smoke' | 'glint', ... })`. `explosion(x, y, z, size, { debris, freeze: false, shake: 0 })` for chains of small blasts. Side-scrollers: `particles.ground = (x, y, z) => level.groundBelow(x, z)` so sparks and debris bounce on platforms. Screen flash: `game.flash('#ffffff', .12, strength 0..1)`.
- Lighting (step 9; every view, side-scrollers included, no WebGPU needed): `game.lights.add(x, y, z, radius, intensity, { color: '#ffa050' })` every draw. Dark areas get a smooth cool tint, lights add their own color, and emissive items (flames, sparks, bullets, `emissive: true`) stay bright. `lights.darkness` (0..1) and `lights.tint` tune it; after setting `lights.dark = [r, g, b]`, `levels` or `glow`, call `lights.refresh()`. Props with flames can light the scene: `r.prop('torch', x, y, z, { light: true })`. Lamps, street lamps, lanterns and crystals glow on their own (`haloR`, `haloColor`, `halo: false`); `cone: true` adds a light cone under a street lamp.
- Hits: `game.hitFx(x, y, z, { power: 1, angle, damage: 12, textScale: 2, textZ: 22 })` does hit-stop, shake, an impact star, sparks, a bouncing damage number (`bounce: false` floats it) and a sound in one call; `particles.impact(x, y, z, size, color)` for the star alone.
- GPU lighting (optional, ground views with a TileMap): `const gpu = game.enableGPU({ map })`; mark glowing things with `px.glow(g, 1)`; add `lights.caster(x, y, r, top)` and `lights.heat(x, y, z, w)`. Where it can't draw (no WebGPU, a side view) the canvas lighting stands in, with `game.lights.ambient` (`gpu.fallback = false`: unlit).

(This kit's FIGHTING rows; API.md, in the repo and in dist/my-3d2dge.html, has the playbook's every genre.)

**Sizes:** heroes 40-60 px tall at 320x240 (`size: 1.2-1.4`), bosses 1.8-2.4. Small things (coins, bullets, ships, pickups) are string sprites designed at 8-16 px, drawn at scale 2 if they are the player's ship. Keep hitboxes smaller than the art.

**Feel numbers** (world units per second, tile = 16): walk 70-90, run 95-140, jump 250-320 with gravity 800, fall cap 330, dash 200-260, bullets 250-320 (player) and 70-120 (enemy), enemy walk 25-45. Hit feedback: `game.hitFx` (Effects).

## More: animation and examples outside this card
The repo (github.com/michaelcrosato/my-3d2dge; any file at `https://raw.githubusercontent.com/michaelcrosato/my-3d2dge/main/<path>`) holds more to take from. Its files are large: search them and take only what the game needs. Real 3D (`E.World3D`: first person, racing, flight) is the 3D engine, `engine/my-3d2dge-3d.js`, its header its manual (the handoff package has it, `vendor/` and every 3D kit).
- **Motion clips**: 325 curated and 2,548 motion-capture takes that play on any Humanoid: find one in `src/mocap/catalogs/`, cut a small set with `tools/anim-set.mjs`, then `Mocap.drive(rig, lib)` (`AI_GUIDE.md`, Where to find more; `docs/MOCAP.md`).
- **Objects and materials** (full engine): `r.shape('barrel', x, y, 0, { facing })` draws a still object from any view and facing, `map.solid(...)` makes it solid; `E.MATERIALS` dresses floors (`floorMat`), walls (`face`, `roof`) and platform tiles (`mat`). `docs/ASSETS.md` is the card: the format, the library, writing one and checking it with `node tools/asset-sheet.mjs`.
- **Worked examples**: Emberdeep (`src/emberdeep/`), a whole game on this engine: 29 monster, boss and dummy bodies, 3 heroes and 30 skills, registered with `def(kind, id, spec)` (one search lists them); adapt them, they lean on the game's own helpers. `docs/CHARACTERS.md` is the recipe for a new body.
- **Modules** (`engine/modules/<name>.js`; `modules/` in the handoff package): general systems in files of their own, each a `<script>` after the engine, its header its manual (read it there, or its section of the index). A kit carries the modules its slice names (`@modules` in its header); the full engine (`dist/my-3d2dge.js`; `my-3d2dge.js` in the handoff package) carries them all.
  - `fight` (the full engine only): one-on-one fighting: `E.Fighter` (frame data, hurt boxes from the rig's joints, guards, throws, cancels, juggles, specials by motion or charge, a meter, projectiles), `E.Match` (rounds, KO, the HUD, training), `E.FightAI`, `E.FightSelect`. FIGHTING.
  - (the modules this kit carries; API.md lists every one)
- **Everything running**: `index.html`, the repository's home page

## Before you hand the game back
- One IIFE starting with `const E = My3D2dge` (between the markers in a single file; `game/game.js` in the handoff package). Only your game: no leftover starter menu or unused slices. No network, no libraries.
- Title screen and game-over screen as scenes; `pausable: true` on gameplay scenes. No pause, settings, rebinding or full-screen code of your own (they're standard); prompts from `game.input.label(action)`. Every word players read is a line (`E.t`; the Languages section).
- The camera follows the player (`game.focus` every update) and shows the level; the HUD uses screen pixels, or `E.Shell`'s HTML for a modern game (the STEALTH kit; the handoff package's template).
- Sound effects on jump, hit, pickup and death; music per scene.
- The look target list above: backdrop, textured tiles, props, sized and dressed HD characters, effects, title font, lights. Compare your screenshots with Symphony of the Night or Metal Slug, not with NES games.
- If you can run commands: `node tools/check.mjs game/index.html` (your page; add `#scene` to jump to a scene). It presses start, plays, cycles the views, prints how much of the screen is filled and how many colors it uses, adds look notes (flat areas, checkerboard dithering, low contrast, a thin palette), and fails on any error. Act on every look note. `node tools/filmstrip.mjs game/index.html#scene --steps "wait:1500 press:Enter wait:800 rec:16:2 press:KeyJ" --crop x,y,w,h` records an animation frame by frame into one contact sheet: check every attack with it (a swing must wind up, strike, and settle back without jerks or backward sweeps).
- Animation variety: every character has its own moves from `E.MOVES` (not one shared swing), enemies telegraph with a visible wind-up, and reactions play out (hurt, knockback, `down`, victory `cheer`).

<script>
// in-page API card viewer (reads the card at the top of this file). Not part of any game.
(() => {
  const g = document.getElementById('guide'), open = v => { g.hidden = !v; if (v) document.getElementById('guideClose').focus(); };
  document.getElementById('guideText').textContent = document.getElementById('my3d2dge-api').textContent.trim();
  document.getElementById('guideBtn').addEventListener('click', e => { open(true); e.currentTarget.blur(); });
  document.getElementById('guideClose').addEventListener('click', () => open(false));
  addEventListener('keydown', e => { if (e.key === '?') open(g.hidden); else if (e.key === 'Escape' && !g.hidden) open(false); });
  // the button steps aside while you play and comes back when the mouse moves (a phone has no use for it: hidden)
  const btn = document.getElementById('guideBtn'); let hide = setTimeout(() => btn.classList.add('away'), 4000);
  addEventListener('keydown', () => btn.classList.add('away'));
  addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; btn.classList.remove('away'); clearTimeout(hide); hide = setTimeout(() => btn.classList.add('away'), 3000); });
})();

<script>
/* ---- inlined from engine/my-3d2dge.js (minified, less the sections its game never calls: the header above lists them; the readable engine is in the repo) ---- */
/*!
 * my-3D2dge v0.93.0  (My "3D" 2D Game Engine)
 * Procedural pixel-puppet engine for every 2D perspective.
 * https://github.com/michaelcrosato/my-3d2dge  (MIT License)
 *
 * READ THIS FIRST (humans and AI models extending a my-3D2dge game)
 * -----------------------------------------------------------------------------
 * 0. EVERY GAME STARTS WITH  const E = My3D2dge;  and then uses E.Game, E.px, ...
 * 1. WORLD SPACE IS 3D. x = east, y = south, z = up. One floor tile = 16 units.
 *    Game logic never thinks about screen pixels.
 * 2. A VIEW turns world points into screen pixels. Swap the view and the whole game
 *    re-renders from another angle: E.VIEWS.iso, .threequarter, .topdown,
 *    .brawler, .side  (or build your own: new E.View(id, label, yaw, pitch, scale, zBoost)).
 * 3. CHARACTERS ARE RIGS, NOT SPRITES. E.Humanoid and E.Blob recompute their
 *    joints from math every step, in 3D, then project them. That is why they move
 *    fluidly and can face any angle in any view without extra art. Small things
 *    (coins, bullets, icons) can be pixel sprites written as strings: E.sprite().
 * 4. PIXEL RULES. Draw with E.px (rect, line, disc, ell, poly, sprite...). Every shape
 *    snaps to whole pixels. Never use ctx.arc / ctx.stroke / ctx.fillText on the game
 *    buffer: they anti-alias and break the look (E.font alone uses fillText, for letters its
 *    glyphs lack: readable text in the player's language comes first). Translucency and glow go through
 *    px.blend / polyDither / ddisc / r.glowDisc: stepped alpha and blend modes like PS1
 *    hardware (E.style.trans = 'dither' switches to NES / Genesis style dithering).
 * 5. FRAME ORDER (handled by the Renderer):
 *      background (r.sky, map.drawFloor or level.draw) -> decals (ground marks, shadows)
 *      -> sorted queue (walls, props, actors, particles) -> lighting -> overlays -> present
 *    Anything that can be in front of or behind something else goes through
 *    r.queue(x, y, z, fn), r.actor(x, y, z, drawFn, opts) or r.sprite(...).
 * 6. TIME. game.start({ update(dt), draw(r) }) or game.start({ scenes, scene }).
 *    update runs in exact fixed steps: each 1/120 s of real time is one update with
 *    dt = 1/120 * timeScale, so motion is identical at 60, 90, 120 or 144 Hz (game.alpha =
 *    the part of a step left over). game.freeze(s) = hit-stop, game.shake(n) = screen shake,
 *    game.timeScale = slow motion, game.paused = pause, game.after(s, fn) = timer.
 * 7. LEVELS. Top-down / isometric / brawler floors: E.TileMap (walls on the ground
 *    plane). Side-scrollers: E.PlatformMap + E.Platformer (tiles on the x/z plane,
 *    solid, one-way, ladders, hazards, moving platforms; crouching, ledges, clinging, water, ropes, bars, swinging and
 *    momentum on request: 16c). Both read ASCII rows. Third person (Assassin's Creed):
 *    E.Mover on a TileMap of roofs climbs, vaults and leaps; E.ACTIONS, and E.sees / E.Suspicion for guards (17b-17d).
 * 8. SOUND, TEXT, MENUS. game.audio.sfx('jump'), game.audio.music(song);
 *    E.font.text(...) (5x7 proportional font), E.font.title(...), E.ui.box/bar/hearts,
 *    new E.Dialog(game) (markup: {c=#hex}, {w=.5}, {s=12}, {shake}, {wave}, {$name}), new E.Menu(game, items). An HTML
 *    interface (title, pause, settings, help, results, map screens and a HUD with a minimap) from data: new E.Shell(game,
 *    {...}) (21d). Save slots: game.saves (10k).
 * 8c. LANGUAGES (AI Hub Languages v1; docs/LANGUAGES.md, 6b). Every word a player reads is a line: the page's
 *    <script type="application/json" id="game-lines"> block, shown with E.t('hud.lives', { count }) (whole sentences with
 *    {blanks}, plural forms by {count}, {key:jump} for the player's key). A translation step adds a game-translations
 *    block; the language follows ?lang=, the Language menu, the browser. The fonts draw what they lack with the device's
 *    font; ?lang=en-XA, zh-XC, ar-XB test a game. Lay text out with E.font.lineHeight() and width(), never counted pixels.
 * 8a. STANDARD FEATURES come with every game (10b): a pause menu with settings and controls the player rebinds, saved
 *    per game (game.settings), full screen (game.fullscreen; a phone's first tap), pausing when the page is hidden, and
 *    input.label(action) for prompts, and a boot (10c): heavy setup in game.start({ boot: { steps } }) runs behind a
 *    boot screen, and an error before play shows a report to screenshot. Don't build your own: adjust them with
 *    new E.Game({ menu: { items, settings, controls, quit, saves } }), or leave them out (menu: false, fullscreen: false,
 *    corner: false, autoPause: false).
 * 8b. LOOK. Aim for PS1 / N64 era 2D, not NES: HD rigs (size, outfit, hair, armor),
 *    new E.Backdrop('castle-night') behind levels, textured tiles (stone, brick, wood,
 *    metal), r.prop('torch', ...) set dressing, particles.explosion / smoke / fire,
 *    game.flash, and E.tones(hex) / E.ramp(hex) for hue-shifted shading.
 * 9. GPU LIGHTING is optional: game.enableGPU({ map }). Mark glowing things with

/* ---- inlined from engine/modules/fight.js (minified; the readable module is in the repo) ---- */
/*!
my-3D2dge module FIGHT v0.93.0: one-on-one fighting: fighters with frame data, guards, throws, specials, a meter; rounds; a CPU; training
https://github.com/michaelcrosato/my-3d2dge (MIT License)
Loads after: the full engine only. Needs: no other module.

Street Fighter II's rules, in the side view: for fighting games, and a boss duel in any side-scroller.
- const f = new E.Fighter(game, { name, x, rig: { size: 2.6, build: 'heroic', colors }, life: 1000, walk: 75, back: 60,
  moves }); E.Match gives each its foe and its control: an E.Input (the scene's input: E.FIGHT_KEYS; player 2's is
  game.players[1]) or a CPU. It faces its foe, walks, crouches on down, jumps on up (straight, forward or back), and
  holds back to block.
- moves: { id: spec }. A spec: move (an E.MOVES name the rig plays: 'jab', 'uppercut', 'roundhouse'; or its own
  fields), btn ('lp' | 'hp' | 'lk' | 'hk': the preset E.FIGHT_KEYS), when ('stand' | 'crouch' | 'air' | 'close'), or
  motion ('236', '623', '214', '41236': numpad notation, mirrored by facing) or charge ('46': back held .7 s, then
  forward; '28') for a special; f: [startup, active, recovery] (frames at 60; else the move's seconds), dmg, stun and
  block (frames of hit- and block-stun), guard ('mid' | 'low': blocked crouching | 'overhead': standing | 'throw'),
  chip (the share of dmg a block still takes: specials .25), push, launch (up speed: a juggle, then a knockdown), down
  (a knockdown), cancel (true: a special may cut it short once it connects), meter (a super's cost; 100 a bar), vx and
  vz (it travels: a spinning kick, a rising uppercut), inv (frames invulnerable from its start), shot ({ speed, r,
  dmg, color }: a projectile on E.Bullets, one at a time), teleport (units past the foe), throw (true: a command grab,
  range in units), r (the hit box's radius).
- A throw: the throw button (o.throwBtn, 'hp') with forward or back, close, on a foe standing or walking; it can't be
  blocked. Hits in a row scale down to half; a juggled foe takes three hits at most; a knockdown gets up invulnerable.
- f.life, f.meter, f.combo (the hits it has taken in a row), f.ko, f.boxes ({ hurt: [boxes], hit, push }: boxes
  { x, z, w, h }, x the left), f.last (the frame data of its last move: { id, startup, active, recovery, adv }).
- const m = new E.Match(game, { fighters: [a, b], ai: [null, new E.FightAI({ level: 4, seed: 1 })], rounds: 2 (wins
  needed), time: 99, x0: 0, x1: 520 (the stage's walls), training: false | { dummy: 'stand' | 'crouch' | 'jump' |
  'guard' } }): m.update(dt) runs it (ROUND 1, FIGHT!, K.O., TIME, PERFECT, the win poses, the next round); m.draw(r) draws the
  fighters, their shots and the HUD (life, timer, rounds, meters, combos, the calls; in training the boxes, the frame
  data and the input display). m.phase ('intro' | 'fight' | 'ko' | 'win' | 'over'), m.winner (0 or 1), m.wins, m.x.
- new E.FightAI({ level: 1..8, seed }): reads its foe after a reaction time (shorter at higher levels), keeps its
  range, guards, answers jumps with an anti-air (a move with aa: true), throws, confirms hits into specials. Its
  randomness is its own E.rng, so the same seed fights the same match.
- new E.FightSelect(game, { roster: [{ id, name, rig, about }], inputs: [p1, p2 or null], cpu: [false, true], onDone:
  ids => {} }): pick a fighter each (left, right, confirm; a tap on a portrait); update(dt), draw(r).

const E = My3D2dge, game = new E.Game({ headless: true });
const moves = { jab: { move: 'jab', btn: 'lp', dmg: 40, stun: 14, block: 10, cancel: true }, sweep: { move: 'sweep', btn: 'lk', when: 'crouch', guard: 'low', down: true, dmg: 70 },

<script>
/* ---- inlined from src/starter (00-shell.js, 55-fighting.js, 90-start.js) ---- */
/* ============================== GAME START ==============================
 * MY-3D2DGE STARTER: a title menu and vertical slices, one per genre (a genre kit file holds one; the file with every
 * slice adds an animation lab). Each slice is a complete small game, written to be copied and changed: its own header
 * (below this shell) says what it plays, its keys and touch controls, its deep links and how it works.
 * FULL SCREEN, ANY SHAPE: res: 'ps1', expand: true. 320 x 240 is the least the screen shows; a wider or taller window
 * shows more world (r.W x r.H grows), so every HUD anchors to r.W and r.H, never to 320 and 240, and every level fills
 * what a wide screen or an upright phone shows. Prompts name the player's own keys: prompt('attack', 'Sword').
 * To make your own game: change the slice closest to your genre into yours, with its own title, play and game-over
 * scenes, and delete this menu and the slices you do not use; this shell (the game, its scenes, prompt, best and the
 * proof) stays unless you replace it. Deep links: #<slice> starts a slice, #<slice>/<part> jumps into a part.
