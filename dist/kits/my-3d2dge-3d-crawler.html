## Your own three.js
E.THREE (three/webgpu), E.TSL, E.RAPIER; world.scene, world.pw (Rapier's world), E.World3D.toThree(x, y, z) (engine
units to three's metres, y up). The rules: WebGPURenderer and node materials only (MeshLambertNodeMaterial,
MeshToonNodeMaterial, MeshBasicNodeMaterial, TSL): never WebGLRenderer, ShaderMaterial, onBeforeCompile, EffectComposer or
three/addons (not vendored); no compute shaders or storage buffers; nothing read back from the GPU. An InstancedMesh with
over 1,000 instances never uses DynamicDrawUsage (r182 drops its updates). Make meshes and lights when the world is made,
not mid-game (a new material builds its shader: a stall).

<script type="module">
/* ---- inlined from src/starter3d (00-shell.js, 70-crawler.js, 90-start.js) ---- */
/* ============================== GAME START ==============================
 * MY-3D2DGE 3D STARTER: a title menu and the 3D slices (a 3D genre kit file holds one). Each slice is a complete small
 * 3D game, written to be copied and changed: its own header (below this shell) says what it plays, its keys and touch
 * controls, its deep links and how it works. The 3D engine's manual (the header of engine/my-3d2dge-3d.js) says how a
 * game runs on a 3D world: E.Game as in 2D with bg: null, world.step(dt) in update, world.draw(r) then the HUD in draw.
 * THE SHELL'S KEYS: M mutes; in a slice whose camera follows the game's view, V changes the view, [ ] turn it and 0
 * resets it (the wheel, - and = zoom where the scene allows); the pause menu's Display has the 3D settings
 * (characters as cards or puppets, the picture's resolution, shadows).
 * To make your own game: change the slice closest to your genre into yours, with its own title, play and game-over
 * scenes, and delete the slices you do not use; this shell (the game, its scenes, the boot steps) stays unless you replace
 * it. Deep links: #<slice> starts a slice, #<slice>/<part> jumps into a part.
 * ======================================================================== */
const E = My3D2dge, W3 = E.World3D, { clamp, lerp, approach, TAU } = E;

/* ---- SHELL: one game, several scenes, each slice with its own world ----
 * bg: null keeps the game's canvas clear over the 3D picture; E.World3D.INPUT: WASD move, Space jump, J or a click
 * attack, Shift dash, E skill, C camera; E.World3D.SETTINGS: the 3D settings in the pause menu */
const game = new E.Game({ canvas: 'screen', res: 'ps1', expand: true, bg: null, input: W3.INPUT, menu: { settings: W3.SETTINGS } });
const P = game.particles, A = game.audio;
const scenes = {}, BOOT = [];    // BOOT: the slices' heavy setup, [label, fn] steps run behind the boot screen
// each slice: its scene's id, its title entry, a line about it, and its family (the title groups them under it)
const SLICES = [
  { id: 'action', label: 'ACTION', about: 'A 3D ARENA: COMBOS, DASHES AND WAVES', family: 'ACTION ADVENTURE' },
  { id: 'platformer', label: 'PLATFORMER', about: 'A 3D COURSE: ISLANDS, PLATFORMS AND COINS', family: 'PLATFORM' },
  { id: 'shooter', label: 'SHOOTER', about: 'AN OPEN WORLD: MOVE, CLIMB AND FIGHT, FIRST OR THIRD PERSON', family: 'SHOOTER' },
  { id: 'horror', label: 'HORROR', about: 'A MANSION BY FLASHLIGHT: FIXED CAMERAS, FEW BULLETS', family: 'ACTION ADVENTURE' },
  { id: 'racing', label: 'RACING', about: 'A KART CIRCUIT: DRIFTS, ITEMS, A SHORTCUT, TWO PLAYERS', family: 'RACING' },
  { id: 'flight', label: 'FLIGHT', about: 'ON RAILS TO THE BASE, A BOSS IN FREE FLIGHT', family: 'SHOOTER' },
  { id: 'crawler', label: 'CRAWLER', about: 'A DUNGEON IN FIRST PERSON: A PARTY OF FOUR, A CELL AT A TIME', family: 'RPG' }
];
// a prompt in the player's own controls ('J Sword', 'X Sword', 'ATTACK Sword' on a touch screen)
// (a phone or tablet before its first touch counts too: a coarse pointer and nothing else used yet)
const coarse = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
const prompt = (a, word) => game.input.label(a) + ' ' + word, touch = () => game.input.lastDevice === 'touch' || (coarse && game.input.lastDevice === 'keyboard');
// START picks too (the touch START, a pad's Start), as Enter does
const pickOnStart = m => { if (game.input.pressed('start')) { game.input.consumeAll(); m.onPick(m.i, m.items[m.i]); } };
let active = null;               // the world of the scene that is playing (the shared keys turn its camera)

/* ---- the camera: C cycles the view, the chase camera and first person; V, [ ] and 0 work on the view (and turn the
 * others) ---- */
const CAMS = ['view', 'chase', 'first'], CAM_NAME = { chase: 'CHASE CAMERA', first: 'FIRST PERSON' };
const viewName = () => game.view.label.toUpperCase() + ' VIEW';
/** the camera key (input action 'camera'), read in a slice's update */
function cameraKey(world) {
  if (!game.input.pressed('camera')) return;
  const c = world.camera, m = CAMS[(CAMS.indexOf(c.mode) + 1) % CAMS.length]; c.set(m); game.note(m === 'view' ? viewName() : CAM_NAME[m]);
}
addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || game.paused) return;
  if (e.code === 'KeyM') { A.mute(); return; }
  if (active && ['fixed', 'zones'].includes(active.camera.mode)) return;   // (a slice that runs its own camera, or fixed cameras by room: its keys are its own)
  if (e.code === 'KeyV') { game.nextView(); if (active) active.camera.set('view'); game.note(viewName()); }
  else if (e.code === 'Digit0') { game.settings.set('zoom', 1); game.resetCamera(); game.note('CAMERA RESET'); }
  else if (e.code === 'BracketLeft' || e.code === 'BracketRight') { game.rotateView(e.code === 'BracketLeft' ? -45 : 45); game.note('TURN ' + game.yaw); }
});
/** a dark veil over the 3D picture (the title's lower third, a game over) */
const veil = (g, r, y0, a = .55) => { g.save(); g.fillStyle = '#05030c'; g.globalAlpha = a; g.fillRect(0, y0, r.bw, r.bh - y0); g.restore(); g._c = null; };

/* ---- TITLE: a little stage in 3D, the slices' heroes on it in torchlight, the camera turning round them ---- */
const TITLE_LEVEL = {
  rows: [
    '                    ',
    ' ################## ',
    ' #t......PP......t# ',
    ' #.......PP.......# ',
    ' #................# ',
    ' #....========....# ',
    ' #....========....# ',
    ' #....========....# ',
    ' #.....^^^^^^.....# ',
    ' #t..............t# ',
    ' #................# ',
    '                    '],
  legend: { '=': { floor: 8, side: 'block', color: '#4a4360' }, '^': { stairs: 'n', floor: 8 } }
};
let title = null;
const TITLE_CAST = [
  { x: -18, face: 0, rig: () => new E.Humanoid({ cape: { len: 6, width: 5, seg: 2.5 }, colors: { cloth: '#2f8f86', cape: '#c8452f', capeIn: '#7a2622', hair: '#2e2230' } }) },
  { x: 18, face: 0, rig: () => new E.Humanoid({ weapon: null, hat: 'cap', build: 'heroic', colors: { cloth: '#d83a2a', pants: '#2f5fd0', glove: '#f0f0f0', hat: '#d83a2a' } }) }
];
BOOT.push(['The title stage', () => {
  const w = new W3(game, { level: TITLE_LEVEL, fog: { near: 140, far: 600 }, torchShadows: 1 }), cx = w.width / 2, cy = 6.5 * 16;
  const heroes = TITLE_CAST.map(c => { const a = w.hero({ x: cx + c.x, y: cy, rig: c.rig(), facing: Math.PI / 2 }); a.anim = { pose: null }; return a; });
  const slime = w.mob({ x: cx - 44, y: cy + 30, blob: new E.Blob({ R: 6.2, face: 'front', ears: 'cat' }) }), wisp = w.mob({ x: cx + 44, y: cy + 24, orb: { color: '#c78bff' }, fly: true });
  w.thing('star', cx, cy - 26, 8 + 12, { spin: .35, bob: 3 });
  w.camera.set('fixed');
  title = { world: w, cx, cy, heroes, slime, wisp, t: 0 };
}]);
/** the title's menu for the slices in this file: grouped by family when there are several (FamilyMenu, in 05-families.js:
 *  the reference editions carry it, a genre kit of one slice doesn't), else a plain E.Menu */
const menuOf = (slices, o) => new Set(slices.map(s => s.family)).size > 1 ? new FamilyMenu(slices, o) : new E.Menu(game, slices.map(s => s.label), o);
let titleMenu = null;   // (made at the start, once the file's slices are known)
scenes.title = {
  view: 'iso', input: W3.INPUT,
  enter() { A.music('title'); active = null; game.resetCamera(); },
  update(dt) {
    if (!titleMenu.update(dt)) pickOnStart(titleMenu);
    const T = title, w = T.world; T.t += dt;
    // the camera turns slowly round the stage; the heroes swing now and then; the slime hops, the wisp hovers
    const a = T.t * .18 + 2.2, d = 120;
    w.camera.fixed = { x: T.cx + Math.cos(a) * d, y: T.cy + Math.sin(a) * d, z: 58, yaw: a + Math.PI, pitch: -.36, fov: 50 };
    T.heroes.forEach((h, i) => {
      const u = (T.t * .45 + i * .5) % 3, swing = u < .5 ? { spec: { a0: 1.4, a1: -1.6, z0: 12, z1: 8, reach: 7.5 }, phase: u < .15 ? 'wind' : 'active', u: u < .15 ? u / .15 : (u - .15) / .35 } : null;
      h.facing = Math.atan2(Math.sin(a), Math.cos(a)) + (i ? -.5 : .5); h.anim = { attack: swing };
    });
    if (T.slime.grounded && (T.t % 1.6) < dt) T.slime.vz = 140;
    T.slime.anim = { squash: T.slime.grounded ? 0 : .2 };
    T.wisp.vz = (8 + 20 + Math.sin(T.t * 2) * 3 - T.wisp.z) * 4;
    w.step(dt);
  },
  draw(r) {
    title.world.draw(r);
    const top = Math.max(10, Math.round(r.H * .1)), my = Math.round(r.H * .58);
    titleMenu.y = my;
    r.overlay(g => {
      veil(g, r, my - 14, .5);
      E.font.title(g, 'my-3D2dge', r.W / 2, top, { align: 'center', scale: 4, colors: ['#fffbe8', '#ffe08a', '#ffb347', '#e0662a'], depth: 3 });
      E.font.title(g, '3D', r.W / 2, top + 36, { align: 'center', scale: 3, colors: ['#e8fcff', '#8af4ff', '#2aa0e0'], depth: 2, depthColor: '#14304a' });
      E.font.text(g, SLICES[titleMenu.i].about, r.W / 2, r.H - 14, '#ffe7a8', { align: 'center', shadow: '#000', outline: false });
    });
    titleMenu.draw(r);
    const dev = game.input.lastDevice, how = dev === 'touch' ? 'Tap a game to play it' : dev === 'gamepad' ? 'D-pad + ' + game.input.label('confirm') + '   ' + game.input.label('start') + ' menu' : 'Arrows + Enter or click   M mute';
    r.text(how, r.W / 2, r.H - 26, '#b8b0d8', { align: 'center', shadow: '#000', outline: false });
  }
};

/* ---- GAME OVER and COURSE CLEAR: shared by every slice, over its world, frozen where it ended ---- */
const overMenu = new E.Menu(game, ['Retry', 'Title'], { y: 'center', onPick: i => game.go(i === 0 ? over.from : 'title') });
let over = { from: 'title', world: null, won: false, lines: [] };
scenes.over = {
  input: W3.INPUT,
  enter(d) { over = Object.assign({ won: false, lines: [] }, d); overMenu.i = 0; A.music(over.won ? 'victory' : null); if (!over.won) A.sfx('die'); active = null; },
  update(dt) { if (!overMenu.update(dt)) pickOnStart(overMenu); },
  back() { game.go('title'); return true; },   // a phone's back gesture: to the title, not off the page
  draw(r) {
    if (over.world) over.world.draw(r);
    const y = Math.round(r.H / 2) - 70; overMenu.y = y + 70 + over.lines.length * 10;
    r.overlay(g => {
      veil(g, r, 0, .6);
      E.font.title(g, over.won ? over.title || 'CLEAR!' : 'GAME OVER', r.W / 2, y, { align: 'center', scale: 4, colors: over.won ? ['#fffbe8', '#ffe08a', '#ffb347'] : ['#ffe0e0', '#ff7a6a', '#c8202a'], depthColor: over.won ? '#3a2008' : '#3a0810' });
      over.lines.forEach((l, i) => E.font.text(g, l, r.W / 2, y + 44 + i * 10, '#f0e6ff', { align: 'center', shadow: '#000', outline: false }));
    });
    overMenu.draw(r);
  }
};

/* =====================================================================================
 * SLICE 7  CRAWLER  (Wizardry, Dungeon Master, Eye of the Beholder, King's Field). @modules grid
 * The Lantern Vaults in first person, a cell at a time: W and S (or up and down) step forward and back, A and D turn a
 * quarter turn, Q and E step aside, each one tweened. A party of four, their portraits under the view: two in front who
 * fight, two behind who cast. J (or a click on the view) uses what is in front (a lever, a locked gate) or has the next
 * one ready act: a blow at what stands in front, else the mage's bolt; K the mage's bolt down the corridor, H the
 * cleric's heal, 1 to 4 (or a click on a portrait) that one's own act; Tab the map (what the party has seen: E.Fog).
 * Gates that rise (one with an iron lock), a lever on a wall, plates in the floor (one raises a gate, one springs darts);
 * wisps, slimes, the dead of the vaults and the Warden at the bottom; the stair out behind it. Settings, Turns: REAL TIME
 * (each one's gauge fills on game time, E.Turns 'atb': Dungeon Master, Eye of the Beholder) or TURNS (the vaults wait:
 * each step, turn or blow is the party's turn, the monsters act by their speed, E.Turns 'speed': Wizardry).
 * THE 3D: the camera 'fixed' at the party's eyes, tweened per step; a level of 2 x 2 tiles a cell, braziers in niches,
 * a ceiling and the party's lantern; world.thing gates that rise, and a lever, plates and a stair drawn by the slice;
 * mobs walked cell to cell. Deep link: #crawler/warden (the Warden's hall, its gates open). CRAWLER.run(n): a scripted
 * walk's hash (the proof); CRAWLER.bot(): to the Warden and out
 * ===================================================================================== */
const CRAWLER = (() => {
  const C = 32, PI = Math.PI, EYE = 25, STEP_T = .28, TURN_T = .2, MOVE_T = .4;

          if (want !== S.dir) c.move[0] = ((want - S.dir + 4) % 4) === 3 ? -1 : 1; else keys0.add('act');
        } else {
          const lineFoe = foes.find(e => e.hp > 0 && e.awake && fog.visible([e.cx, e.cy]) && ((e.cx === S.cx && Math.sign(e.cy - S.cy) === DY[S.dir] && DY[S.dir]) || (e.cy === S.cy && Math.sign(e.cx - S.cx) === DX[S.dir] && DX[S.dir])));
          if (lineFoe && party[3].hp > 0 && party[3].mp >= BOLT_MP && party[3]._turn >= 100) keys0.add('spell');
          else if (lineFoe && Math.abs(lineFoe.cx - S.cx) + Math.abs(lineFoe.cy - S.cy) <= 3 && (waitT += 1 / 120) < 3) { /* wait for it to come (3 s at most) */ }
          else if (g < GOALS.length) {
            waitT = 0;
            const [kind, gx, gy, gd] = GOALS[g];
            if (S.cx === gx && S.cy === gy) {
              if (kind === 'use') { if (S.dir !== gd) c.move[0] = ((gd - S.dir + 4) % 4) === 3 ? -1 : 1; else { keys0.add('act'); g++; } }
              else g++;
            } else {
              const path = grid.path([S.cx, S.cy], [gx, gy], { blocked: (x, y) => !!foeAt(x, y) });
              if (path.length > 1) {
                const [nx, ny] = path[1], want = [0, 1, 2, 3].find(d => S.cx + DX[d] === nx && S.cy + DY[d] === ny);
                if (want === S.dir) c.move[1] = -1; else c.move[0] = ((want - S.dir + 4) % 4) === 3 ? -1 : 1;
              }
            }
          }
        }
        step(1 / 120, c);
        r.warden = r.warden || foes.every(e => e.type !== 'warden') || !!(stair && stair.t.on);
      }
    } catch (e) { errors++; console.error(e); }
    Object.assign(r, { won: ended === 1, alive: alive().length, killed: total - foes.filter(e => e.hp > 0).length, steps, errors, goal: g });
    // TURNS: the vaults hold still while the party waits (a second and a half), then a step: the wisps by the start's
    // hall act (none are awake there yet: the dead in the hall beyond the gate are not seen), so the count is of turns had
    reset(5, 'turns');
    try {
      const before = foes.map(e => [e.cx, e.cy, e._turn].join()).join('|');
      for (let i = 0; i < 180; i++) { keys0.clear(); c.move[0] = c.move[1] = 0; step(1 / 120, c); }
      const still = foes.map(e => [e.cx, e.cy, e._turn].join()).join('|') === before && phase === 'party';
      c.move[1] = -1; step(1 / 120, c); c.move[1] = 0; const t0 = S.cy;
      for (let i = 0; i < 120; i++) step(1 / 120, c);
      r.turns = { waited: still, stepped: t0 !== MAP.findIndex(row => row.includes('@')), back: phase === 'party', rounds, energy: foes.some(e => e._turn > 0) };
    } catch (e) { errors++; r.errors = errors; console.error(e); }
    scripted = false; ended = 0; return r;
  }

  return {
    view: 'iso', input: KEYS, pausable: true, touch: TOUCH,
    enter(d) {
      game.settings.define(SETTING); reset(1); active = world; game.input.touchButtons(TOUCH, { labels: TOUCH_LABELS });
      if (d && d.part === 'warden') { for (const k of ['10,9', '17,7', '17,4']) { raise(gates[k]); gates[k].t.open = 1; world.setSolid(gates[k].t, false); } S.cx = 17; S.cy = 5; S.dir = 0; plates['17,5'].t.on = true; place(1); look(); }
      say(d && d.part === 'warden' ? 'THE WARDEN\'S HALL' : 'THE LANTERN VAULTS. FIND THE WAY DOWN', 3.5);
    },
    update(dt) {
      if (game.input.pressed('map')) { game.input.consume('map'); showMap = !showMap; }
      step(dt, controls());
      const want = foes.some(e => e.type === 'warden' && e.awake && e.hp > 0) ? FIGHT : VAULT;
      if (want !== song && !ended) { song = want; A.music(want); }
    },
    draw(r) {
      world.draw(r);
      r.overlay(g => hud(g, r));
    },
    get world() { return world; }, get hero() { return hero; }, get party() { return party; }, get foes() { return foes; }, get state() { return S; }, get mode() { return mode; },
    get gates() { return gates; }, reset, run, bot, MAP
  };
})();
scenes.crawler = CRAWLER;

/* ---- START: the boot (the 3D engine, then each slice's world, behind the boot screen), then the title menu, or a
 * slice named in the address (#platformer; #racing/vs: the slice's enter(data) gets { part }) ---- */
// a 3D genre kit file holds one slice: the menu lists only the slices in this file
for (let i = SLICES.length - 1; i >= 0; i--) if (!scenes[SLICES[i].id]) SLICES.splice(i, 1);
titleMenu = menuOf(SLICES, { y: 0, room: 34, onPick: i => game.go(SLICES[i].id) });
const [first, part] = (location.hash || '').slice(1).split('/');
game.start({ scenes, scene: scenes[first] ? first : 'title', data: scenes[first] && part ? { part } : undefined, boot: { title: 'my-3D2dge 3D', steps: [
  ['The 3D engine: three.js r182, Rapier 0.19.3', () => W3.init(game)],
  ...BOOT,
  ['Building the shaders', () => { for (const w of W3.worlds) w.prepare(); }]
] } });
window.__game = { game, scenes, titleMenu, get title() { return title; } };   // for tests
/* =============================== GAME END =============================== */

</script>
