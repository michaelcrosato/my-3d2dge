<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perspective Lab · CO55 engine</title>
<!--
  Built with the CO55 2D engine: https://github.com/michaelcrosato/2D-co55-engine
  This file is standalone: engine + game are inlined below. To hand it to another AI,
  point it at the "READ THIS FIRST" block at the top of the engine script.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0e6d6; --panel:rgba(250,242,228,.92); --ink:#2a2140; --muted:#63557a; --accent:#b8612a; --accent-ink:#fff6e6;
  --line:rgba(42,33,64,.2); --key:rgba(42,33,64,.1); --hp:#c8452f; --hp-bg:rgba(42,33,64,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#06050b; --panel:rgba(18,14,30,.82); --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.16); --key:rgba(241,228,200,.12); --hp:#e0463c; --hp-bg:rgba(241,228,200,.12); }
}
:root[data-theme="dark"]{ --bg:#06050b; --panel:rgba(18,14,30,.82); --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.16); --key:rgba(241,228,200,.12); --hp:#e0463c; --hp-bg:rgba(241,228,200,.12); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair}
.hud{position:absolute;z-index:2;pointer-events:none}
.hud > *{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.top{top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.brand{padding:9px 13px 10px;max-width:min(400px,100%)}
.brand h1{margin:0;font-size:21px;font-weight:600;line-height:1.1}
.brand p{margin:5px 0 0;font-size:13.5px;line-height:1.4;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;gap:3px;padding:3px;align-items:center}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;border-radius:4px;padding:6px 10px;min-height:34px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
button:hover{background:var(--key)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:inherit;font-size:11px;line-height:1;padding:3px 5px;border-radius:3px;background:var(--key);min-width:18px;text-align:center}
button[aria-pressed="true"] kbd{background:rgba(0,0,0,.16)}
.fps{font-size:12px;color:var(--muted);padding:0 6px;min-width:50px;text-align:right}
.bottom{left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.vitals{padding:9px 12px;min-width:220px}
.hpbar{height:10px;border-radius:2px;background:var(--hp-bg);overflow:hidden;margin:6px 0 5px}
#hpFill{height:100%;width:100%;background:var(--hp);transition:width .12s}
.row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.row b{color:var(--ink);font-weight:600}
.keys{margin:0;padding:7px 11px;font-size:13px;line-height:1.45;color:var(--muted);max-width:52ch}
.keys b{color:var(--ink);font-weight:600}
#banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);z-index:2;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;color:#f6e7c6;text-shadow:0 2px 0 #1a0f1c,0 0 18px rgba(0,0,0,.6)}
#banner.show{opacity:1}
#bannerTitle{font-size:clamp(28px,5vw,46px);font-weight:600;line-height:1}
#bannerSub{font-size:16px;margin-top:6px;color:#d9c7a6}
.touch{display:none;right:14px;bottom:86px;gap:10px;align-items:flex-end}
.touch button{width:62px;height:62px;justify-content:center;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
.touch button.on{background:var(--accent);color:var(--accent-ink)}
@media (pointer:coarse){ .touch{display:flex} .keys{display:none} kbd{display:none} }
@media (max-width:720px),(max-height:520px){ .brand p{display:none} .brand h1{font-size:17px} .top{top:8px;left:8px;right:8px} }
@media (prefers-reduced-motion: reduce){ #banner,#hpFill{transition:none} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" role="img" aria-label="Perspective lab: one room rendered from five camera views"></canvas>
  <div class="hud top">
    <div class="brand panel">
      <h1>Perspective Lab</h1>
      <p id="note"></p>
    </div>
    <div class="controls">
      <div class="seg panel" role="group" aria-label="Camera view">
        <button type="button" data-view="iso" aria-pressed="false"><kbd>1</kbd>Isometric</button>
        <button type="button" data-view="threequarter" aria-pressed="false"><kbd>2</kbd>Three-quarter</button>
        <button type="button" data-view="topdown" aria-pressed="false"><kbd>3</kbd>Top-down</button>
        <button type="button" data-view="brawler" aria-pressed="false"><kbd>4</kbd>Brawler</button>
        <button type="button" data-view="side" aria-pressed="false"><kbd>5</kbd>Side</button>
      </div>
      <div class="seg panel" role="group" aria-label="Inspection tools">
        <button type="button" id="rigBtn" aria-pressed="false"><kbd>R</kbd>Skeleton</button>
        <button type="button" id="lightBtn" aria-pressed="false"><kbd>L</kbd>Lighting</button>
        <button type="button" id="slowBtn" aria-pressed="false"><kbd>T</kbd>Slow motion</button>
        <span class="fps" id="fps">60 fps</span>
      </div>
    </div>
  </div>
  
  <div class="hud bottom">
    <p class="keys panel"><b>WASD</b> moves, <b>J</b> slashes, <b>Space</b> dashes. <b>V</b> cycles all five cameras. The same skeleton drives every view: press <b>R</b> to see it.</p>
  </div>
  <div class="hud touch" aria-hidden="true">
    <button data-act="dash">Dash</button><button data-act="attack">Slash</button>
  </div>
</div>
<script>
/* ---- inlined from engine/co55.js ---- */
/*!
 * CO55 2D Engine v0.3.0
 * Procedural pixel-puppet engine for every 2D perspective.
 * https://github.com/michaelcrosato/2D-co55-engine  (MIT License)
 *
 * READ THIS FIRST (humans and AI models extending a CO55 game)
 * -----------------------------------------------------------------------------
 * 1. WORLD SPACE IS 3D. x = east, y = south, z = up. One floor tile = 16 units.
 *    Game logic never thinks about screen pixels.
 * 2. A VIEW turns world points into screen pixels. Swap the view and the whole game
 *    re-renders from another angle: CO55.VIEWS.iso, .threequarter, .topdown,
 *    .brawler, .side  (or build your own: new CO55.View(id, label, yaw, pitch, scale, zBoost)).
 * 3. CHARACTERS ARE RIGS, NOT SPRITES. CO55.Humanoid and CO55.Blob recompute their
 *    joints from math every step, in 3D, then project them. That is why they move
 *    fluidly and can face any angle in any view without extra art.
 * 4. PIXEL RULES. Draw with CO55.px (rect, line, disc, ell, poly...). Every shape
 *    snaps to whole pixels. Never use ctx.arc / ctx.stroke / ctx.fillText on the game
 *    buffer: they anti-alias and break the look. Fade with dithering, not alpha.
 * 5. FRAME ORDER (handled by the Renderer):
 *      floor (you call map.drawFloor) -> decals (ground marks, shadows)
 *      -> sorted queue (walls, props, actors, particles) -> lighting -> overlays -> present
 *    Anything that can be in front of or behind something else goes through
 *    r.queue(x, y, z, fn) or r.actor(x, y, z, drawFn, opts).
 * 6. TIME. game.start({ update(dt), draw(r) }). update runs in fixed ~1/120 s
 *    substeps, so motion is identical at 60, 120 or 144 Hz. game.freeze(s) = hit-stop,
 *    game.shake(n) = screen shake, game.timeScale = slow motion.
 * 7. GPU LIGHTING is optional: game.enableGPU({ map }). Mark glowing things with
 *    px.glow(g, 1) inside queue callbacks, pass { color, shadow } to lights.add, and
 *    register shadow casters with game.lights.caster(). Falls back to Canvas lighting.
 * See AI_GUIDE.md in the repo for the full API and recipes.
 */
(function (root) {
'use strict';

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const E = { version: '0.3.0', TAU, DEG };

/* =============================================================================
 * 1. MATH
 * ============================================================================= */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (a, b, s) => a < b ? Math.min(b, a + s) : Math.max(b, a - s);
const ease = {
  outCubic: u => 1 - Math.pow(1 - u, 3),
  outQuad: u => 1 - (1 - u) * (1 - u),
  inQuad: u => u * u,
  inOut: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
  outBack: u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }
};
const angDiff = (a, b) => ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const lerpAng = (a, b, t) => a + angDiff(a, b) * t;
const approachAng = (a, b, s) => { const d = angDiff(a, b); return Math.abs(d) <= s ? b : a + Math.sign(d) * s; };
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);

}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const bayer = (x, y) => BAYER[((y & 3) << 2) | (x & 3)];
function smoothDamp(cur, target, vel, st, dt) {

/** shade('#336699', -0.3) darker, (+0.3) lighter */
const shade = (h, a) => { const c = hex(h); return toHex(c.map(v => a < 0 ? v * (1 + a) : v + (255 - v) * a)); };
const mix = (h1, h2, t) => { const a = hex(h1), b = hex(h2); return toHex(a.map((v, i) => lerp(v, b[i], t))); };

const ctx2d = c => { const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return g; };
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)],
  rz: (v, a) => { const c = Math.cos(a), s = Math.sin(a); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]]; }

/** two-bone IK in 3D: returns [joint, end]. hint points the way the joint should bend. */
function ik3(a, b, L1, L2, hint) {

  const max = L1 + L2 - .01;
  if (dist > max) { d = V3.mul(d, max / dist); b = V3.add(a, d); dist = max; }
  dist = Math.max(dist, .01);
  const n = V3.mul(d, 1 / dist);
  let h = V3.sub(hint, V3.mul(n, V3.dot(hint, n)));
  const hl = V3.len(h);
  h = hl < 1e-4 ? [n[1], -n[0], 0] : V3.mul(h, 1 / hl);
  const x = (L1 * L1 - L2 * L2 + dist * dist) / (2 * dist), y = Math.sqrt(Math.max(0, L1 * L1 - x * x));

}
Object.assign(E, { clamp, lerp, approach, ease, angDiff, lerpAng, approachAng, rng, hash2, noise2, bayer, smoothDamp, hex, toHex, shade, mix, mkCanvas, ctx2d, V3, ik3 });

/* =============================================================================
 * 2. PIXEL PRIMITIVES  (all snap to whole pixels, never anti-aliased)
 *    g = CanvasRenderingContext2D, coordinates in buffer pixels.
 * ============================================================================= */
const px = {};
px.col = (g, c) => { const s = g._info ? g._mat : c; if (g._c !== s) { g.fillStyle = s; g._c = s; } };
/** GPU lighting: what follows glows (0..1). No effect in Canvas mode, so call it freely. */
px.glow = (g, e = 1) => { if (g._info && g._r) { g._mat = g._r._infoCol(g._z || 0, 10, e); g._c = null; } };
px.reset = g => { g._c = null; };
px.rect = (g, x, y, w, h, c) => { px.col(g, c); g.fillRect(Math.round(x), Math.round(y), w, h); };
px.dot = (g, x, y, c) => { px.col(g, c); g.fillRect(Math.round(x), Math.round(y), 1, 1); };
px.line = (g, x0, y0, x1, y1, c, w = 1) => {
  px.col(g, c);
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, o = w >> 1;
  let e = dx + dy;
  for (let i = 0; i < 2000; i++) {
    g.fillRect(x0 - o, y0 - o, w, w);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
};
px.disc = (g, cx, cy, r, c) => {
  px.col(g, c); cx = Math.round(cx); cy = Math.round(cy);
  const R = r + .35, R2 = R * R, n = Math.floor(R);
  for (let dy = -n; dy <= n; dy++) { const hw = Math.floor(Math.sqrt(R2 - dy * dy)); g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
};
px.ell = (g, cx, cy, rx, ry, c) => {
  px.col(g, c); cx = Math.round(cx); cy = Math.round(cy);
  const Ry = ry + .35, n = Math.floor(Ry);
  for (let dy = -n; dy <= n; dy++) {
    const t = 1 - (dy * dy) / (Ry * Ry); if (t < 0) continue;
    const hw = Math.floor((rx + .35) * Math.sqrt(t)); g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
  }
};
const _xs = [];
function scan(pts, span) {
  let y0 = 1e9, y1 = -1e9;
  for (const p of pts) { if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
  y0 = Math.round(y0); y1 = Math.round(y1);
  const n = pts.length;
  for (let y = y0; y <= y1; y++) {
    _xs.length = 0;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) _xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
    }
    _xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < _xs.length; k += 2) { const xa = Math.round(_xs[k]), xb = Math.round(_xs[k + 1]); span(xa, Math.max(xa, xb), y); }
  }

px.poly = (g, pts, c) => { px.col(g, c); scan(pts, (a, b, y) => g.fillRect(a, y, b - a + 1, 1)); };

px.polyDither = (g, pts, c, a, wx = 0, wy = 0) => {
  if (a <= 0) return; if (a >= 1) return px.poly(g, pts, c);
  px.col(g, c);
  scan(pts, (xa, xb, y) => { for (let x = xa; x <= xb; x++) if (a > bayer(x + wx, y + wy)) g.fillRect(x, y, 1, 1); });
};
px.ddisc = (g, cx, cy, r, c, a, wx = 0, wy = 0) => {
  if (a <= 0) return;
  px.col(g, c); cx = Math.round(cx); cy = Math.round(cy);
  const R = r + .35, R2 = R * R, n = Math.floor(R);
  for (let dy = -n; dy <= n; dy++) {
    const hw = Math.floor(Math.sqrt(R2 - dy * dy));
    for (let dx = -hw; dx <= hw; dx++) if (a * (1 - (dx * dx + dy * dy) / R2 * .6) > bayer(cx + dx + wx, cy + dy + wy)) g.fillRect(cx + dx, cy + dy, 1, 1);
  }

E.px = px;
/** GPU surface class for a vertical face normal: 5 +x, 6 -x, 7 +y, 8 -y */
E.faceClass = (nx, ny) => nx > 0 ? 5 : nx < 0 ? 6 : ny > 0 ? 7 : 8;

/* =============================================================================
 * 3. VIEWS (projections)
 *    A view is an orthographic camera: yaw spins around the up axis, pitch tilts
 *    from horizontal (0 = side view) to straight down (90). scale = pixels per world
 *    unit. zBoost exaggerates height (a classic pixel-art cheat for readability).
 *      screen x = ax*x + ay*y
 *      screen y = bx*x + by*y + bz*z
 * ============================================================================= */
class View {

  set(yaw, pitch, scale = 1, zBoost = 1) {
    this.yawDeg = yaw; this.pitchDeg = pitch; this.scale = scale; this.zBoost = zBoost;
    const w = yaw * DEG, p = pitch * DEG, cw = Math.cos(w), sw = Math.sin(w), cp = Math.cos(p), sp = Math.sin(p);
    this.yaw = w; this.pitch = p;
    this.ax = scale * cw; this.ay = -scale * sw;
    this.bx = scale * sp * sw; this.by = scale * sp * cw; this.bz = -scale * cp * zBoost;
    this.dx = sw * cp; this.dy = cw * cp; this.dz = sp;   // true camera depth (bigger = nearer)
    this.fx = sw; this.fy = cw;                           // ground direction that points at the camera
    this.isTop = pitch >= 89; this.isSide = pitch <= 1;

    return this;

  p(x, y, z = 0) { return [this.ax * x + this.ay * y, this.bx * x + this.by * y + this.bz * z]; }
  /** true camera depth: use it to sort parts inside one object */
  depth(x, y, z = 0) { return this.dx * x + this.dy * y + this.dz * z; }
  /** painter's order for whole objects standing on the ground */
  order(x, y, z = 0) { return this.isTop ? z + (this.bx * x + this.by * y) * 1e-3 : this.fx * x + this.fy * y + z * 1e-3; }

  toGround(sx, sy) { const i = this.inv; return i ? [i[0] * sx + i[1] * sy, i[2] * sx + i[3] * sy] : null; }
  /** a direction the player pushed on screen (x right, y down) -> normalized ground direction */
  screenDirToGround(dx, dy) {
    if (!dx && !dy) return [0, 0];
    let g = this.inv ? [this.inv[0] * dx + this.inv[1] * dy, this.inv[2] * dx + this.inv[3] * dy] : [dx, dy];
    const l = Math.hypot(g[0], g[1]) || 1, m = Math.min(1, Math.hypot(dx, dy));

E.View = View;

  if (inp.buffered('dash') && h.dashT <= 0) { inp.consume('dash'); h.dashT = .18; P.dust(h.x, h.y, 0, 5); }
  if (h.dashT > 0) { h.dashT -= dt; h.vx = Math.cos(h.facing) * 220; h.vy = Math.sin(h.facing) * 220; }
  else { h.vx = approach(h.vx, d[0] * 75, 900 * dt); h.vy = approach(h.vy, d[1] * 75, 900 * dt); }
  if (Math.hypot(d[0], d[1]) > .1 && !h.atk) h.facing = E.approachAng(h.facing, Math.atan2(d[1], d[0]), dt * 14);
  if (inp.buffered('attack') && !h.atk) { inp.consume('attack'); h.atk = { phase: 'wind', t: 0 }; }
  if (h.atk) {
    h.atk.t += dt;
    if (h.atk.t >= DUR[h.atk.phase]) { h.atk.t = 0; h.atk.phase = h.atk.phase === 'wind' ? 'active' : h.atk.phase === 'active' ? 'recover' : null; if (!h.atk.phase) h.atk = null; }
  }
  h.x += h.vx * dt; h.y += h.vy * dt; map.collide(h);
  h.rig.update(dt, { x: h.x, y: h.y, vx: h.vx, vy: h.vy, facing: h.facing, dash: h.dashT > 0,
    attack: h.atk ? { spec: SWING, phase: h.atk.phase, u: clamp(h.atk.t / DUR[h.atk.phase], 0, 1) } : null });

  // the walker strolls a figure-eight so you can watch the gait from every angle
  const w = walker; w.t += dt * .45;
  const tx = 4.5 * T + Math.sin(w.t) * 34, ty = 5.5 * T + Math.sin(w.t * 2) * 18;
  w.vx = (tx - w.x) / dt * .05; w.vy = (ty - w.y) / dt * .05; w.x += w.vx * dt; w.y += w.vy * dt;
  w.facing = E.approachAng(w.facing, Math.atan2(w.vy, w.vx), dt * 6);
  w.rig.update(dt, { x: w.x, y: w.y, vx: w.vx, vy: w.vy, facing: w.facing });

  // the slime hops in place, looking at the hero
  const s = slime; s.t -= dt;
  if (s.z <= 0 && s.t <= 0) { s.vz = 140; s.t = 1.1; s.blob.kick(4); }
  s.vz -= 460 * dt; s.z = Math.max(0, s.z + s.vz * dt);
  if (s.z === 0 && s.vz < -60) { s.vz = 0; s.blob.kick(-5); P.dust(s.x, s.y, 0, 4); }
  s.blob.update(dt, { squash: s.z > 0 ? clamp(s.vz / 600, -.2, .28) : s.t < .25 ? -.3 : 0, look: [h.x - s.x, h.y - s.y] });

  game.focus(h.x, h.y, 8);
}

/* 5. Draw: floor, decals, then queue everything that sorts by depth. */
function draw(r) {
  const view = r.view;
  map.drawFloor(r);
  for (const a of [hero, walker]) r.shadow(a.x, a.y, 5.5, .45);
  r.shadow(slime.x, slime.y, 6, .45);
  map.queueWalls(r);
  r.queue(10.5 * T, 7 * T, 0, g => { r.box(g, 10 * T, 6.6 * T, 0, 11 * T, 7.4 * T, 10, '#b08a58', '#7a5a36'); });
  r.actor(hero.x, hero.y, 0, (g, ox, oy) => hero.rig.draw(g, ox, oy, view), { xray: true, ghost: hero.dashT > 0 ? { color: '#62d8ff' } : null });
  hero.rig.drawSmear(r);
  r.actor(walker.x, walker.y, 0, (g, ox, oy) => walker.rig.draw(g, ox, oy, view));
  r.actor(slime.x, slime.y, slime.z, (g, ox, oy) => slime.blob.draw(g, ox, oy, view));
  game.lights.add(hero.x, hero.y, 10, 90, .9);
  game.lights.add(10.5 * T, 7 * T, 14, 80, .7);
  if (showRig) r.overlay(() => { hero.rig.debug(r); walker.rig.debug(r); });
  r.overlay(g => E.font.text(g, view.label.toUpperCase(), 6, r.H - 10, '#f1e4c8'));
}

/* 6. UI: view buttons, toggles. */
const $ = id => document.getElementById(id);
let showRig = false;
const btns = [...document.querySelectorAll('[data-view]')];
const NOTES = {
  iso: 'Yaw 45°, pitch 30°, 2:1 pixels. Diablo, Bastion.',
  threequarter: 'Yaw 0°, pitch 55°, height boosted. Zelda, Stardew Valley.',
  topdown: 'Yaw 0°, pitch 80°. Hotline Miami, GTA.',
  brawler: 'Yaw 0°, pitch 25°. Streets of Rage, Castle Crashers.',
  side: 'Yaw 0°, pitch 0°. Up and down walk into the screen. Platformers use this view.'
};
function setView(id) { game.setView(id); btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === id))); $('note').textContent = NOTES[id]; }
btns.forEach(b => b.addEventListener('click', () => { setView(b.dataset.view); b.blur(); }));
const tog = (id, get, set) => { const b = $(id); b.addEventListener('click', () => { set(!get()); b.setAttribute('aria-pressed', String(get())); b.blur(); }); return () => b.setAttribute('aria-pressed', String(get())); };
const syncRig = tog('rigBtn', () => showRig, v => { showRig = v; });
const syncLight = tog('lightBtn', () => game.lights.enabled, v => { game.lights.enabled = v; });
const syncSlow = tog('slowBtn', () => game.timeScale < 1, v => { game.timeScale = v ? .25 : 1; });
addEventListener('keydown', e => {
  if (e.repeat) return;
  const order = E.VIEW_ORDER;
  if (e.code === 'KeyV') setView(order[(order.indexOf(game.view.id) + 1) % order.length]);
  else if (/^Digit[1-5]$/.test(e.code)) setView(order[+e.code.slice(5) - 1]);
  else if (e.code === 'KeyR') { showRig = !showRig; syncRig(); }
  else if (e.code === 'KeyL') { game.lights.enabled = !game.lights.enabled; syncLight(); }
  else if (e.code === 'KeyT') { game.timeScale = game.timeScale < 1 ? 1 : .25; syncSlow(); }
});
game.input.bindButtons(document);
game.lights.ambient = .35;
setView('threequarter');
game.start({ update, draw: r => { draw(r); $('fps').textContent = game.fps + ' fps'; } });
window.__game = { game, hero, setView };
})();

</script>
