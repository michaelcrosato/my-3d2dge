<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scarfrunner: procedural pixel animation demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe3cf; --panel:rgba(252,244,230,.9); --ink:#2a2140; --muted:#65557a;
  --accent:#b8612a; --accent-ink:#fff6e6; --line:rgba(42,33,64,.2); --key:rgba(42,33,64,.1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07060d; --panel:rgba(20,16,36,.8); --ink:#f4e6c8; --muted:#b3a3c6;
    --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(244,230,200,.18); --key:rgba(244,230,200,.13);
  }
}
:root[data-theme="dark"]{
  --bg:#07060d; --panel:rgba(20,16,36,.8); --ink:#f4e6c8; --muted:#b3a3c6;
  --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(244,230,200,.18); --key:rgba(244,230,200,.13);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#07060d;touch-action:none}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.hud{position:absolute;z-index:2;pointer-events:none}
.hud > *{pointer-events:auto}
.top{top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 13px 10px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);max-width:min(430px,100%)}
.brand h1{margin:0;font-size:21px;font-weight:600;line-height:1.1;letter-spacing:.01em}
.brand p{margin:5px 0 0;font-size:13.5px;line-height:1.4;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.seg{display:flex;gap:3px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;border-radius:4px;
  padding:6px 10px;min-height:34px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
button:hover{background:var(--key)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:inherit;font-size:11px;line-height:1;padding:3px 5px;border-radius:3px;background:var(--key);min-width:18px;text-align:center}
button[aria-pressed="true"] kbd{background:rgba(0,0,0,.16)}
.fps{font-size:12px;color:var(--muted);padding:0 6px;min-width:52px;text-align:right}
.keys{left:12px;bottom:12px;margin:0;font-size:13px;line-height:1.4;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 11px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);max-width:calc(100% - 24px)}
.keys b{color:var(--ink);font-weight:600}
.touch{display:none;left:14px;right:14px;bottom:14px;justify-content:space-between;align-items:flex-end}
.pad{display:flex;gap:10px}
.touch button{width:64px;height:64px;justify-content:center;border-radius:50%;font-size:14px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.touch button.on{background:var(--accent);color:var(--accent-ink)}
@media (pointer:coarse){
  .touch{display:flex}
  .keys{display:none}
  kbd{display:none}
}
@media (max-width:640px), (max-height:480px){
  .brand p{display:none}
  .brand h1{font-size:17px}
  .top{top:8px;left:8px;right:8px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" role="img" aria-label="Scarfrunner, a side-scrolling platformer where every character is drawn by code each frame"></canvas>

  <div class="hud top">
    <div class="brand">
      <h1>Scarfrunner</h1>
      <p id="note"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Art quality">
        <button type="button" data-mode="std" aria-pressed="false"><kbd>1</kbd>Standard</button>
        <button type="button" data-mode="hq" aria-pressed="true"><kbd>2</kbd>High quality</button>
      </div>
      <div class="seg" role="group" aria-label="Inspection tools">
        <button type="button" id="slowBtn" aria-pressed="false"><kbd>T</kbd>Slow motion</button>
        <button type="button" id="rigBtn" aria-pressed="false"><kbd>R</kbd>Show skeleton</button>
        <span class="fps" id="fps" aria-live="off">60 fps</span>
      </div>
    </div>
  </div>

  <p class="hud keys"><b>Arrows</b> or <b>A D</b> run. <b>Z</b> or <b>Space</b> jumps, <b>X</b> slashes, <b>C</b> dashes. Hold <b>Down</b> and jump to drop through planks.</p>

  <div class="hud touch" aria-hidden="true">
    <div class="pad"><button data-act="left">◀</button><button data-act="right">▶</button></div>
    <div class="pad"><button data-act="dash">Dash</button><button data-act="attack">Slash</button><button data-act="jump">Jump</button></div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  Math + helpers
 * ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (a, b, s) => a < b ? Math.min(b, a + s) : Math.max(b, a - s);
const eOutC = u => 1 - Math.pow(1 - u, 3);
const eOutQ = u => 1 - (1 - u) * (1 - u);
const eInQ = u => u * u;
const eInOut = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const eOutBack = u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const lerpAng = (a, b, t) => { const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; };
const lp = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const bay = (x, y) => BAY[((y & 3) << 2) | (x & 3)];
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const g2 = c => { const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return g; };

/* ------------------------------------------------------------------ *
 *  Pixel primitives. Every shape snaps to whole pixels, so nothing
 *  is ever anti-aliased: the art stays crisp while motion stays smooth.
 * ------------------------------------------------------------------ */
function col(g, c) { if (g._c !== c) { g.fillStyle = c; g._c = c; } }
function rect(g, x, y, w, h, c) { col(g, c); g.fillRect(Math.round(x), Math.round(y), w, h); }
function line(g, x0, y0, x1, y1, c, w = 1) {
  col(g, c);
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let e = dx + dy; const o = w >> 1;
  for (let i = 0; i < 500; i++) {
    g.fillRect(x0 - o, y0 - o, w, w);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function disc(g, cx, cy, r, c) {
  col(g, c); cx = Math.round(cx); cy = Math.round(cy);
  const R = r + .35, R2 = R * R, n = Math.floor(R);
  for (let dy = -n; dy <= n; dy++) { const hw = Math.floor(Math.sqrt(R2 - dy * dy)); g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
}
function ell(g, cx, cy, rx, ry, c) {
  col(g, c); cx = Math.round(cx); cy = Math.round(cy);
  const Ry = ry + .35, n = Math.floor(Ry);
  for (let dy = -n; dy <= n; dy++) {
    const t = 1 - (dy * dy) / (Ry * Ry); if (t < 0) continue;
    const hw = Math.floor((rx + .35) * Math.sqrt(t)); g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1);
  }
}
const _xs = [];
function poly(g, pts, c) {
  col(g, c);
  let y0 = 1e9, y1 = -1e9;
  for (const p of pts) { if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
  y0 = Math.round(y0); y1 = Math.round(y1);
  const n = pts.length;
  for (let y = y0; y <= y1; y++) {
    _xs.length = 0;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) _xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
    }
    _xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < _xs.length; k += 2) {
      const xa = Math.round(_xs[k]), xb = Math.round(_xs[k + 1]);
      g.fillRect(xa, y, Math.max(1, xb - xa + 1), 1);
    }
  }
}
/* dithered disc: fades out with an ordered pattern instead of blurry alpha */
function ddisc(g, cx, cy, r, c, a, wx, wy) {
  if (a <= 0) return;
  col(g, c); cx = Math.round(cx); cy = Math.round(cy);
  const R = r + .35, R2 = R * R, n = Math.floor(R);
  for (let dy = -n; dy <= n; dy++) {
    const hw = Math.floor(Math.sqrt(R2 - dy * dy));
    for (let dx = -hw; dx <= hw; dx++) {
      const aa = a * (1 - (dx * dx + dy * dy) / R2 * .6);
      if (aa > bay(cx + dx + wx, cy + dy + wy)) g.fillRect(cx + dx, cy + dy, 1, 1);
    }
  }
}

/* ------------------------------------------------------------------ *
 *  Canvas setup: low internal resolution, whole-number upscale
 * ------------------------------------------------------------------ */
const stage = document.getElementById('stage');
const screen = document.getElementById('screen');
const sctx = screen.getContext('2d');
const buf = mk(8, 8), ctx = g2(buf);
let W = 320, H = 200, S = 3, OX = 0, OY = 0;
let skyHQ = null, skyStd = null;

/* ------------------------------------------------------------------ *
 *  World
 * ------------------------------------------------------------------ */
const TILE = 16, COLS = 180, ROWS = 20, WW = COLS * TILE, WH = ROWS * TILE;
const grid = new Uint8Array(COLS * ROWS); // 0 air, 1 solid, 2 one-way plank
const SEGS = [[0, 24, 15], [28, 40, 14], [41, 46, 12], [47, 60, 14], [65, 80, 15], [81, 90, 13], [91, 94, 11],
  [95, 110, 15], [115, 135, 14], [136, 150, 12], [151, 179, 15]];
const PLATS = [[18, 11, 5], [31, 10, 4], [50, 10, 5], [56, 7, 4], [69, 11, 4], [74, 8, 5], [99, 11, 4], [104, 8, 4],
  [119, 10, 5], [125, 7, 4], [140, 8, 4], [157, 11, 5], [163, 8, 4]];
for (const [a, b, top] of SEGS) for (let c = a; c <= b; c++) for (let r = top; r < ROWS; r++) grid[r * COLS + c] = 1;
for (const [c0, r, len] of PLATS) for (let c = c0; c < c0 + len; c++) grid[r * COLS + c] = 2;
const tileAt = (c, r) => (c < 0 || c >= COLS) ? 1 : (r < 0 || r >= ROWS) ? 0 : grid[r * COLS + c];
const topOf = new Int16Array(COLS * ROWS);
for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) if (grid[r * COLS + c] === 1)
  topOf[r * COLS + c] = (r > 0 && grid[(r - 1) * COLS + c] === 1) ? topOf[(r - 1) * COLS + c] : r;
const surfaceRow = c => { if (c < 0 || c >= COLS) return -1; for (let r = 0; r < ROWS; r++) if (grid[r * COLS + c] === 1) return r; return -1; };

/* shared collision for anything with a box: feet at (x, y) */
function moveBody(b, dt) {
  b.hitWall = 0;
  b.x += b.vx * dt;
  const top = b.y - b.h + .5, bot = b.y - .5;
  const r0 = Math.floor(top / TILE), r1 = Math.floor(bot / TILE);
  if (b.vx > 0) {
    const c = Math.floor((b.x + b.hw) / TILE);
    for (let r = r0; r <= r1; r++) if (tileAt(c, r) === 1) { b.x = c * TILE - b.hw - .01; b.vx = 0; b.hitWall = 1; break; }
  } else if (b.vx < 0) {
    const c = Math.floor((b.x - b.hw) / TILE);
    for (let r = r0; r <= r1; r++) if (tileAt(c, r) === 1) { b.x = (c + 1) * TILE + b.hw + .01; b.vx = 0; b.hitWall = -1; break; }
  }
  const prevBot = b.y;
  b.y += b.vy * dt;
  b.grounded = false; b.onOneWay = false;
  const c0 = Math.floor((b.x - b.hw + .5) / TILE), c1 = Math.floor((b.x + b.hw - .5) / TILE);
  if (b.vy >= 0) {
    const r = Math.floor(b.y / TILE);
    let landed = false, allPlank = true;
    for (let c = c0; c <= c1; c++) {
      const t = tileAt(c, r);
      if (t === 1 || (t === 2 && prevBot <= r * TILE + .5 && !(b.drop > 0))) { landed = true; if (t === 1) allPlank = false; }
    }
    if (landed) { b.y = r * TILE; b.vy = 0; b.grounded = true; b.onOneWay = allPlank; }
  } else {
    const r = Math.floor((b.y - b.h) / TILE);
    for (let c = c0; c <= c1; c++) if (tileAt(c, r) === 1) { b.y = (r + 1) * TILE + b.h; b.vy = 0; break; }
  }
}

/* ------------------------------------------------------------------ *
 *  Palettes
 * ------------------------------------------------------------------ */
const HC = {
  cloth: '#2f8f86', clothLt: '#63c9b1', clothDk: '#1f5e60', clothDk2: '#16404b',
  pants: '#3b3552', pantsDk: '#2a2541', boot: '#6a4128', bootDk: '#452a1b',
  skin: '#f1c7a0', skinDk: '#c98f6c', eye: '#1a1320', belt: '#e0a84a',
  scarf: '#f0a23a', scarfLt: '#ffd47c', scarfDk: '#b35e28',
  blade: '#dce8f1', bladeLt: '#ffffff', bladeDk: '#7f93ab', hilt: '#e8b04e', grip: '#6b3f24'
};
const BC = { dk: '#6d2658', base: '#c95f9a', lt: '#f5a3cc', spec: '#fff2f8' };
const MC = { body: '#3a2c4e', bodyLt: '#6a5584', wing: '#e6d3a6', wingDk: '#b3926a', spot: '#8a4a6a', lan: '#ffcf6a', lanLt: '#fff6cf' };
const OUTLINE = '#120d1d', RIM = '#ffc27a';

/* ------------------------------------------------------------------ *
 *  Level art: high quality (dithered depth bands, lit faces, decor)
 * ------------------------------------------------------------------ */
function buildLevelHQ() {
  const cv = mk(WW, WH), g = g2(cv), img = g.createImageData(WW, WH), d = img.data;
  const dirt = ['#6e4834', '#5b3a29', '#492e21', '#3a241b', '#2c1b15'].map(hex);
  const grass = ['#a9da76', '#6db35a', '#4a8f4d', '#356b43'].map(hex);
  const speckL = hex('#83593e'), speckD = hex('#241510'), edgeD = hex('#23150f'), edgeL = hex('#9a6a47');
  const wood = ['#c38a4f', '#94603a', '#83532f', '#5e3b22', '#3a2416'].map(hex), nail = hex('#2e2320');
  for (let y = 0; y < WH; y++) {
    const r = y >> 4;
    for (let x = 0; x < WW; x++) {
      const c = x >> 4, t = grid[r * COLS + c];
      if (!t) continue;
      let rgb = null;
      if (t === 1) {
        const dd = y - topOf[r * COLS + c] * TILE, lx = x & 15;
        const leftOpen = tileAt(c - 1, r) !== 1, rightOpen = tileAt(c + 1, r) !== 1;
        const hh = hash2(x, 7);
        const capH = 4 + (hh < .3 ? 1 : 0) + (hh > .86 ? 2 : 0);
        if (dd < capH) rgb = dd === 0 ? grass[0] : dd < 2 ? grass[1] : dd < capH - 1 ? grass[2] : grass[3];
        else {
          const band = (dd - capH) / 15, bi = Math.floor(band), fr = band - bi;
          let i = Math.min(4, bi);
          if (i < 4 && fr > .5 && bay(x, y) < (fr - .5) / .5) i++;
          rgb = dirt[i];
          const hs = hash2(x * 3 + 1, y * 7 + 2);
          if (hs < .03) rgb = speckL; else if (hs < .055) rgb = speckD;
          if (leftOpen && lx < 2) rgb = lx === 0 ? edgeD : dirt[Math.min(4, i + 1)];
          if (rightOpen && lx === 15) rgb = edgeL;
        }
      } else {
        const ly = y & 15, lx = x & 15;
        if (ly > 6) continue;
        const L = tileAt(c - 1, r) !== 2, R = tileAt(c + 1, r) !== 2;
        if (((L && lx === 0) || (R && lx === 15)) && (ly === 0 || ly === 6)) continue;
        if (ly === 0) rgb = wood[0];
        else if (ly < 5) rgb = hash2(x >> 3, y + c * 5) < .35 ? wood[2] : wood[1];
        else rgb = ly === 5 ? wood[3] : wood[4];
        if (lx === 0 && ly > 0 && ly < 6) rgb = wood[3];
        if ((lx === 3 && ly === 2) || (lx === 12 && ly === 3)) rgb = nail;
      }
      const k = (y * WW + x) * 4;
      d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const R = rng(11);
  // embedded stones
  for (let i = 0; i < 150; i++) {
    const x = Math.floor(R() * WW), y = Math.floor(R() * WH), c = x >> 4, r = y >> 4;
    if (tileAt(c, r) !== 1 || y - topOf[r * COLS + c] * TILE < 10) continue;
    const rx = 1.5 + R() * 2.5, ry = 1 + R() * 1.8;
    ell(g, x, y, rx + 1, ry + 1, '#2a1c1c'); ell(g, x, y, rx, ry, '#5f5a6e'); ell(g, x + 1, y - 1, rx * .5, ry * .45, '#8c86a0');
  }
  // bushes and rocks on the surface
  for (let c = 2; c < COLS - 2; c++) {
    const r = surfaceRow(c); if (r < 0 || R() > .22) continue;
    if (surfaceRow(c - 1) !== r || surfaceRow(c + 1) !== r) continue;
    const x = c * TILE + 8, y = r * TILE + 1;
    if (R() < .7) {
      const w = 7 + R() * 7;
      for (let k = 0; k < 4; k++) disc(g, x - w * .6 + k * w * .4, y - 4 - R() * 3, 4 + R() * 2.5, '#1f4a38');
      for (let k = 0; k < 4; k++) disc(g, x - w * .55 + k * w * .4, y - 5 - R() * 3, 3 + R() * 2, '#326d48');
      for (let k = 0; k < 3; k++) disc(g, x - w * .3 + k * w * .38 + 1, y - 7 - R() * 2, 1.5 + R() * 1.2, '#5b9d58');
      if (R() < .5) for (let k = 0; k < 3; k++) rect(g, x - w * .4 + R() * w * .9, y - 3 - R() * 7, 1, 1, '#e8687a');
    } else {
      ell(g, x, y - 3, 6, 4.5, '#2a2330'); ell(g, x, y - 3, 5, 3.5, '#5a5470'); ell(g, x + 2, y - 5, 2.5, 1.5, '#8a84a2');
    }
  }
  // start signpost
  const sx = 5 * TILE, sy = 15 * TILE;
  rect(g, sx - 1, sy - 16, 3, 16, '#5e3b22'); rect(g, sx, sy - 16, 1, 16, '#94603a');
  rect(g, sx - 9, sy - 19, 19, 8, '#3a2416'); rect(g, sx - 8, sy - 18, 17, 6, '#94603a'); rect(g, sx - 8, sy - 18, 17, 1, '#c38a4f');
  line(g, sx - 5, sy - 15, sx + 4, sy - 15, '#3a2416'); line(g, sx + 2, sy - 17, sx + 4, sy - 15, '#3a2416'); line(g, sx + 2, sy - 13, sx + 4, sy - 15, '#3a2416');
  return cv;
}

/* Level art: standard (flat two-tone blocks) */
function buildLevelStd() {

/* ------------------------------------------------------------------ *
 *  Frame render
 * ------------------------------------------------------------------ */
function render() {
  let cx = cam.x, cy = cam.y;
  if (hq && shake > .05 && !reduceMotion) {
    cx += (Math.sin(real * 83) + Math.sin(real * 57.3)) * .5 * shake;
    cy += (Math.sin(real * 71) + Math.sin(real * 49.7)) * .5 * shake;
  }
  let ix, iy;
  if (hq) { ix = Math.floor(cx); iy = Math.floor(cy); ctx.clearRect(0, 0, buf.width, buf.height); }
  else {
    ix = Math.round(cx); iy = Math.round(cy);
    ctx.drawImage(skyStd, 0, 0);
    for (const L of layersStd) {
      const LW = L.cv.width, LH = L.cv.height;
      let xo = -Math.floor(ix * L.f); xo = ((xo % LW) + LW) % LW - LW;
      const y = Math.round(L.base - iy * L.fy);
      for (let x = xo; x < W + 1; x += LW) ctx.drawImage(L.cv, x, y);
      if (y + LH < H + 1) rect(ctx, 0, y + LH, W + 1, H + 1 - (y + LH), L.fill);
    }
  }
  camIX = ix; camIY = iy;
  ctx.drawImage(hq ? levelHQ : levelStd, -ix, -iy);
  if (hq) drawGrass(false);

  for (const e of enemies) {
    if (!e.alive) continue;
    if (hq) composite((g, ox, oy) => e.type === 'blob' ? drawBlobHQ(g, ox, oy, e) : drawMothHQ(g, ox, oy, e), e.x, e.y, { flash: e.flash > 0 });

  }

      const l = lantern(e);
      ddisc(ctx, Math.round(e.x + l[0]) - ix, Math.round(e.y + l[1]) - iy - 1, 9 + Math.sin(time * 9 + e.t) * 1.2, '#4d2f10', .95, ix, iy);
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const gh of ghosts) {

  const LW = L.cv.width, LH = L.cv.height;
  let xo = -(cx * L.f + (L.drift ? time * L.drift : 0));
  xo = ((xo % LW) + LW) % LW - LW;
  const dy = OY + Math.round(yTop * S);
  for (let x = xo; x < W; x += LW) sctx.drawImage(L.cv, OX + Math.round(x * S), dy, LW * S, LH * S);

/* ------------------------------------------------------------------ *
 *  Loop: small fixed-size steps so motion is identical at 60, 120 or 144 Hz
 * ------------------------------------------------------------------ */
function step(dt) {
  real += dt;
  shake *= Math.exp(-dt * 9);
  if (hitstop > 0) { hitstop -= dt; return; }
  time += dt;
  gust = Math.pow(Math.max(0, Math.sin(time * .35)), 4) * .35;
  updatePlayer(dt);
  updateEnemies(dt);
  updateParticles(dt);
  ambient(dt);
  updateCamera(dt);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3), r = stage.getBoundingClientRect();
  const pw = Math.max(1, Math.round(r.width * dpr)), ph = Math.max(1, Math.round(r.height * dpr));
  screen.width = pw; screen.height = ph;
  S = Math.max(1, Math.min(Math.floor(ph / 190), Math.floor(pw / 300)));
  W = Math.min(560, Math.ceil(pw / S)); H = Math.min(300, Math.ceil(ph / S));
  OX = Math.floor((pw - W * S) / 2); OY = Math.floor((ph - H * S) / 2);
  buf.width = W + 2; buf.height = H + 2; ctx._c = null; ctx.imageSmoothingEnabled = false;
  skyHQ = buildSkyHQ(W, H); skyStd = buildSkyStd(W + 1, H + 1);

}

  hq = isHQ;
  modeBtns.forEach(b => b.setAttribute('aria-pressed', String((b.dataset.mode === 'hq') === hq)));
  note.textContent = NOTE[hq ? 'hq' : 'std'];
  if (!hq) { ghosts.length = 0; for (let i = parts.length - 1; i >= 0; i--) if (parts[i].k === 'leaf' || parts[i].k === 'mote' || parts[i].k === 'ring') parts.splice(i, 1); }
}
function setSlow(v) { slow = v; slowBtn.setAttribute('aria-pressed', String(v)); }
function setRig(v) { showRig = v; rigBtn.setAttribute('aria-pressed', String(v)); }
modeBtns.forEach(b => b.addEventListener('click', () => { setMode(b.dataset.mode === 'hq'); b.blur(); }));
slowBtn.addEventListener('click', () => { setSlow(!slow); slowBtn.blur(); });
rigBtn.addEventListener('click', () => { setRig(!showRig); rigBtn.blur(); });

const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump',
  ArrowDown: 'down', KeyS: 'down', KeyX: 'attack', KeyJ: 'attack', KeyC: 'dash', KeyK: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash' };
addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (a) { e.preventDefault(); if (!e.repeat) press(a); keys.add(a); return; }
  if (e.repeat) return;
  if (e.code === 'Digit1') setMode(false);
  else if (e.code === 'Digit2') setMode(true);
  else if (e.code === 'Tab') { e.preventDefault(); setMode(!hq); }
  else if (e.code === 'KeyT') setSlow(!slow);
  else if (e.code === 'KeyR') setRig(!showRig);
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) keys.delete(a); });
addEventListener('blur', () => keys.clear());
document.querySelectorAll('.touch [data-act]').forEach(b => {
  const a = b.dataset.act;
  const on = e => { e.preventDefault(); b.setPointerCapture && b.setPointerCapture(e.pointerId); if (!keys.has(a)) press(a); keys.add(a); b.classList.add('on'); };
  const off = () => { keys.delete(a); b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
});

addEventListener('resize', resize);
resize();
initScarf();
updatePose(0);
cam.x = clamp(P.x + 26 - W / 2, 0, WW - W); cam.y = cam.ty;
setMode(true);

let last = performance.now(), fAcc = 0, fN = 0;
function frame(now) {
  let dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  fAcc += dt; fN++;
  if (fAcc > .5) { fpsEl.textContent = Math.round(fN / fAcc) + ' fps'; fAcc = 0; fN = 0; }
  const sdt = dt * (slow ? .2 : 1), n = Math.max(1, Math.ceil(sdt / (1 / 120) - 1e-6)), h = sdt / n;
  for (let i = 0; i < n; i++) step(h);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__demo = { P, keys, press, setMode, setRig, cam, enemies, scarf, scr: () => [(P.x - cam.x) * S + OX, (P.y - cam.y) * S + OY] };
})();
</script>
