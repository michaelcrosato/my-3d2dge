 *   effects   FX.* verbs (projectile, nova, area, strike, meteor, chain, beam, wave, pull, telegraph) used by

/* =============================================================================

/* ---- projectile: bolts, orbs, blades, bones, spit, arrows; pierce, chain, fork, homing, bounce, lob ---- */

    hitCircle(f.team, f.x, f.y, R, v => mkHit(f, { ang: Math.atan2(v.y - f.y, v.x - f.x), tags: f.tags || ['aoe'] }), f.set);

    if (u < 1) L.add(f.x, f.y, 6, R + 20, .6 * (1 - u), { color: col });

/* ---- area: lingering ground (fire, frost field, void pool, venom puddle, storm field), ticks its hit ---- */
FX.area = o => {
  const f = addFx(Object.assign({ kind: 'area', team: 'hero', x: 0, y: 0, r: 20, dur: 3, tick: .5, t: 0, nt: 0, z: 0 }, o));
  const e = EL(f.el || 'phys'), col = f.color || e.color;
  f.update = dt => {
    f.t += dt; f.nt -= dt;

    if (f.nt <= 0) { f.nt = f.tick; if (f.hit) hitCircle(f.team, f.x, f.y, f.r, v => mkHit(f, { kb: 0, noNumber: false, tags: f.tags || ['area', 'dot'] })); if (f.onTick) f.onTick(f); }
    if (Math.random() < dt * f.r * .25) {
      const a = Math.random() * TAU, d = Math.sqrt(Math.random()) * f.r, x = f.x + Math.cos(a) * d, y = f.y + Math.sin(a) * d;
      if (f.el === 'fire') P.add({ kind: 'fire', x, y, z: 1, vz: 18, g: -8, drag: 3, max: .45, size: 2.4 });
      else if (f.el === 'frost') P.glints(x, y, 2, 1, '#e8fbff', 3);
      else if (f.el === 'void') P.add({ kind: 'ember', x, y, z: 1, vz: 22, max: .8, color: '#b070ff' });
      else if (f.el === 'venom') P.add({ kind: 'dust', x, y, z: 1, vz: 8, g: -4, drag: 2, max: .7, size: 1.6, color: '#8ae04a' });

    }
    return f.t < f.dur;
  };
  f.draw = r => {
    const fade = Math.min(1, (f.dur - f.t) * 3, f.t * 6), pul = .5 + .5 * Math.sin(game.time * 6 + f.x);

      r.groundDisc(f.x, f.y, f.r, e.dark, .35 * fade, f.z);

      if (f.el === 'frost') for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + f.x, d = f.r * .6; r.groundDisc(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d, 2.2, '#e8fbff', .6 * fade, f.z); }
    }, { emissive: .5 * fade });
    if (f.light !== false) L.add(f.x, f.y, 4, f.r + 24, .45 * fade, { color: col });
  };
  return f;
};

/* ---- telegraph: a warning shape that fills, then fires then() (enemy attacks, meteors, strikes) ---- */
// shape: 'circle' { r } | 'arc' { r, ang, half } | 'line' { ang, len, w } | 'ring' { r0, r1 }
FX.telegraph = o => {
  const f = addFx(Object.assign({ kind: 'tele', shape: 'circle', x: 0, y: 0, r: 20, dur: .7, t: 0, color: '#ff4a3a' }, o));
  f.update = dt => { f.t += dt; if (f.follow && f.follow.alive) { f.x = f.follow.x; f.y = f.follow.y; if (f.followAng) f.ang = f.follow.facing; } if (f.t >= f.dur) { if (f.then && !f.cancelled && (!f.owner || f.owner.alive)) f.then(f); return false; } return !f.cancelled && (!f.owner || f.owner.alive); };
  f.draw = r => {
    const u = clamp(f.t / f.dur, 0, 1), c = f.color, a = .2 + .5 * u;
    r.decal(() => {
      if (f.shape === 'circle') { r.groundDisc(f.x, f.y, f.r * u, c, a * .8); r.groundRing(f.x, f.y, f.r, c, .5 + .4 * u); }
      else if (f.shape === 'arc') r.groundArc(f.x, f.y, 2, 2 + (f.r - 2) * u, f.ang - f.half, f.ang + f.half, c, a);
      else if (f.shape === 'ring') { r.groundRing(f.x, f.y, f.r0, c, .6); r.groundRing(f.x, f.y, f.r1, c, .6); r.groundArc(f.x, f.y, f.r0, lerp(f.r0, f.r1, u), 0, TAU, c, a * .7); }
      else if (f.shape === 'line') {
        const ca = Math.cos(f.ang), sa = Math.sin(f.ang), w = f.w / 2, Lx = f.len * u, g = r.tgt;
        const pts = [[0, -w], [Lx, -w], [Lx, w], [0, w]].map(([a0, b]) => r.w(f.x + ca * a0 - sa * b, f.y + sa * a0 + ca * b, 0));
        px.polyDither(g, pts, c, a, r.ix, r.iy);
        const out = [[0, -w], [f.len, -w], [f.len, w], [0, w]].map(([a0, b]) => r.w(f.x + ca * a0 - sa * b, f.y + sa * a0 + ca * b, 0));
        for (let i = 0; i < 4; i++) { const A0 = out[i], B = out[(i + 1) % 4]; px.line(g, A0[0], A0[1], B[0], B[1], c); }
      }
    }, { emissive: .3 + .4 * u });
  };
  return f;
};

/* ---- strike: lightning (or any element) from the sky at a point after a short warning ---- */
FX.strike = o => {
  const f = Object.assign({ team: 'hero', x: 0, y: 0, r: 14, delay: .45, el: 'storm' }, o);
  const warn = FX.telegraph({ shape: 'circle', x: f.x, y: f.y, r: f.r, dur: f.delay, color: f.team === 'hero' ? EL(f.el).color : '#ff4a3a', then() {

      r.queue(f.x, f.y, 0, g => { const [x0, y0] = r.w(f.x, f.y, 150), [x1, y1] = r.w(f.x, f.y, 0); px.glow(g, 1); zig(g, x0, y0, x1, y1, EL(f.el).color, 3, 7, f.x | 0); zig(g, x0, y0, x1, y1, '#ffffff', 1, 7, f.x | 0); }, { emissive: true, bias: .5 });
      L.add(f.x, f.y, 20, 90, 1.4 * (1 - b.t / .18), { color: EL(f.el).glow });

/* ---- meteor: a warned circle, a fireball falling out of the sky, an explosion (and optional burning ground) ---- */
FX.meteor = o => {
  const f = Object.assign({ team: 'hero', x: 0, y: 0, r: 24, delay: .8, el: 'fire', size: 1 }, o);
  const m = addFx({ kind: 'meteor', t: 0, update: dt => { m.t += dt; if (m.t >= f.delay) { land(); return false; } return true; }, draw: r => {
    const u = m.t / f.delay, z = 240 * (1 - u) * (1 - u) + 2, x = f.x - 60 * (1 - u), y = f.y - 30 * (1 - u);
    r.queue(x, y, z, g => { const [sx, sy] = r.w(x, y, z), [tx, ty] = r.w(x - 16, y - 8, z + 30), s = 3.5 * f.size * (r.view.zoom || 1); px.glow(g, 1); px.line(g, sx, sy, tx, ty, EL(f.el).color, Math.round(s)); r.glowDisc(g, sx, sy, s * 3, EL(f.el).glow, .6); px.disc(g, sx, sy, s * 1.3, EL(f.el).color); px.disc(g, sx - 1, sy - 1, s * .7, EL(f.el).light); }, { emissive: true });
    L.add(x, y, z, 60, .8, { color: EL(f.el).glow });
    if (Math.random() < .5) P.add({ kind: f.el === 'fire' ? 'fire' : 'ember', x, y, z, vz: 10, max: .3, size: 3, color: EL(f.el).color });
  } });

  function land() {
    hitCircle(f.team, f.x, f.y, f.r, u => mkHit(f, { ang: Math.atan2(u.y - f.y, u.x - f.x), kb: 160, up: 90, tags: ['aoe', 'spell'] }));
    if (f.el === 'fire') P.explosion(f.x, f.y, 4, 1.2 * f.size, { flash: false }); else { elBurst(f.x, f.y, 4, f.el, 20); sfx('explode'); }
    P.ring(f.x, f.y, 4, f.r + 10, EL(f.el).light, .4); shake(4);
    if (f.burn) FX.area({ team: f.team, src: f.src, x: f.x, y: f.y, r: f.r * .8, dur: f.burn, el: f.el, tick: .5, hit: { amount: (f.hit && f.hit.amount || 10) * .15, statusChance: .5 } });

  return m;

/* ---- chain: lightning that hops from a unit to the nearest others; visual arcs plus damage ---- */
FX.chain = o => {
  const f = Object.assign({ team: 'hero', from: null, x: 0, y: 0, z: 10, hops: 4, range: 80, el: 'storm', set: new Set() }, o);
  const pts = [[f.from ? f.from.x : f.x, f.from ? f.from.y : f.y, f.from ? (f.from.z || 0) + 12 : f.z]];
  let cur = f.first || nearestEnemy(f.team, pts[0][0], pts[0][1], f.range, f.set);
  for (let i = 0; i < f.hops && cur; i++) {
    f.set.add(cur); pts.push([cur.x, cur.y, (cur.z || 0) + (cur.head || 20) * .55]);
    dealDamage(cur, mkHit(f, { ang: Math.random() * TAU, tags: ['spell', 'chain'], amount: (f.hit && f.hit.amount || 10) * Math.pow(f.falloff || .9, i) }));
    elBurst(cur.x, cur.y, (cur.head || 20) * .5, f.el, 4);
    cur = nearestEnemy(f.team, cur.x, cur.y, f.range, f.set);

  const v = addFx({ kind: 'chain', t: 0, update: dt => (v.t += dt) < .28, draw: r => {
    const a = 1 - v.t / .28;

    for (const q of pts) L.add(q[0], q[1], q[2], 40, .8 * a, { color: EL(f.el).glow });
  } });

/* ---- beam: a sustained line from a point (or a unit) that sweeps; stops at walls; ticks damage ---- */
FX.beam = o => {
  const f = addFx(Object.assign({ kind: 'beam', team: 'foe', x: 0, y: 0, z: 14, ang: 0, turn: 0, len: 160, w: 6, dur: 1.5, tick: .15, t: 0, nt: 0, el: 'fire' }, o));
  const e = EL(f.el);
  f.update = dt => {
    f.t += dt; f.nt -= dt; f.ang += f.turn * dt;
    if (f.from) { if (!f.from.alive) return false; f.x = f.from.x; f.y = f.from.y; if (f.aimFrom) f.ang = f.from.facing; }
    // raycast to the first wall
    const map = ED.L && ED.L.map; let Lx = f.len;
    if (map) for (let s = 4; s < f.len; s += 4) if (map.heightAt(f.x + Math.cos(f.ang) * s, f.y + Math.sin(f.ang) * s) > f.z) { Lx = s; break; }
    f.reach = Lx;
    if (f.nt <= 0 && f.t > (f.warm || 0)) {
      f.nt = f.tick; const ca = Math.cos(f.ang), sa = Math.sin(f.ang);
      const targets = enemiesOf(f.team), test = u => { const dx = u.x - f.x, dy = u.y - f.y, along = dx * ca + dy * sa, side = Math.abs(-dx * sa + dy * ca); return along > 0 && along < Lx && side < f.w / 2 + u.r; };
      if (f.team === 'hero') { const mid = Lx / 2; eachEnemy('hero', f.x + ca * mid, f.y + sa * mid, mid + 10, u => { if (test(u)) dealDamage(u, mkHit(f, { ang: f.ang, kb: 10, tags: ['beam', 'spell'] })); }); }
      else for (const u of targets) if (test(u)) dealDamage(u, mkHit(f, { ang: f.ang, kb: 30 }));
    }
    return f.t < f.dur;
  };
  f.draw = r => {
    const warm = f.warm && f.t < f.warm, Lx = f.reach || f.len, ca = Math.cos(f.ang), sa = Math.sin(f.ang), zm = r.view.zoom || 1;
    if (warm) { r.decal(() => { const g = r.tgt, a0 = r.w(f.x, f.y, 0), b0 = r.w(f.x + ca * Lx, f.y + sa * Lx, 0); px.blend(g, .5, 'normal', () => px.line(g, a0[0], a0[1], b0[0], b0[1], '#ff4a3a', 1)); }); return; }
    r.queue(f.x + ca * Lx * .5, f.y + sa * Lx * .5, f.z, g => {
      const [x0, y0] = r.w(f.x, f.y, f.z), [x1, y1] = r.w(f.x + ca * Lx, f.y + sa * Lx, f.z), wob = Math.sin(game.time * 40) * .6;
      px.glow(g, 1); px.blend(g, .5, 'add', () => px.line(g, x0, y0, x1, y1, e.color, Math.round((f.w + 2 + wob) * zm)));
      px.line(g, x0, y0, x1, y1, e.color, Math.max(1, Math.round(f.w * .6 * zm))); px.line(g, x0, y0, x1, y1, e.light, Math.max(1, Math.round(f.w * .25 * zm)));
      r.glowDisc(g, x1, y1, 8 * zm, e.glow, .6);
    }, { emissive: true, bias: 1 });
    if (Math.random() < .5) elBurst(f.x + ca * Lx, f.y + sa * Lx, f.z * .5, f.el, 2);
    for (let s = 0; s < Lx; s += 40) L.add(f.x + ca * s, f.y + sa * s, f.z, 50, .5, { color: e.glow });
  };
  return f;
};

/* ---- wave: a front that travels along the ground (fissures, fire walls, ice spikes); hits each unit once ---- */
FX.wave = o => {
  const f = addFx(Object.assign({ kind: 'wave', team: 'hero', x: 0, y: 0, ang: 0, speed: 220, len: 120, w: 16, t: 0, set: new Set(), el: 'phys', marks: [] }, o));
  const e = EL(f.el);
  f.update = dt => {
    f.t += dt; const d = Math.min(f.len, f.t * f.speed), map = ED.L && ED.L.map;
    const hx = f.x + Math.cos(f.ang) * d, hy = f.y + Math.sin(f.ang) * d;
    if (map && map.solidAt(hx, hy)) f.len = Math.min(f.len, d);
    hitCircle(f.team, hx, hy, f.w / 2, u => mkHit(f, { ang: f.ang, up: f.up || 0, tags: ['aoe', 'wave'] }), f.set);
    if (!f.last || d - f.last > 7) { f.last = d; f.marks.push({ x: hx + (Math.random() - .5) * 6, y: hy + (Math.random() - .5) * 6, t: game.time }); elBurst(hx, hy, 2, f.el, 3); }
    return f.t * f.speed < f.len + 60 || game.time - (f.marks.length ? f.marks[f.marks.length - 1].t : 0) < .6;
  };
  f.draw = r => {
    for (const m of f.marks) {
      const age = game.time - m.t, a = clamp(1 - age / .7, 0, 1); if (a <= 0) continue;
      const h = (f.el === 'frost' ? 10 : f.el === 'fire' ? 9 : 6) * Math.sin(Math.min(1, age * 6) * Math.PI * .5) * a;
      r.queue(m.x, m.y, 0, g => {
        const [x, y] = r.w(m.x, m.y, 0), [tx, ty] = r.w(m.x, m.y, h), zm = r.view.zoom || 1;
        if (f.el === 'fire') { px.glow(g, 1); px.poly(g, [[x - 3 * zm, y], [tx, ty], [x + 3 * zm, y]], e.color); px.poly(g, [[x - 1.5 * zm, y], [tx, ty + 2], [x + 1.5 * zm, y]], e.light); }
        else if (f.el === 'frost') { px.poly(g, [[x - 2.5 * zm, y], [tx, ty], [x + 2.5 * zm, y]], '#bfefff'); px.line(g, x - 1, y, tx, ty, '#ffffff'); }
        else { px.poly(g, [[x - 3 * zm, y], [tx - 1, ty], [tx + 1, ty], [x + 3 * zm, y]], e.dark); px.line(g, x - 2, y, tx - 1, ty, e.color); }
      }, { emissive: f.el !== 'phys' });
    }
  };
  return f;
};

/* ---- pull: a vortex that drags enemies of the team toward a point ---- */
FX.pull = o => {
  const f = addFx(Object.assign({ kind: 'pull', team: 'hero', x: 0, y: 0, r: 60, force: 220, dur: 1.2, t: 0, el: 'void' }, o));
  f.update = dt => {
    f.t += dt;
    eachEnemy(f.team, f.x, f.y, f.r, u => { if (u.boss) return; const a = Math.atan2(f.y - u.y, f.x - u.x), d = Math.hypot(f.x - u.x, f.y - u.y); if (d > 4) { const k = f.force * dt * Math.min(1, d / 20) / (u.mass || 1); u.x += Math.cos(a) * k * .35; u.y += Math.sin(a) * k * .35; u.vx *= .9; u.vy *= .9; } });

/* ---- scorch: a fading mark on the floor (after explosions, slams, landings) ---- */
FX.scorch = (x, y, r0, color = '#1a1016', dur = 4) => {
  const f = addFx({ kind: 'scorch', t: 0, update: dt => (f.t += dt) < dur, draw: r => { const a = .55 * clamp((dur - f.t) / 1.5, 0, 1); r.decal(() => { r.groundDisc(x, y, r0, color, a); r.groundDisc(x + 2, y - 1, r0 * .6, color, a * .8); }); } });

/* ---- simple timed visual: FX.visual(dur, draw(r, u)) for one-off flourishes ---- */

function updateFx(dt) { const L0 = ED.fx; for (let i = L0.length - 1; i >= 0; i--) { let keep = false; try { keep = L0[i].update(dt); } catch (e) { game._fail('fx ' + L0[i].kind, e); } if (!keep) L0.splice(i, 1); } }

/* =============================================================================
 * STATS: every number the hero has, where it comes from, and how it reads in a tooltip
 * A stat source is a function (h, add) that calls add(key, value) for each contribution. Gear, the passive
 * tree, buffs and powers each register one with statSource(fn). computeStats(h) sums them over the base.
 * Keys ending in Pct / inc* / res* are percents. 'rank:<skillId>' adds levels to one skill.
 * ============================================================================= */
const STATS = {
  life: { name: 'Maximum Life', f: 'flat' }, lifePct: { name: 'Increased Maximum Life', f: 'pct' }, lifeRegen: { name: 'Life per Second', f: 'dec' },
  lifeOnHit: { name: 'Life on Hit', f: 'flat' }, lifeOnKill: { name: 'Life on Kill', f: 'flat' }, leech: { name: 'Damage Leeched as Life', f: 'pctd' },
  ember: { name: 'Maximum Ember', f: 'flat' }, emberRegen: { name: 'Ember per Second', f: 'dec' }, emberOnHit: { name: 'Ember on Hit', f: 'dec' },

/* =============================================================================

 * A SKILL is def('skills', id, {
 *   name, tags: ['melee', 'attack'] | ['spell', 'proj', ...], el, cost (ember), cd (s), gen (ember gained per hit),
 *   kind: 'basic' | 'core' | 'mobility' | 'ultimate' (grouping in the skills panel), unlock: hero level,
 *   runes: [{ id, name, desc }, { id, name, desc }]   (one may be chosen from rank 2: the skill's two upgrades),
 *   desc(rank, rune) -> 'text', icon(g, x, y, s, h) (a 16x16 pictogram, s = size),
 *   cast(h, ctx) -> an action (see 20-hero.js) or null (nothing happened),
 *   again(h, act, ctx) -> true if a press during its own action continues it (combos)

 * ctx: { id, S, slot, rank, rune, aim, tx, ty (the cursor on the ground), hit(scale, o) (a hero hit with this
 *        skill's element and tags), area (radius multiplier), proj (extra projectiles), pierce, chains }

/* =============================================================================
 * MECHANICS: the one new element each depth brings (and the mixes of them past the planned depths)
 * A MECHANIC is def('mechanics', id, {
 *   name: 'Powder Kegs', title: 'The Powder Vaults' (the level name when it is introduced),
 *   adj: 'Blasted', noun: 'Powder Vaults' (for composed names: 'The Blasted Brood Warrens'), color, icon(g, x, y, s),
 *   tip: 'one line shown on the level card: what it does and how to exploit it',
 *   place(L, R) (put its things in the level), start(L) (BUS.on(..., 'level') listeners), update(L, dt), draw(L, r),
 *   themes: ['crypt'] (themes it suits), weight
 * })
 * A THING is anything in L.things: { kind, x, y, r, solid, hittable, dead, onHit(hit), update(dt, L), draw(r) }.
 * The hero side strikes hittable things with every attack (see hitCircle / hitCone), so kegs, pylons and nests

 * ============================================================================= */
function addThing(L0, t) { t.dead = false; (L0 || ED.L).things.push(t); return t; }
function updateThings(L0, dt) { const T = L0.things; for (let i = T.length - 1; i >= 0; i--) { const t = T[i]; if (t.update) t.update(dt, L0); if (t.dead && !t.keep) T.splice(i, 1); } }

/** an explosion that hurts everyone: monsters fully, the hero for a share, and sets off other things */
function blast(x, y, rad, amount, o = {}) {
  const src = o.src || null, el = o.el || 'fire';
  hitCircle('hero', x, y, rad, u => ({ src, amount, el, kb: o.kb || 200, up: o.up === undefined ? 110 : o.up, ang: Math.atan2(u.y - y, u.x - x), statusChance: .6, tags: ['aoe', 'blast'] }));
  const h = ED.hero; if (h && h.alive && Math.hypot(h.x - x, h.y - y) < rad + h.r && o.hurtHero !== false) dealDamage(h, { src: null, amount: amount * (o.heroShare || .12) + 4 * (ED.depth || 1), el, kb: 180, ang: angTo({ x, y }, h) });
  if (el === 'fire') P.explosion(x, y, 6, rad / 30, { flash: rad > 40 }); else { elBurst(x, y, 6, el, 20); sfx('explode'); }
  P.ring(x, y, 4, rad + 6, EL(el).light, .4); FX.scorch(x, y, rad * .6);
}

/* ---------- POWDER KEGS (depth 1): the reference mechanic ---------- */
// Kegs sit in clusters along the rooms. Any hit lights the fuse; a moment later it blows, launching monsters and
// setting off kegs nearby. A speedrunner drags a whole pack into a cluster and takes one swing.
def('mechanics', 'powder', { name: 'Powder Kegs', title: 'The Powder Vaults', adj: 'Blasted', noun: 'Powder Vaults', color: '#ff9a3a', depth: 1, weight: 10,
  tip: 'Kegs explode when struck and set off their neighbours. Pull a pack into a cluster, then strike once.',
  icon: (g, x, y, s) => { px.ell(g, x + 8 * s, y + 9 * s, 5 * s, 6 * s, '#8a5a32'); px.rect(g, x + 3 * s, y + 6 * s, 10 * s, s, '#5a5a6a'); px.rect(g, x + 3 * s, y + 11 * s, 10 * s, s, '#5a5a6a'); px.line(g, x + 8 * s, y + 3 * s, x + 11 * s, y + s, '#e8d8a0'); px.dot(g, x + 11 * s, y + s, '#ffd36a'); },
  place(L0, R) {

      const [cx, cy] = L0.randomFloor(R, { minStart: 40, edge: 1 }); const k = R.int(2, 5);
      for (let j = 0; j < k; j++) { const a = R() * TAU, d = j ? 7 + R() * 9 : 0, x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d; if (L0.map.walkable(Math.floor(x / 16), Math.floor(y / 16))) addThing(L0, makeKeg(x, y)); }

});
function makeKeg(x, y) {
  const k = { kind: 'keg', x, y, r: 5, solid: true, hittable: true, fuse: -1, v: (Math.random() * 3) | 0, src: null,
    onHit(hit) { if (this.fuse < 0) { this.fuse = hit.tags && hit.tags.includes('blast') ? .12 + Math.random() * .12 : .35; this.src = hit.src && hit.src.team === 'hero' ? hit.src : ED.hero; sfx('charge', { vol: .25, pitch: 2.5 }); } },
    update(dt) {
      if (this.fuse < 0) return;

    },
    draw(r) {

      r.queue(this.x, this.y, 0, g => { const [x, y] = r.w(this.x, this.y, 16 * (E.style.propSize || 1) * (r.view.zoom || 1) / Math.max(.5, r.view.scale)); px.dot(g, x, y - 1, '#e8d8a0'); px.dot(g, x + 1, y - 2, lit ? '#ffffff' : '#e8d8a0'); if (lit) { px.glow(g, 1); px.dot(g, x + 1, y - 3, '#ffd36a'); } }, { emissive: lit, bias: .01 });

}
/** a damage amount that keeps level mechanics relevant as the hero grows: a share of the hero's weapon hit */
function heroHitAmount(scale) { const h = ED.hero; return h ? heroHit(h, scale, { el: 'fire' }).amount : 20 * scale; }

/* =============================================================================
 * LEVELS: recipes (what a depth is made of), layouts, themes, and building a level from a recipe
 * A LAYOUT is def('layouts', id, { name, gen(R, o) -> { w, h, cells, tags, rooms: [{ x, y, w, h, cx, cy }], start: [cx, cy], exit: [cx, cy] } })
 *   cells: 0 floor, 1 outer wall, 2 pillar, 3 low wall, 4+ theme extras. tags: per-cell floor tag or null ('pit', 'water', 'ice'...).
 * A THEME is def('themes', id, { name, nouns: ['Vaults'], pal, floor(L, x, y, tag) -> [r, g, b(, glow)], walls: { 1: {...}, 2, 3 },
 *   torch: 'brazier' | prop name, light: '#ff9a4a', ambient, decorate(L, R), ambience(L, dt), sky: [..] | null, music, pool: [archetype ids] })
 * A RECIPE is { depth, seed, name, theme, hue, layout, mechs: [ids], newMech, boss, pool, size }.
 * ============================================================================= */
const T16 = 16;
/* the planned descent: one new element per depth, a boss every fifth. Past the plan, recipes compose themselves */
const PLAN = [
  null,
  { mech: 'powder', theme: 'crypt', layout: 'halls' },
  { mech: 'wards', theme: 'crypt', layout: 'halls' },
  { mech: 'chasm', theme: 'ruins', layout: 'islands' },
  { mech: 'gale', theme: 'ruins', layout: 'halls' },
  { mech: 'magma', theme: 'forge', layout: 'arena', boss: 'cinderking' },
  { mech: 'ice', theme: 'frost', layout: 'caves' },
  { mech: 'brood', theme: 'fungal', layout: 'caves' },
  { mech: 'pylons', theme: 'mine', layout: 'halls' },
  { mech: 'timewell', theme: 'clockwork', layout: 'halls' },
  { mech: 'webs', theme: 'fungal', layout: 'arena', boss: 'broodmother' },
  { mech: 'dark', theme: 'abyss', layout: 'caves' },
  { mech: 'bloodrush', theme: 'ossuary', layout: 'halls' },
  { mech: 'launch', theme: 'sky', layout: 'islands' },
  { mech: 'flood', theme: 'aqueduct', layout: 'halls' },
  { mech: 'quake', theme: 'cavern', layout: 'arena', boss: 'wyrm' }

const PLANNED = PLAN.length - 1;
/** the recipe for a depth. visit changes the seed so a depth plays differently each time you go down it */
function recipe(depth, visit = 0) {
  const R = RNG('emberdeep:' + depth + ':' + visit);
  const has = (k, id) => id && REG[k][id];
  const p = PLAN[depth];
  const rec = { depth, seed: R.int(1, 2e9), R, hue: 0, size: [52, 52] };
  if (p) {
    rec.theme = has('themes', p.theme) ? p.theme : 'crypt';
    rec.layout = has('layouts', p.layout) ? p.layout : 'halls';
    rec.newMech = has('mechanics', p.mech) ? p.mech : null;
    rec.mechs = rec.newMech ? [rec.newMech] : [];
    rec.boss = p.boss && REG.bosses[p.boss] ? p.boss : null;
  } else {
    // composed depths: a known theme (recolored further the deeper you go), one mechanic new to this combination
    // plus one or two from before, and a composed boss every fifth depth
    const themes = Object.keys(REG.themes), mechs = Object.keys(REG.mechanics).filter(id => !REG.mechanics[id].bossOnly);
    rec.theme = R.pick(themes); rec.layout = R.pick(Object.keys(REG.layouts).filter(id => !REG.layouts[id].bossOnly));
    rec.hue = ((depth - PLANNED) * 37 + R.int(-20, 20)) % 360;
    const n = depth > 40 ? 3 : 2, pick = R.shuffle(mechs.slice()).slice(0, n);
    rec.mechs = pick; rec.newMech = pick[0];
    if (depth % 5 === 0) { rec.boss = composeBoss(depth, R); rec.layout = REG.layouts.arena ? 'arena' : rec.layout; }
  }
  rec.pool = levelPool(rec.theme, depth);

}
/** the monsters of a level: archetypes that live in its theme (arch.themes) or anywhere (no themes), deep enough.
 *  Past the planned depths every archetype may turn up anywhere */
function levelPool(theme, depth) {
  const all = Object.values(REG.archetypes).filter(a => !a.noPack && (a.minDepth || 1) <= depth + 1);
  let pool = all.filter(a => !a.themes || a.themes.includes(theme) || depth > PLANNED);
  const th = REG.themes[theme]; if (th && th.pool) pool = pool.concat(th.pool.map(id => REG.archetypes[id]).filter(a => a && !pool.includes(a)));
  const ids = pool.map(a => a.id);
  return ids.length ? ids : ['husk', 'skeleton', 'slime'];
}
function levelName(rec, R) {
  if (rec.boss && REG.bosses[rec.boss] && REG.bosses[rec.boss].levelName) return REG.bosses[rec.boss].levelName;
  const ms = rec.mechs.map(id => REG.mechanics[id]).filter(Boolean);
  if (!ms.length) return 'The ' + ((REG.themes[rec.theme] && R.pick(REG.themes[rec.theme].nouns || ['Deep'])) || 'Deep');
  if (rec.depth <= PLANNED && ms[0].title) return ms[0].title;
  if (ms.length === 1) return 'The ' + ms[0].adj + ' ' + ms[0].noun;
  if (ms.length === 2) return 'The ' + ms[1].adj + ' ' + ms[0].noun;
  return 'The ' + ms[2].adj + ', ' + ms[1].adj + ' ' + ms[0].noun;
}

/* ---------- the classic layout: rooms joined by wide corridors ---------- */
def('layouts', 'halls', { name: 'Halls', gen(R, o) {
  const w = o.w || 52, h = o.h || 52, cells = new Array(w * h).fill(1), tags = new Array(w * h).fill(null), rooms = [];
  const carve = (x, y, rw, rh) => { for (let j = y; j < y + rh; j++) for (let i = x; i < x + rw; i++) if (i > 0 && j > 0 && i < w - 1 && j < h - 1) cells[j * w + i] = 0; };
  for (let tries = 0; tries < 400 && rooms.length < (o.rooms || 11); tries++) {
    const rw = R.int(7, 13), rh = R.int(7, 12), x = R.int(2, w - rw - 2), y = R.int(2, h - rh - 2);
    if (rooms.some(r0 => x < r0.x + r0.w + 2 && x + rw + 2 > r0.x && y < r0.y + r0.h + 2 && y + rh + 2 > r0.y)) continue;
    rooms.push({ x, y, w: rw, h: rh, cx: x + rw / 2, cy: y + rh / 2 }); carve(x, y, rw, rh);
  }
  // corridors: each room to its nearest joined neighbour (a spanning tree), plus a couple of loops
  const joined = [rooms[0]], rest = rooms.slice(1), corr = (a, b) => {
    let x = Math.floor(a.cx), y = Math.floor(a.cy); const tx = Math.floor(b.cx), ty = Math.floor(b.cy), hor = R.chance(.5);
    const step = (dx, dy) => { carve(x - 1, y - 1, 3, 3); x += dx; y += dy; };
    if (hor) { while (x !== tx) step(Math.sign(tx - x), 0); while (y !== ty) step(0, Math.sign(ty - y)); }
    else { while (y !== ty) step(0, Math.sign(ty - y)); while (x !== tx) step(Math.sign(tx - x), 0); }
    carve(x - 1, y - 1, 3, 3);
  };
  while (rest.length) {
    let bi = 0, bj = 0, bd = 1e9;
    rest.forEach((r0, i) => joined.forEach((q, j) => { const d = Math.hypot(r0.cx - q.cx, r0.cy - q.cy); if (d < bd) { bd = d; bi = i; bj = j; } }));
    corr(rest[bi], joined[bj]); joined.push(rest.splice(bi, 1)[0]);
  }
  for (let k = 0; k < 2 && rooms.length > 4; k++) corr(R.pick(rooms), R.pick(rooms));
  // pillars in the big rooms, the odd low wall
  for (const r0 of rooms) {
    if (r0.w >= 11 && r0.h >= 10 && R.chance(.6)) for (const [dx, dy] of [[2, 2], [r0.w - 3, 2], [2, r0.h - 3], [r0.w - 3, r0.h - 3]]) cells[(r0.y + dy) * w + r0.x + dx] = 2;
    else if (R.chance(.35)) { const hz = R.chance(.5), lx = r0.x + R.int(2, r0.w - 5), ly = r0.y + R.int(2, r0.h - 4); for (let k = 0; k < 3; k++) cells[(ly + (hz ? 0 : k)) * w + lx + (hz ? k : 0)] = 3; }
  }
  const far = farthestRoom(cells, w, h, rooms, 0);
  return { w, h, cells, tags, rooms, start: [Math.floor(rooms[0].cx), Math.floor(rooms[0].cy)], exit: [Math.floor(far.cx), Math.floor(far.cy)], exitRoom: far };
} });
/** the room farthest (by walking) from room i: the exit goes there */
function farthestRoom(cells, w, h, rooms, i) {
  const d = new Int32Array(w * h).fill(-1), q = [], s = Math.floor(rooms[i].cy) * w + Math.floor(rooms[i].cx); d[s] = 0; q.push(s);
  for (let k = 0; k < q.length; k++) { const c = q[k], x = c % w, y = (c / w) | 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = (y + dy) * w + x + dx; if (x + dx < 0 || y + dy < 0 || x + dx >= w || y + dy >= h || d[n] >= 0 || cells[n] === 1 || cells[n] === 2) continue; d[n] = d[c] + 1; q.push(n); } }
  let best = rooms[rooms.length - 1], bd = -1;
  for (const r0 of rooms) { const v = d[Math.floor(r0.cy) * w + Math.floor(r0.cx)]; if (v > bd) { bd = v; best = r0; } }
  return best;
}

/* ---------- the stress test's rune hall as a theme: flagstones, teal runes, moss at the edges ---------- */
const CRYPT = { stones: ['#4b4559', '#554f64', '#433e51', '#5d566c'], mortar: '#221e2b', hi: '#6f6782', lo: '#322d3e', speck: '#2a2634', moss: ['#3f5a44', '#4d6b4b'], rune: '#2f7f82', runeHi: '#6fd6cc' };
def('themes', 'crypt', { name: 'Crypt', nouns: ['Vaults', 'Crypts', 'Halls', 'Catacombs'], pal: CRYPT, torch: 'brazier', light: '#ff9a4a', ambient: .12, music: 'deep',
  walls: { 1: { h: 38, cut: true, cutH: 6, top: '#57506a', side: '#3d3750', line: '#2a2538', course: 8 }, 2: { h: 36, top: '#6a6280', side: '#4a4360', line: '#302a40', course: 10 }, 3: { h: 12, top: '#5d566f', side: '#433d55', line: '#2e2940', course: 6 } },
  floor: (L0, x, y, tag) => cryptFloor(L0, x, y, tag, L0.pal),
  decorate(L0, R) { for (const r0 of L0.rooms) { if (R.chance(.5)) L0.props.push({ name: R.pick(['bones', 'skull', 'crate', 'pot', 'barrel']), x: (r0.x + 1 + R() * (r0.w - 2)) * T16, y: (r0.y + 1 + R() * (r0.h - 2)) * T16 }); if (R.chance(.35)) L0.props.push({ name: 'cobweb', x: (r0.x + .5) * T16, y: (r0.y + .5) * T16, o: { size: 1.2 } }); } }
});
/** flagstones with rune circles around every rune point (L.runes), moss creeping in from the walls */
function cryptFloor(L0, x, y, tag, pal) {
  const P0 = L0._pal || (L0._pal = { stones: pal.stones.map(E.hex), mortar: E.hex(pal.mortar), hi: E.hex(pal.hi), lo: E.hex(pal.lo), speck: E.hex(pal.speck), moss: pal.moss.map(E.hex), rune: [...E.hex(pal.rune), .45], runeHi: [...E.hex(pal.runeHi), 1] });
  if (tag === 'pit') return null;
  for (const rc of L0.runes || []) {
    const dx = x - rc.x, dy = y - rc.y, d = Math.hypot(dx, dy), R0 = rc.r;
    if (d > R0 + 2) continue;
    if (Math.abs(d - R0) < .8 || Math.abs(d - R0 * .8) < .6) return P0.rune;
    if (d > R0 * .8 && d < R0) { const a = (Math.atan2(dy, dx) / TAU + 1) * 16; if (a % 1 < .05) return P0.rune; if (Math.abs(d - R0 * .9) < 2 && E.hash2(Math.floor(a), Math.floor(d * .5)) > .35 && ((Math.floor(x) + Math.floor(y)) & 1)) return P0.runeHi; }
    if (d < R0 * .13) return d < R0 * .055 ? P0.runeHi : E.tex.flagstone(x, y, P0);
  }
  let c = E.tex.flagstone(x, y, P0);
  const cx = Math.floor(x / T16), cy = Math.floor(y / T16), m = L0.map;
  let wall = 0; if (m) for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (m.cell(cx + ox, cy + oy) === 1) wall = 1;
  if (wall && E.noise2(x * .13, y * .13) > .55) c = P0.moss[E.hash2(x | 0, y | 0) < .5 ? 0 : 1];
  return c;
}

/* ---------- building a level from a recipe ---------- */
function buildLevel(rec) {
  const R = RNG(rec.seed), th = REG.themes[rec.theme] || REG.themes.crypt, lay = REG.layouts[rec.layout] || REG.layouts.halls;
  const G0 = lay.gen(R, { w: rec.size[0], h: rec.size[1], depth: rec.depth });
  const L0 = { kind: 'level', rec, depth: rec.depth, name: rec.name, theme: th, hue: rec.hue || 0, w: G0.w, h: G0.h, cells: G0.cells, tags: G0.tags, rooms: G0.rooms,
    things: [], props: [], torches: [], runes: [], mechs: rec.mechs.slice(), seen: new Uint8Array(G0.w * G0.h), t: 0 };
  L0.pal = shiftPal(th.pal || CRYPT, L0.hue);
  // walls: the theme's types, recolored for deep levels; the exit gets a rune circle
  const types = {}; for (const k in th.walls) types[k] = shiftPal(th.walls[k], L0.hue);
  const [sx, sy] = G0.start, [ex, ey] = G0.exit;
  L0.start = { x: (sx + .5) * T16, y: (sy + .5) * T16 }; L0.exit = { x: (ex + .5) * T16, y: (ey + .5) * T16, open: !rec.boss };
  L0.runes.push({ x: L0.start.x, y: L0.start.y, r: 30 }, { x: L0.exit.x, y: L0.exit.y, r: 26 });
  const floorTag = G0.tags.slice();
  L0.map = new E.TileMap({ w: G0.w, h: G0.h, tile: T16, cells: G0.cells, types, floorTex: (x, y, tag) => th.floor(L0, x, y, tag) });
  L0.map.floorTags = floorTag; L0.map.blocked = new Uint8Array(G0.w * G0.h);
  floorTag.forEach((t, i) => { if (t === 'pit' || t === 'deep') L0.map.blocked[i] = 1; });
  deepCutaway(L0.map);
  L0.flow = new E.FlowField(L0.map);
  L0.randomFloor = (Rr, o = {}) => randomFloor(L0, Rr, o);
  // light sources along the rooms (braziers stand in the room, sconces on walls)
  for (const r0 of G0.rooms) {
    const n = Math.max(1, Math.round((r0.w * r0.h) / 60 * (th.lights || 1)));
    for (let i = 0; i < n; i++) { const x = (r0.x + 1.5 + R() * (r0.w - 3)) * T16, y = (r0.y + 1.5 + R() * (r0.h - 3)) * T16; if (L0.map.walkable(Math.floor(x / T16), Math.floor(y / T16)) && Math.hypot(x - L0.start.x, y - L0.start.y) > 40) L0.torches.push({ x, y, t: R() * 9, kind: th.torch || 'brazier', color: th.light || '#ff9a4a', r: 4.5, solid: true }); }
  }

/* =============================================================================
 * UI: the HUD, a small immediate-mode widget kit, panels (pause, settings, death, waystone, bag) and tooltips
 * Everything is pixel art drawn in r.overlay (screen pixels). Widgets register hot rectangles while they draw;
 * the next update resolves clicks against them. A PANEL is UI.def(id, { title, modal, w, h, open(data), close(),

  def(id, spec) { spec.id = id; this.panels[id] = spec; return spec; },

function loadHeroOrNew() { const s = loadSave(); if (s) { const h = makeHero(s); refreshPowers(h); computeStats(h); h.hp = h.maxHp; dressHero(h); return h; } return newHero(); }
function startGame(fresh) { if (fresh) { E.store.remove('ed:save'); ED.hero = newHero(); ED.hero.visits = {}; saveGame(); } else ED.hero = loadHeroOrNew(); ED.savedLevel = null; goTown({ arrive: fresh ? 'intro' : 'waystone' }); }
const titleScene = {
  enter() {
    ED.mode = 'title'; UI.closeAll(); TITLE.t = 0; TITLE.confirmNew = false;
    // the rune hall of the stress test, torch-lit, the hero waiting in its circle
    const rec = { depth: 1, seed: 5, name: 'The Rune Hall', theme: 'crypt', hue: 0, layout: 'halls', mechs: [], pool: [], size: [30, 24] };
    const w = 30, hh = 24, cells = new Array(w * hh).fill(0); for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) if (!x || !y || x === w - 1 || y === hh - 1) cells[y * w + x] = 1;
    for (const [px0, py0] of [[6, 5], [22, 5], [6, 17], [22, 17]]) for (let k = 0; k < 4; k++) cells[(py0 + (k >> 1)) * w + px0 + (k & 1)] = 2;
    const L0 = { kind: 'title', rec, depth: 0, name: rec.name, theme: REG.themes.crypt, hue: 0, w, h: hh, cells, tags: new Array(w * hh).fill(null), rooms: [{ x: 1, y: 1, w: w - 2, h: hh - 2, cx: w / 2, cy: hh / 2 }], things: [], props: [], torches: [], runes: [{ x: w * 8, y: hh * 8, r: 54 }], mechs: [], seen: new Uint8Array(w * hh), npcs: [] };
    L0.pal = CRYPT; L0.map = new E.TileMap({ w, h: hh, tile: T16, cells, types: REG.themes.crypt.walls, floorTex: (x, y, tag) => cryptFloor(L0, x, y, tag, CRYPT) }); L0.flow = new E.FlowField(L0.map);
    for (const [x, y] of [[10, 8], [20, 8], [10, 16], [20, 16]]) L0.torches.push({ x: x * T16, y: y * T16, t: Math.random() * 9, kind: 'brazier', color: '#ff9a4a', r: 4.5, solid: true });
    L0.start = { x: w * 8, y: hh * 8 + 20 };
    enterWorld(L0); L.ambient = .1;
    const h = ED.hero || loadHeroOrNew(); ED.titleHero = h; h.x = L0.start.x; h.y = L0.start.y; h.facing = Math.PI / 2 * .9; h.aim = h.facing; h.act = null; h.z = 0;
    game.cam.snap = true; game.setZoom(1.5); playSong('title');
  },
  update(dt) {
    TITLE.t += dt;
    if (updateUI(dt)) return;
    const h = ED.titleHero, items = titleItems();
    h.rig.update(dt, { x: h.x, y: h.y, z: 0, facing: E.lerpAng(h.facing, Math.PI / 2 + Math.sin(TITLE.t * .4) * .5, .02), pose: TITLE.t % 9 > 7.2 ? 'cheer' : null });
    h.facing = h.rig.facing;
    for (const b of ED.L.torches) b.t += dt;
    const inp = game.input;
    if (inp.repeat('up')) { TITLE.menu = (TITLE.menu + items.length - 1) % items.length; sfx('select'); UI.keyNav = true; }
    if (inp.repeat('down')) { TITLE.menu = (TITLE.menu + 1) % items.length; sfx('select'); UI.keyNav = true; }
    if (inp.pressed('confirm') || inp.pressed('start')) { inp.consumeAll(); sfx('confirm'); items[clamp(TITLE.menu, 0, items.length - 1)][1](); }
    if (Math.random() < dt * 8) { const b = rnd.pick(ED.L.torches); P.add({ kind: 'ember', x: b.x + (Math.random() - .5) * 6, y: b.y + (Math.random() - .5) * 6, z: 14, vx: (Math.random() - .5) * 14, vy: (Math.random() - .5) * 14, vz: 20 + Math.random() * 40, max: 1.2, color: '#ff8a3a' }); }
    game.focus(h.x, h.y - 10, 20);
  },
  draw(r) {
    const L0 = ED.L, h = ED.titleHero;
    L0.map.drawFloor(r); L0.map.queueWalls(r); drawTorches(L0, r);
    r.shadow(h.x, h.y, 5.5, .55);
    r.actor(h.x, h.y, 0, (g, ox, oy) => h.rig.draw(g, ox, oy, r.view), {});
    h.rig.drawSmear(r, h.smear);
    L.add(L0.w * 8, L0.h * 8, 3, 78, .55 + .12 * Math.sin(game.time * 1.7), { color: '#4fe0cc', shadow: true });
    r.overlay(g => {
      const W = r.W, H = r.H, cx = W / 2, a = clamp(TITLE.t / 1.2, 0, 1);
      px.blend(g, .55 * a, 'normal', () => { for (let y = 0; y < 64; y++) px.rect(g, 0, y, W, 1, '#05040a'); });
      E.font.title(g, 'EMBERDEEP', cx, 14, { scale: 4, colors: ['#fff6c8', '#ffd36a', '#ff8a3a', '#b83a1a'], depth: 3, align: 'center' });
      E.font.text(g, 'a my-3D2dge game  •  the deep goes on forever', cx, 50, '#c8c0d8', { align: 'center', shadow: '#05040a', outline: false });
      const items = titleItems(), bw = 118, by = Math.round(H * .56);
      items.forEach(([label, fn], i) => button(g, cx - bw / 2, by + i * 19, bw, 15, label, () => { TITLE.menu = i; fn(); }, { focus: TITLE.menu === i }));
      const h2 = ED.titleHero; if (E.store.get('ed:save', null)) E.font.text(g, 'Level ' + h2.level + ' • deepest ' + h2.maxDepth, cx, by - 11, '#9a90b0', { align: 'center', font: 'tiny', outline: false });
      E.font.text(g, 'WASD MOVE  MOUSE AIMS  LMB RMB 1-4 SKILLS  SPACE DODGE  Q POTION', cx, H - 17, '#8a80a8', { align: 'center', font: 'tiny', outline: false });
      E.font.text(g, 'E USE  T PORTAL  I BAG  K SKILLS  P PASSIVES  V VIEW  ESC MENU', cx, H - 10, '#8a80a8', { align: 'center', font: 'tiny', outline: false });
    });
    drawPanels(r);
  }
};

/* ---------- TOWN ---------- */
const talk = new E.Dialog(game, { bg: ['#2a2040', '#141024'], border: '#c8b8e8' });
const townScene = {
  enter(o = {}) {
    ED.mode = 'town'; ED.depth = 0; UI.closeAll(); BUS.clear('level');
    const L0 = (TOWN.build || TOWN.fallback)();
    L0.mechs = []; enterWorld(L0);
    const h = ED.hero; reviveIfDead(h);
    const at = o.arrive === 'portal' && L0.portalSpot ? L0.portalSpot : L0.start;
    h.x = at.x; h.y = at.y; h.vx = h.vy = 0; h.act = null; h.potions = h.maxPotions; h.hp = h.maxHp;
    if (ED.savedLevel) L0.portal = Object.assign({}, L0.portalSpot || { x: L0.waystone.x + 30, y: L0.waystone.y + 10 }, { t: 0 });
    if (o.arrive === 'intro' || o.arrive === 'waystone') dropIn(h, o.arrive === 'intro' ? 180 : 90);
    game.cam.snap = true; playSong(L0.music || 'town'); saveGame();
    if (o.arrive === 'intro') { showCard('Emberhold', 'THE LAST LIT TOWN', null, 4); game.after(4.5, () => notify('THE WAYSTONE IN THE SQUARE LEADS DOWN.  (E TO USE)', '#bff6ff', 5)); }
  },
  update(dt) {
    if (talk.update(dt)) { if (UI.modal) updateUI(dt); townLife(dt); return; }
    const waiting = updateUI(dt);
    const L0 = ED.L, h = ED.hero, inp = game.input;
    if (waiting) { townLife(dt); return; }
    worldStep(dt, { town: true, canAct: true });
    for (const n of L0.npcs) updateNPC(n, dt);
    // who is close enough to talk to, the waystone, the portal back
    const near = L0.npcs.filter(n => Math.hypot(n.x - h.x, n.y - h.y) < (n.S.talkR || 26)).sort((a, b) => dist2(a, h) - dist2(b, h))[0];
    const onStone = L0.waystone && Math.hypot(L0.waystone.x - h.x, L0.waystone.y - h.y) < 16;
    if (near) { UI.prompt = '[E] Talk to ' + near.S.name; if (inp.pressed('interact')) talkTo(near); }
    else if (onStone) { UI.prompt = '[E] Use the waystone'; if (inp.pressed('interact')) UI.open('waystone'); }
    if (L0.portal && ED.savedLevel && Math.hypot(L0.portal.x - h.x, L0.portal.y - h.y) < 10) returnThroughPortal();
  },
  draw(r) { worldDraw(r); talk.draw(r); }
};
function townLife(dt) { const L0 = ED.L; for (const n of L0.npcs) updateNPC(n, dt); for (const b of L0.torches) b.t += dt; if (L0.theme && L0.theme.ambience) L0.theme.ambience(L0, dt); ED.hero.rig.update(dt, { x: ED.hero.x, y: ED.hero.y, facing: ED.hero.facing, pose: UI.modal ? null : 'hips' }); }
function reviveIfDead(h) { if (h.dead || !h.alive) reviveHero(h); }
function talkTo(n) {
  const S = n.S; n.talking = true;
  const lines = Array.isArray(S.lines) ? [S.lines[(n.talks = (n.talks || 0) + 1) % S.lines.length]] : typeof S.lines === 'function' ? S.lines(n, ED.hero) : ['...'];
  talk.say(lines, { name: S.name, portrait: n.rig, onDone() { n.talking = false; if (S.service && UI.panels[S.service]) UI.open(S.service, { npc: n }); } });
}
function returnThroughPortal() { const S = ED.savedLevel; if (!S) return; sfx('portal'); game.go('level', { resume: S }); }

/* ---------- A DEPTH ---------- */
const levelScene = {
  enter(o = {}) {
    ED.mode = 'level'; UI.closeAll(); BUS.clear('level');
    const h = ED.hero; reviveIfDead(h);
    if (o.resume) {   // back through the portal: the level exactly as it was
      const S = o.resume; ED.savedLevel = null;
      enterWorld(S.L); ED.depth = S.L.depth; ED.foes.push(...S.foes); ED.drops.push(...S.drops); ED.boss = S.boss;
      h.x = S.L.portal.x; h.y = S.L.portal.y + 8; S.L.portal = null;
      for (const id of S.L.mechs) { const M = REG.mechanics[id]; if (M && M.start) M.start(S.L); }
      playSong(S.L.theme.music || 'deep'); game.cam.snap = true; return;
    }
    const depth = o.depth || 1; ED.depth = depth; ED.stats.kills = 0;
    h.visits = h.visits || {}; const visit = h.visits[depth] = (h.visits[depth] || 0) + 1;
    const rec = recipe(depth, visit), L0 = buildLevel(rec);
    enterWorld(L0); populate(L0);
    for (const id of L0.mechs) { const M = REG.mechanics[id]; if (M && M.start) M.start(L0); }
    h.x = L0.start.x; h.y = L0.start.y; h.vx = h.vy = 0; h.act = null; h.facing = h.aim = Math.PI / 4;
    dropIn(h);
    const M = rec.newMech && REG.mechanics[rec.newMech];
    const first = M && !(h.seenMech || []).includes(M.id + (depth > PLANNED ? ':' + rec.mechs.join('+') : ''));
    showCard(rec.name, 'DEPTH ' + depth, M ? Object.assign({}, M, { name: depth > PLANNED ? rec.mechs.map(id => REG.mechanics[id] && REG.mechanics[id].name).filter(Boolean).join(' + ') : M.name }) : null, first ? 6 : 4);
    if (M) { h.seenMech = h.seenMech || []; h.seenMech.push(M.id + (depth > PLANNED ? ':' + rec.mechs.join('+') : '')); }
    if (depth > h.maxDepth) h.maxDepth = depth;
    playSong(L0.theme.music || 'deep'); game.cam.snap = true; saveGame();
    BUS.emit('levelStart', { L: L0 });
  },
  exit() { BUS.emit('levelEnd', { L: ED.L }); game.timeScale = 1; },
  update(dt) {
    if (talk.update(dt)) return;
    if (updateUI(dt)) return;
    const L0 = ED.L, h = ED.hero, inp = game.input;
    worldStep(dt);
    if (h.dead) { if (h.deadT > 2.2 && !UI.isOpen('death')) UI.open('death'); return; }
    if (inp.pressed('portal')) openTownPortal(h);
    // wake the boss when the hero reaches its arena; open the exit when it falls
    const B = ED.boss;
    if (B && B.dormant && Math.hypot(B.x - h.x, B.y - h.y) < 130) { B.dormant = false; B.ai.aware = true; B.introT = 2.2; sfx('roar'); shake(4); }
    if (L0.exit && !L0.exit.open && (!B || !B.alive)) { L0.exit.open = true; notify('THE WAYSTONE WAKES', '#6fd6cc', 3); sfx('chime'); }
    // the exit: stand on it for a moment and it takes you down
    if (L0.exit && L0.exit.open && Math.hypot(L0.exit.x - h.x, L0.exit.y - h.y) < 12 && h.alive) {
      L0.exitT = (L0.exitT || 0) + dt; UI.prompt = 'DESCENDING...';
      if (L0.exitT > .7 && !L0.leaving) { L0.leaving = true; sfx('portal'); startAction(h, { name: 'ascend', cancel: false, moveK: 0, rig: { pose: 'cheer' }, update(dt2) { this.t += dt2; P.glints(h.x, h.y, 10 + this.t * 30, 1, '#bff6ff', 14); return this.t < .8; } }); game.after(.7, () => descend(ED.depth + 1)); }
    } else if (L0.exit) L0.exitT = 0;
    // the town portal: walk in to go home (the level is kept until you come back or go down elsewhere)
    if (L0.portal && L0.portal.t > .6 && Math.hypot(L0.portal.x - h.x, L0.portal.y - h.y) < 9) {
      ED.savedLevel = { L: L0, foes: ED.foes.slice(), drops: ED.drops.slice(), boss: ED.boss };
      sfx('portal'); goTown({ arrive: 'portal' });
    }
  },
  draw(r) { worldDraw(r); talk.draw(r); }
};

/* ---------- THE PROVING GROUNDS: the stress test lives on as an endless horde in the rune hall ---------- */
const PROVE = { wave: 0, next: 0 };
const provingScene = {
  enter() {
    ED.mode = 'proving'; ED.depth = Math.max(1, Math.min(ED.hero.maxDepth, 20)); UI.closeAll(); BUS.clear('level');
    const rec = { depth: ED.depth, seed: 77, name: 'The Proving Grounds', theme: 'crypt', hue: 0, layout: 'halls', mechs: ['powder'], pool: ['husk', 'skeleton', 'knight', 'slime', 'wisp'], size: [64, 44] };
    // the stress test's hall: a grid of pillars, low walls, torches, the rune circle in the middle
    const w = 64, hh = 44, cells = new Array(w * hh).fill(0), R = RNG(5);
    for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) if (!x || !y || x === w - 1 || y === hh - 1) cells[y * w + x] = 1;
    for (let py = 7; py < hh - 4; py += 10) for (let pxx = 7; pxx < w - 4; pxx += 10) { if (Math.abs(pxx + 1 - w / 2) < 6 && Math.abs(py + 1 - hh / 2) < 5) continue; for (let k = 0; k < 4; k++) cells[(py + (k >> 1)) * w + pxx + (k & 1)] = 2; }
    for (let i = 0; i < 16; i++) { const x = 3 + Math.floor(R() * (w - 8)), y = 3 + Math.floor(R() * (hh - 8)), hz = R() < .5; if (Math.abs(x - w / 2) < 7 && Math.abs(y - hh / 2) < 6) continue; for (let k = 0; k < 3; k++) { const cx = x + (hz ? k : 0), cy = y + (hz ? 0 : k); if (cells[cy * w + cx] === 0) cells[cy * w + cx] = 3; } }
    const L0 = { kind: 'proving', rec, depth: ED.depth, name: rec.name, theme: REG.themes.crypt, hue: 0, w, h: hh, cells, tags: new Array(w * hh).fill(null), rooms: [{ x: 2, y: 2, w: w - 4, h: hh - 4, cx: w / 2, cy: hh / 2 }], things: [], props: [], torches: [], runes: [{ x: w * 8, y: hh * 8, r: 54 }], mechs: [], seen: new Uint8Array(w * hh).fill(1), t: 0 };
    L0.pal = CRYPT; L0.map = new E.TileMap({ w, h: hh, tile: T16, cells, types: REG.themes.crypt.walls, floorTex: (x, y, tag) => cryptFloor(L0, x, y, tag, CRYPT) }); L0.flow = new E.FlowField(L0.map);
    L0.randomFloor = (Rr, o) => randomFloor(L0, Rr, o);
    for (let ty = 4; ty < hh - 3; ty += 6) for (let tx = 4; tx < w - 3; tx += 7) { if (Math.hypot(tx - w / 2, ty - hh / 2) < 5 || R() < .5 || cells[ty * w + tx]) continue; L0.torches.push({ x: (tx + .5) * T16, y: (ty + .5) * T16, t: R() * 9, kind: 'brazier', color: '#ff9a4a', r: 4.5, solid: true }); }
    L0.start = { x: w * 8, y: hh * 8 + 40 };
    enterWorld(L0);
    const h = ED.hero; reviveIfDead(h); h.x = L0.start.x; h.y = L0.start.y; h.act = null; dropIn(h, 100);
    PROVE.wave = 0; PROVE.next = 2; playSong('deep2');
    showCard('The Proving Grounds', 'ENDLESS WAVES', { name: 'The stress test', tip: 'Waves grow without end. Esc opens the menu; the difficulty sliders shape the horde.', color: '#ff9a3a' }, 5);
  },
  update(dt) {
    if (updateUI(dt)) return;
    const h = ED.hero;
    worldStep(dt);
    if (h.dead) { if (h.deadT > 2.2 && !UI.isOpen('death')) UI.open('death'); return; }
    if (!ED.foes.length && (PROVE.next -= dt) <= 0) {
      PROVE.wave++; PROVE.next = 2.5; const n = Math.round((12 + PROVE.wave * 10) * DIFF.density);
      notify('WAVE ' + PROVE.wave + ' • ' + n + ' MONSTERS', '#ff9a3a', 2.5);
      const R = RNG(PROVE.wave * 31);
      for (let i = 0; i < Math.ceil(n / 8); i++) { const [x, y] = randomFloor(ED.L, R, {}); if (Math.hypot(x - h.x, y - h.y) < 80) continue; const pk = spawnPack(x, y, { pool: ED.L.rec.pool, n: 8, elite: i === 0 && PROVE.wave % 3 === 0 ? 2 : i % 4 === 1 ? 1 : 0, rng: R }); for (const m of pk) m.ai.aware = true; }
    }
    if (game.input.pressed('portal')) goTown();
  },
  draw(r) { worldDraw(r); r.overlay(g => E.font.text(g, 'WAVE ' + PROVE.wave + ' • ' + ED.foes.length + ' LEFT', r.W / 2, 4, '#ff9a3a', { align: 'center', shadow: '#05040a', outline: false })); }
};

/* ---------- global keys: camera, view, mute, hide HUD ---------- */
const ZOOMS = [.75, 1, 1.25, 1.5, 2, 2.5];
function zoomStep(d) { const i = ZOOMS.findIndex(z => z >= game.zoom - 1e-6), z = ZOOMS[clamp((i < 0 ? 2 : i) + d, 0, ZOOMS.length - 1)]; game.setZoom(z); OPT.zoom = z; saveOpts(); game.note('ZOOM ' + z + 'x'); }
addEventListener('keydown', e => {
  if (e.repeat || ED.mode === 'title' && UI.stack.length) return;
  if (e.code === 'KeyV') { const V = ['iso', 'threequarter', 'topdown', 'brawler']; game.setView(V[(V.indexOf(game.baseView.id) + 1) % V.length]); game.note(game.view.label.toUpperCase() + ' VIEW'); }
  else if (e.code === 'Minus' || e.code === 'NumpadSubtract') zoomStep(-1);
  else if (e.code === 'Equal' || e.code === 'NumpadAdd') zoomStep(1);
  else if (e.code === 'BracketLeft' || e.code === 'BracketRight') { game.rotateView(e.code === 'BracketLeft' ? -45 : 45); game.note('TURN ' + game.yaw); }
  else if (e.code === 'Digit0') { game.resetCamera(); game.setZoom(OPT.zoom); game.note('CAMERA RESET'); }
  else if (e.code === 'KeyM') A.mute();
  else if (e.code === 'KeyH') UI.hideHud = !UI.hideHud;
});
let wheelT = 0;
canvas.addEventListener('wheel', e => { const P0 = UI.top(); if (P0 && P0.wheel) return; const t = performance.now(); if (t - wheelT > 120) { wheelT = t; zoomStep(e.deltaY < 0 ? 1 : -1); } }, { passive: true });
BUS.on('heroDie', () => {});

/* ---------- START: powers listen, the title (or a deep link: #town, #depth-7, #proving) ---------- */
installPowers();
const scenes = { title: titleScene, town: townScene, level: levelScene, proving: provingScene };
game.views = ['iso', 'threequarter', 'topdown', 'brawler'];
const link = (location.hash || '').slice(1), dm = /^depth-(\d+)$/.exec(link);
if (link === 'town' || dm || link === 'proving') { ED.hero = loadHeroOrNew(); }
game.start({ scenes, scene: link === 'town' ? 'town' : dm ? 'level' : link === 'proving' ? 'proving' : 'title', data: dm ? { depth: +dm[1] } : link === 'town' ? { arrive: 'waystone' } : undefined });
/* a handle for tools, tests and the curious: window.__ed */
window.__ed = { game, ED, REG, UI, DIFF, OPT, BUS, FX, spawnMonster, spawnPack, spawnBoss, makeItem, equip, recipe, buildLevel, descend, goTown, saveGame, newHero, computeStats, gainXp, dealDamage, heroHit, RNG };
})();
