<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emberwell (isometric) · CO55 engine</title>
<!--
  Built with the CO55 2D engine: https://github.com/michaelcrosato/2D-co55-engine
  This file is standalone: engine + game are inlined below. To hand it to another AI,
  point it at the "READ THIS FIRST" block at the top of the engine script.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0e6d6; --panel:rgba(250,242,228,.92); --ink:#2a2140; --muted:#63557a; --accent:#b8612a; --accent-ink:#fff6e6;
  --line:rgba(42,33,64,.2); --key:rgba(42,33,64,.1); --hp:#c8452f; --hp-bg:rgba(42,33,64,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#06050b; --panel:rgba(18,14,30,.82); --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.16); --key:rgba(241,228,200,.12); --hp:#e0463c; --hp-bg:rgba(241,228,200,.12); }
}
:root[data-theme="dark"]{ --bg:#06050b; --panel:rgba(18,14,30,.82); --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.16); --key:rgba(241,228,200,.12); --hp:#e0463c; --hp-bg:rgba(241,228,200,.12); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair}
.hud{position:absolute;z-index:2;pointer-events:none}
.hud > *{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.top{top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.brand{padding:9px 13px 10px;max-width:min(400px,100%)}
.brand h1{margin:0;font-size:21px;font-weight:600;line-height:1.1}
.brand p{margin:5px 0 0;font-size:13.5px;line-height:1.4;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;gap:3px;padding:3px;align-items:center}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;border-radius:4px;padding:6px 10px;min-height:34px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
button:hover{background:var(--key)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:inherit;font-size:11px;line-height:1;padding:3px 5px;border-radius:3px;background:var(--key);min-width:18px;text-align:center}
button[aria-pressed="true"] kbd{background:rgba(0,0,0,.16)}
.fps{font-size:12px;color:var(--muted);padding:0 6px;min-width:50px;text-align:right}
.bottom{left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.vitals{padding:9px 12px;min-width:220px}
.hpbar{height:10px;border-radius:2px;background:var(--hp-bg);overflow:hidden;margin:6px 0 5px}
#hpFill{height:100%;width:100%;background:var(--hp);transition:width .12s}
.row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.row b{color:var(--ink);font-weight:600}
.keys{margin:0;padding:7px 11px;font-size:13px;line-height:1.45;color:var(--muted);max-width:52ch}
.keys b{color:var(--ink);font-weight:600}
#banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);z-index:2;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;color:#f6e7c6;text-shadow:0 2px 0 #1a0f1c,0 0 18px rgba(0,0,0,.6)}
#banner.show{opacity:1}
#bannerTitle{font-size:clamp(28px,5vw,46px);font-weight:600;line-height:1}
#bannerSub{font-size:16px;margin-top:6px;color:#d9c7a6}
.touch{display:none;right:14px;bottom:86px;gap:10px;align-items:flex-end}
.touch button{width:62px;height:62px;justify-content:center;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
.touch button.on{background:var(--accent);color:var(--accent-ink)}
@media (pointer:coarse){ .touch{display:flex} .keys{display:none} kbd{display:none} }
@media (max-width:720px),(max-height:520px){ .brand p{display:none} .brand h1{font-size:17px} .top{top:8px;left:8px;right:8px} }
@media (prefers-reduced-motion: reduce){ #banner,#hpFill{transition:none} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" role="img" aria-label="Emberwell, an action game in a torch-lit hall"></canvas>
  <div class="hud top">
    <div class="brand panel">
      <h1>Emberwell</h1>
      <p id="note"></p>
    </div>
    <div class="controls">
      <div class="seg panel" role="group" aria-label="Camera view">
        <button type="button" data-view="iso" aria-pressed="false"><kbd>1</kbd>Isometric</button>
        <button type="button" data-view="threequarter" aria-pressed="false"><kbd>2</kbd>Three-quarter</button>
        <button type="button" data-view="topdown" aria-pressed="false"><kbd>3</kbd>Top-down</button>
        <button type="button" data-view="brawler" aria-pressed="false"><kbd>4</kbd>Brawler</button>
      </div>
      <div class="seg panel" role="group" aria-label="Inspection tools">
        <button type="button" id="rigBtn" aria-pressed="false"><kbd>R</kbd>Skeleton</button>
        <button type="button" id="slowBtn" aria-pressed="false"><kbd>T</kbd>Slow motion</button>
        <span class="fps" id="fps">60 fps</span>
      </div>
    </div>
  </div>
  <div id="banner"><div id="bannerTitle"></div><div id="bannerSub"></div></div>
  <div class="hud bottom">
    <div class="vitals panel">
      <div class="row"><b>Health</b><span id="hpText">100 / 100</span></div>
      <div class="hpbar"><div id="hpFill"></div></div>
      <div class="row"><span id="waveText">Wave 1</span></div>
    </div>
    <p class="keys panel"><b>WASD</b> move, <b>mouse</b> aims. <b>Left click</b> or <b>J</b> slashes (three-hit combo), <b>right click</b> or <b>E</b> throws an ember, <b>Space</b> dashes. <b>V</b> cycles the camera.</p>
  </div>
  <div class="hud touch" aria-hidden="true">
    <button data-act="dash">Dash</button><button data-act="skill">Ember</button><button data-act="attack">Slash</button>
  </div>
</div>
<script>window.CO55_CONFIG = { view: 'iso' };</script>
<script>
/* ---- inlined from engine/co55.js ---- */
/*!
 * CO55 2D Engine v0.1.0
 * Procedural pixel-puppet engine for every 2D perspective.
 * https://github.com/michaelcrosato/2D-co55-engine  (MIT License)
 *
 * READ THIS FIRST (humans and AI models extending a CO55 game)
 * -----------------------------------------------------------------------------
 * 1. WORLD SPACE IS 3D. x = east, y = south, z = up. One floor tile = 16 units.
 *    Game logic never thinks about screen pixels.
 * 2. A VIEW turns world points into screen pixels. Swap the view and the whole game
 *    re-renders from another angle: CO55.VIEWS.iso, .threequarter, .topdown,
 *    .brawler, .side  (or build your own: new CO55.View(id, label, yaw, pitch, scale, zBoost)).

 *    fluidly and can face any angle in any view without extra art.

 *      floor (you call map.drawFloor) -> decals (ground marks, shadows)
 *      -> sorted queue (walls, props, actors, particles) -> lighting -> overlays -> present
 *    Anything that can be in front of or behind something else goes through

 *    substeps, so motion is identical at 60, 120 or 144 Hz. game.freeze(s) = hit-stop,

/* =============================================================================
 * 2. PIXEL PRIMITIVES  (all snap to whole pixels, never anti-aliased)
 *    g = CanvasRenderingContext2D, coordinates in buffer pixels.
 * ============================================================================= */
const px = {};

px.dot = (g, x, y, c) => { px.col(g, c); g.fillRect(Math.round(x), Math.round(y), 1, 1); };
px.line = (g, x0, y0, x1, y1, c, w = 1) => {
  px.col(g, c);
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, o = w >> 1;

    if (e2 <= dx) { e += dx; y0 += sy; }

  px.col(g, c); cx = Math.round(cx); cy = Math.round(cy);
  const R = r + .35, R2 = R * R, n = Math.floor(R);

};

  const Ry = ry + .35, n = Math.floor(Ry);

  const n = pts.length;
  for (let y = y0; y <= y1; y++) {
    _xs.length = 0;
    for (let i = 0, j = n - 1; i < n; j = i++) {

  const R = r + .35, R2 = R * R, n = Math.floor(R);

E.VIEWS = {

  threequarter: new View('threequarter', 'Three-quarter', 0, 55, 1.5, 1.35), // Zelda, Stardew, Enter the Gungeon

    if (dir[0] || dir[1]) e.facing = E.approachAng(e.facing, Math.atan2(dir[1], dir[0]), dt * 5);
    if (d < 21 && !h.dead) { e.state = 'wind'; e.t = 0; }
  } else if (e.state === 'wind') {
    e.t += dt; e.facing = E.approachAng(e.facing, toH, dt * 2.5);
    if (e.t >= HUSK.wind) { e.state = 'active'; e.t = 0; e.hitDone = false; e.vx += Math.cos(e.facing) * 90; e.vy += Math.sin(e.facing) * 90; }
  } else if (e.state === 'active') {
    e.t += dt;
    if (!e.hitDone && d < HUSK.range + h.r && Math.abs(E.angDiff(e.facing, toH)) < 1.1) { e.hitDone = true; hurtHero(12, toH); }
    if (e.t >= HUSK.active) { e.state = 'recover'; e.t = 0; }
  } else if (e.state === 'recover') { e.t += dt; if (e.t >= HUSK.recover) e.state = 'chase'; }
  const acc = (e.stun > 0 ? 160 : 500) * dt;
  e.vx = approach(e.vx, mvx, acc); e.vy = approach(e.vy, mvy, acc);
  e.x += e.vx * dt; e.y += e.vy * dt; collideWorld(e);
  const ph = e.state === 'wind' || e.state === 'active' || e.state === 'recover' ? e.state : null;
  e.rig.update(dt, { x: e.x, y: e.y, z: 0, vx: e.vx, vy: e.vy, facing: e.facing, hurt: e.stun > 0,
    attack: ph && e.stun <= 0 ? { spec: HUSK_SWING, phase: ph, u: clamp(e.t / HUSK[ph], 0, 1) } : null });
}
function updateSlime(e, dt) {
  const h = hero, dx = h.x - e.x, dy = h.y - e.y, d = Math.hypot(dx, dy) || 1;
  const grounded = e.z <= 0 && e.vz <= 0;
  if (grounded) {
    e.vx = approach(e.vx, 0, 400 * dt); e.vy = approach(e.vy, 0, 400 * dt);
    if (e.stun <= 0 && !h.dead) {
      e.t -= dt;
      if (e.state === 'idle' && e.t <= 0) { e.state = 'crouch'; e.t = .28; }
      else if (e.state === 'crouch' && e.t <= 0) {
        const dir = d < 60 ? [dx / d, dy / d] : flow.dir(e.x, e.y, h.x, h.y);
        e.state = 'air'; e.vz = 150; e.vx = dir[0] * 72; e.vy = dir[1] * 72; e.blob.kick(4.5);
      }
    }
  }
  if (e.state === 'air' || e.z > 0) {
    e.vz -= 480 * dt; e.z += e.vz * dt;
    if (e.z <= 0) { e.z = 0; e.vz = 0; e.state = 'idle'; e.t = .45 + Math.random() * .5; e.blob.kick(-5); P.dust(e.x, e.y, 0, 4, { speed: 25 }); }
  }
  e.x += e.vx * dt; e.y += e.vy * dt; collideWorld(e);
  if (!h.dead && e.z < 5 && d < e.r + h.r) hurtHero(8, Math.atan2(dy, dx));
  e.blob.update(dt, { squash: e.state === 'crouch' ? -.32 : e.z > 0 ? clamp(e.vz / 600, -.2, .28) : 0, look: [dx, dy], squint: e.state === 'crouch' });
}
function updateWisp(e, dt) {
  const h = hero, dx = h.x - e.x, dy = h.y - e.y, d = Math.hypot(dx, dy) || 1;
  e.t += dt;
  let ax = 0, ay = 0;
  if (e.stun <= 0) {
    const want = d > 100 ? 1 : d < 70 ? -1 : 0;
    ax = dx / d * want * 60 + (-dy / d) * e.orbit * 34; ay = dy / d * want * 60 + (dx / d) * e.orbit * 34;
  }
  e.vx += (ax - e.vx * 1.6) * dt; e.vy += (ay - e.vy * 1.6) * dt;
  e.x += e.vx * dt; e.y += e.vy * dt; collideWorld(e);
  e.z = 20 + Math.sin(e.t * 2) * 3;
  if (!h.dead && e.stun <= 0) {
    if (e.charge > 0) {
      e.charge -= dt;
      if (e.charge <= 0) {
        const a = Math.atan2(dy, dx);
        shots.push({ x: e.x, y: e.y, z: e.z, vx: Math.cos(a) * 95, vy: Math.sin(a) * 95, life: 3, from: 'enemy', dmg: 10, color: '#c78bff', core: '#f4e6ff', r: 3 });
        e.fire = 2 + Math.random() * 1.2;
      }
    } else { e.fire -= dt; if (e.fire <= 0) e.charge = .6; }
  }
}

/* ---------- combat ---------- */
function swingHits() {
  const A = hero.atk, sp = A.spec;
  for (const e of enemies) {
    if (!e.alive || e.spawnT > 0 || A.hit.has(e)) continue;
    const dx = e.x - hero.x, dy = e.y - hero.y, d = Math.hypot(dx, dy);
    if (d > sp.range + e.r) continue;
    if (!sp.spin && Math.abs(E.angDiff(hero.facing, Math.atan2(dy, dx))) > sp.half) continue;
    A.hit.add(e);
    damageEnemy(e, sp.dmg, Math.atan2(dy, dx), sp.kb, sp.spin);
  }
}
const BITS = { husk: ['#8fa38a', '#5b4a3c', '#3d3530'], slime: ['#c95f9a', '#f5a3cc', '#6d2658'], wisp: ['#c78bff', '#f4e6ff', '#7a4ac0'] };
function damageEnemy(e, dmg, ang, kb, big) {
  e.hp -= dmg; e.flash = .1; e.stun = .22;
  e.vx += Math.cos(ang) * kb; e.vy += Math.sin(ang) * kb;
  if (e.type === 'husk') { e.state = 'chase'; e.rig.kick(2.5); }
  if (e.type === 'slime') { e.blob.kick(5); e.state = 'idle'; e.t = .5; }
  if (e.type === 'wisp') e.charge = 0;
  game.freeze(big ? .075 : .055); game.shake(big ? 3.5 : 2.4);
  const z = e.type === 'wisp' ? e.z : 10;
  P.sparks(lerp(hero.x, e.x, .6), lerp(hero.y, e.y, .6), z, 9, ang);
  P.ring(e.x, e.y, 2, 12, '#fff3c4', .18);
  P.text(e.x, e.y, (e.z || 0) + e.head + 4, dmg, big ? '#ffd36a' : '#fff2c4');
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.alive = false; kills++;
  P.bits(e.x, e.y, (e.z || 0) + 6, 16, BITS[e.type]);
  P.dust(e.x, e.y, 0, 8, { speed: 45, size: 1.6 });
  P.ring(e.x, e.y, 3, 24, BITS[e.type][1], .35);
  game.freeze(.08); game.shake(2);
  if (Math.random() < .3) orbs.push({ x: e.x, y: e.y, z: 6, vx: (Math.random() - .5) * 40, vy: (Math.random() - .5) * 40, vz: 90, t: 0 });
}

/* ---------- pickups ---------- */
const orbs = [];
function updateOrbs(dt) {
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i]; o.t += dt;
    o.vz -= 400 * dt; o.z += o.vz * dt;
    if (o.z < 0) { o.z = 0; o.vz = Math.abs(o.vz) > 30 ? -o.vz * .5 : 0; o.vx *= .6; o.vy *= .6; }
    const dx = hero.x - o.x, dy = hero.y - o.y, d = Math.hypot(dx, dy) || 1;
    if (o.t > .4 && d < 56 && !hero.dead) { o.vx += dx / d * 500 * dt; o.vy += dy / d * 500 * dt; }
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (d < 8 && !hero.dead && hero.hp < hero.max) {
      const heal = Math.min(12, hero.max - hero.hp); hero.hp += heal;
      P.text(hero.x, hero.y, 30, '+' + heal, '#8dffb0'); P.ring(hero.x, hero.y, 2, 14, '#8dffb0', .3);
      orbs.splice(i, 1); continue;
    }
    if (o.t > 14) orbs.splice(i, 1);
  }
}

/* ---------- waves ---------- */
let wave = 0, kills = 0, spawnQueue = [], spawnTimer = 0, waveGap = 1.2;
function startWave() {
  wave++;
  const list = [];
  for (let i = 0; i < 1 + wave; i++) list.push('husk');
  for (let i = 0; i < Math.floor((wave + 1) / 2); i++) list.push('slime');
  for (let i = 0; i < Math.floor(wave / 2); i++) list.push('wisp');
  for (let i = list.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [list[i], list[j]] = [list[j], list[i]]; }
  spawnQueue = list; spawnTimer = .3;
  banner('Wave ' + wave, wave === 1 ? 'Clear the hall' : list.length + ' foes rise');
  P.ring(CX, CY, 8, 60, '#7fe3d6', .8);
}
function spawnPoint() {
  for (let k = 0; k < 60; k++) {
    const cx = 2 + ((Math.random() * (MW - 4)) | 0), cy = 2 + ((Math.random() * (MH - 4)) | 0);
    if (map.cell(cx, cy) !== 0) continue;
    const x = (cx + .5) * T, y = (cy + .5) * T;
    if (Math.hypot(x - hero.x, y - hero.y) < 110) continue;
    if (braziers.some(b => Math.hypot(b.x - x, b.y - y) < 14)) continue;
    return [x, y];
  }
  return [CX, 2.5 * T];
}
function updateWaves(dt) {
  if (hero.dead) return;
  if (spawnQueue.length) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const [x, y] = spawnPoint();
      enemies.push(MAKERS[spawnQueue.shift()](x, y));
      P.ring(x, y, 2, 16, '#7fe3d6', .5);
      spawnTimer = .35;
    }
  } else if (!enemies.length) { waveGap -= dt; if (waveGap <= 0) { waveGap = 1.6; startWave(); } }
}
function resetGame() {
  enemies.length = 0; shots.length = 0; orbs.length = 0; spawnQueue = [];
  Object.assign(hero, { x: CX, y: CY + 40, vx: 0, vy: 0, hp: hero.max, dead: false, inv: 1, atk: null, dashT: 0, hurtT: 0 });
  hero.rig.capeL = null;
  wave = 0; kills = 0; waveGap = .8;
}

/* ---------- update ---------- */
function update(dt) {
  updateHero(dt);
  updateEnemies(dt);
  updateShots(dt);
  updateOrbs(dt);
  updateWaves(dt);
  for (const b of braziers) { b.t += dt; if (Math.random() < dt * 9) P.add({ kind: 'ember', x: b.x + (Math.random() - .5) * 5, y: b.y + (Math.random() - .5) * 5, z: 14, vx: (Math.random() - .5) * 8, vy: (Math.random() - .5) * 8, vz: 18 + Math.random() * 22, max: .7 + Math.random() * .6, color: '#ff8a3a' }); }
  for (const s of sconces) s.t += dt;
  const a = hero.aim !== undefined ? hero.aim : hero.facing;
  game.focus(hero.x + Math.cos(a) * 16, hero.y + Math.sin(a) * 16, 8);
}

/* ---------- draw ---------- */
const flicker = t => .9 + Math.sin(t * 13) * .05 + Math.sin(t * 29) * .04 + Math.sin(t * 7.3) * .04;
function drawFlame(g, r, x, y, z, t, s = 1) {
  const sc = r.view.scale;
  for (let k = 0; k < 3; k++) {
    const a = k * 2.1 + t * .6, bx = x + Math.cos(a) * 1.6 * s, by = y + Math.sin(a) * 1.6 * s;
    const h = (7 + Math.sin(t * 9 + k * 2) * 2.2 + Math.sin(t * 17 + k) * 1.2) * s, sw = Math.sin(t * 6 + k * 1.7) * 1.4;
    const [x0, y0] = r.w(bx, by, z), [tx, ty] = r.w(bx + sw, by, z + h), w = 2.2 * s * sc;
    px.poly(g, [[x0 - w, y0], [tx, ty], [x0 + w, y0]], '#ff7a2a');
    const [mx, my] = r.w(bx + sw * .5, by, z + h * .65);
    px.poly(g, [[x0 - w * .55, y0], [mx, my], [x0 + w * .55, y0]], '#ffd36a');
  }
  const [cx, cy] = r.w(x, y, z + 1); px.rect(g, cx - 1, cy - 1, 2, 2, '#fff4c8');
}
function drawBrazier(g, r, b) {
  r.box(g, b.x - 3, b.y - 3, 0, b.x + 3, b.y + 3, 8, '#5d566f', '#433d55');
  px.poly(g, r.groundPts(b.x, b.y, 5.5, 14, 11), '#2b2430');
  px.poly(g, r.groundPts(b.x, b.y, 5.5, 14, 9), '#3a3036');
  px.poly(g, r.groundPts(b.x, b.y, 4, 12, 11.2), '#ff8a3c');
  drawFlame(g, r, b.x, b.y, 11, b.t);
}
function drawSconce(g, r, s) {
  r.box(g, s.x - 2, s.y - 1, s.z - 6, s.x + 2, s.y + 3, s.z - 3, '#6a5a48', '#4a3e34');
  drawFlame(g, r, s.x, s.y + 1.5, s.z - 3, s.t, .7);
}
function drawWisp(g, ox, oy, e) {
  const k = e.charge > 0 ? 1 + (1 - e.charge / .6) * .8 : 1, f = e.flash > 0;
  px.ddisc(g, ox, oy, 7 * k, '#7a4ac0', .55, 0, 0);
  px.disc(g, ox, oy, 3.2 * k, f ? '#ffffff' : '#c78bff');
  px.disc(g, ox - .5, oy - .5, 1.8 * k, '#f4e6ff');
  for (let i = 0; i < 3; i++) { const a = e.t * 4 + i * TAU / 3; px.dot(g, ox + Math.cos(a) * 6, oy + Math.sin(a) * 3, '#e3c8ff'); }
  for (let i = 1; i < 4; i++) px.dot(g, ox - e.vx * .03 * i + Math.sin(e.t * 9 + i) * .8, oy + i * 1.6, i < 2 ? '#c78bff' : '#7a4ac0');
}
function draw(r) {
  const view = r.view, L = game.lights, t = game.time;
  map.drawFloor(r);
  // ground decals: shadows and telegraphs
  const shadow = (x, y, rad) => r.decal(() => r.groundDisc(x, y, rad, '#000000', .55));
  if (!hero.dead) shadow(hero.x, hero.y, 5.5);
  for (const e of enemies) {
    if (!e.alive) continue;
    shadow(e.x, e.y, e.type === 'wisp' ? 3.5 : e.type === 'slime' ? 6 - Math.min(3, e.z * .1) : 5.5);
    if (e.type === 'husk' && e.state === 'wind' && e.stun <= 0) {
      const u = clamp(e.t / HUSK.wind, 0, 1);
      r.decal(() => r.groundArc(e.x, e.y, 4, 4 + 20 * u, e.facing - 1.05, e.facing + 1.05, '#ff4a3a', .25 + .45 * u));
    }
  }
  for (const o of orbs) shadow(o.x, o.y, 2.5);
  map.queueWalls(r);
  for (const b of braziers) { r.queue(b.x, b.y, 0, g => drawBrazier(g, r, b)); L.add(b.x, b.y, 14, 100, 1.05 * flicker(b.t)); }
  for (const s of sconces) { r.queue(s.x, s.y + 4, 0, g => drawSconce(g, r, s)); L.add(s.x, s.y + 8, s.z, 74, .85 * flicker(s.t + 3)); }
  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    const alpha = e.spawnT > 0 ? clamp(1 - e.spawnT / .7, .05, 1) : 1, flash = e.flash > 0;
    if (e.type === 'husk') r.actor(e.x, e.y, 0, (g, ox, oy) => e.rig.draw(g, ox, oy, view), { flash, alpha });
    else if (e.type === 'slime') r.actor(e.x, e.y, e.z, (g, ox, oy) => e.blob.draw(g, ox, oy, view), { flash, alpha });
    else { r.actor(e.x, e.y, e.z, (g, ox, oy) => drawWisp(g, ox, oy, e), { rim: false, alpha }); L.add(e.x, e.y, e.z, 46, .75); }
  }
  // hero
  if (!hero.dead) {
    const h = hero, ghost = h.dashT > 0 && t - h.lastGhost > .03;
    if (ghost) h.lastGhost = t;
    const blink = h.inv > 0 && h.hurtT <= 0 && Math.floor(game.real * 16) % 2 === 0;
    r.actor(h.x, h.y, 0, (g, ox, oy) => h.rig.draw(g, ox, oy, view), { xray: true, flash: h.flash > 0 ? '#ffb0a0' : false, alpha: blink ? .45 : 1, ghost: ghost ? { color: '#62d8ff', life: .22 } : null });
    h.rig.drawSmear(r);
    L.add(h.x, h.y, 10, 82, .8);
  }
  // projectiles and pickups
  for (const s of shots) {
    r.queue(s.x, s.y, s.z, g => { const [x, y] = r.w(s.x, s.y, s.z); px.ddisc(g, x, y, 5, s.color, .5, r.ix, r.iy); px.disc(g, x, y, 2, s.color); px.dot(g, x, y, s.core); });
    L.add(s.x, s.y, s.z, s.from === 'hero' ? 38 : 30, .8);
  }
  for (const o of orbs) {
    r.queue(o.x, o.y, o.z, g => { const [x, y] = r.w(o.x, o.y, o.z + 3 + Math.sin(t * 5) * .8); px.disc(g, x, y, 2.4, '#8a1f2e'); px.disc(g, x, y, 1.6, '#e8475a'); px.dot(g, x - 1, y - 1, '#ffd0d6'); });
    L.add(o.x, o.y, 4, 20, .45);
  }
  // overlays: health bars and debug skeletons
  r.overlay(g => {
    for (const e of enemies) {
      if (!e.alive || e.spawnT > 0 || e.hp >= e.max) continue;
      const [x, y] = r.w(e.x, e.y, (e.z || 0) + e.head + 3), w = 14, f = Math.max(0, Math.round(w * e.hp / e.max));
      px.rect(g, x - w / 2 - 1, y - 1, w + 2, 4, '#140b12'); px.rect(g, x - w / 2, y, f, 2, '#e0463c'); px.rect(g, x - w / 2, y, f, 1, '#ff8a74');
    }
    if (showRig) {
      if (!hero.dead) hero.rig.debug(r);
      for (const e of enemies) if (e.alive && e.rig) e.rig.debug(r);
      for (const e of [hero, ...enemies]) if (e.alive !== false) r.groundRing(e.x, e.y, e.r, '#46f0ff', 1);
    }
  });
}

/* ---------- HUD ---------- */
const $ = id => document.getElementById(id);
const NOTES = {
  iso: 'Isometric: the camera is turned 45° and tilted 30°, like Diablo and Bastion.',
  threequarter: 'Three-quarter: the camera faces north, tilted 55°, like Zelda and Stardew Valley.',
  topdown: 'Top-down: nearly straight down, like Hotline Miami.',
  brawler: 'Brawler: a low camera, like Streets of Rage.'
};
const VIEWS = ['iso', 'threequarter', 'topdown', 'brawler'];
let showRig = false, bannerT = 0;
const viewBtns = [...document.querySelectorAll('[data-view]')];
function syncView() {
  viewBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === game.view.id)));
  $('note').textContent = NOTES[game.view.id] || '';
}
function setView(id) { game.setView(id); syncView(); }
viewBtns.forEach(b => b.addEventListener('click', () => { setView(b.dataset.view); b.blur(); }));
const slowBtn = $('slowBtn'), rigBtn = $('rigBtn');
const setSlow = v => { game.timeScale = v ? .25 : 1; slowBtn.setAttribute('aria-pressed', String(v)); };
const setRig = v => { showRig = v; rigBtn.setAttribute('aria-pressed', String(v)); };
slowBtn.addEventListener('click', () => { setSlow(game.timeScale === 1); slowBtn.blur(); });
rigBtn.addEventListener('click', () => { setRig(!showRig); rigBtn.blur(); });
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'KeyV') setView(VIEWS[(VIEWS.indexOf(game.view.id) + 1) % VIEWS.length]);
  else if (/^Digit[1-4]$/.test(e.code)) setView(VIEWS[+e.code.slice(5) - 1]);
  else if (e.code === 'KeyT') setSlow(game.timeScale === 1);
  else if (e.code === 'KeyR') setRig(!showRig);
});
game.input.bindButtons(document);
function banner(title, sub) { $('bannerTitle').textContent = title; $('bannerSub').textContent = sub; $('banner').classList.add('show'); bannerT = 2.2; }
function hud() {
  $('hpFill').style.width = (hero.hp / hero.max * 100) + '%';
  $('hpText').textContent = Math.ceil(hero.hp) + ' / ' + hero.max;
  $('waveText').textContent = 'Wave ' + Math.max(1, wave) + '   Kills ' + kills;
  $('fps').textContent = game.fps + ' fps';
  if (bannerT > 0) { bannerT -= 1 / 60; if (bannerT <= 0 && !hero.dead) $('banner').classList.remove('show'); }
}

syncView();
game.start({ update, draw: r => { draw(r); hud(); } });
window.__game = { game, hero, enemies, setView, map };
})();

</script>
