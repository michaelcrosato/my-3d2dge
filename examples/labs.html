<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labs · my-3D2dge</title>
<meta name="theme-color" content="#06050b">
<!--
  The Labs page: one place to open every test page, lab and demo of my-3D2dge (my-3d2dge.vercel.app/labs).
  Built by tools/build.mjs from the list in src/labs.json; edit the list, not this page. tools/labs-test.mjs opens
  every link. The links work from the site (/mocap-lab) and from the files on disk (examples/mocap-lab.html).
-->
<style>
:root{
  --bg:#f0e6d6; --panel:#faf2e4; --ink:#2a2140; --muted:#63557a; --accent:#b8612a; --accent-ink:#fff6e6;
  --line:rgba(42,33,64,.18); --chip:rgba(42,33,64,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#06050b; --panel:#141022; --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.14); --chip:rgba(241,228,200,.08); }
}
:root[data-theme="dark"]{ --bg:#06050b; --panel:#141022; --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.14); --chip:rgba(241,228,200,.08); }
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Trebuchet MS',system-ui,sans-serif;line-height:1.4;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:760px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:6px}
h1{margin:0;font-size:26px}
.where{font-size:13px;color:var(--muted)}
.where b{color:var(--accent);font-weight:600}
.intro{margin:0 0 18px;color:var(--muted);font-size:15px}
h2{margin:22px 0 8px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 13px;margin-bottom:10px}
.card h3{margin:0 0 3px;font-size:18px}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a::after{content:" →";color:var(--accent)}
.card p{margin:0 0 9px;font-size:14px;color:var(--muted)}
.card .date{font-size:12px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-block;padding:7px 11px;border-radius:7px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:14px;min-height:34px}
.links a:first-child{background:var(--accent);color:var(--accent-ink)}
.links a:focus-visible,.card h3 a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{font-size:14px;color:var(--muted);margin:0;padding:10px 14px;border:1px dashed var(--line);border-radius:10px}
footer{margin-top:26px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
footer .ver{margin-top:6px;font-size:12px;opacity:.8}
</style>
</head>
<body>
<main>
  <header><h1>Labs</h1><span class="where" id="where"></span></header>
  <p class="intro">Every test page, lab and demo, one tap away. Each opens in this tab; your browser's back button returns here.</p>
  <div id="list"></div>
  <footer id="foot"></footer>
</main>
<script>
const LABS = {
  "$about": "The Labs page (examples/labs.html, my-3d2dge.vercel.app/labs) is built from this list by tools/build.mjs. Each entry is one page: page is an examples/ page name (examples/<page>.html, served at /<page>) or a dist/ path; links are [label, what to add to the address]. keep: tools and demos worth keeping. temporary: the prototypes (DOCTRINE.md), one-off comparisons and experiments, each with the date it was added and the question it answers, and deviates: one line for each way it departs from the doctrine, if any; when the question is settled, delete the page and its entry, or graduate it to another section (it is then held to the engine tier). A change to a prototype alone needs no version bump. tools/labs-test.mjs opens every link.",
  "sections": [
    {
      "id": "game",
      "title": "The game",
      "entries": [
        {
          "page": "emberdeep",
          "title": "Emberdeep",
          "what": "The game itself. Its own test areas are inside it: the Proving Grounds, the Gallery (every monster, skill and pose) and the Developer panel's sandbox.",
          "links": [["Title", ""], ["Town", "#town"], ["Depth 7", "#depth-7"], ["Proving Grounds", "#proving"], ["Gallery", "#gallery"], ["Bestiary: husk", "#gallery/bestiary/husk"], ["Three-quarter view", "?view=threequarter"]]
        }
      ]
    },
    {
      "id": "keep",
      "title": "Labs",
      "entries": [
        {
          "page": "mocap-lab",
          "title": "Mocap Lab",
          "what": "Every imported animation clip, on a mannequin and on the hero, in every view, slow or frame by frame. Sets: Quaternius, Mesh2Motion, CMU motion capture, and the clips the hero uses; the CMU library holds every one of its 2,548 takes.",
          "links": [["All sets", ""], ["CMU clips", "?set=cmu"], ["Every CMU take", "?set=library"], ["Mesh2Motion", "?set=mesh2motion"], ["Hero's clips", "?set=hero"], ["Side view", "?view=side"], ["Hero only, slow", "?cast=hero&speed=.25"]]
        },
        {
          "page": "perspective-lab",
          "title": "Perspective Lab",
          "what": "One room in every camera view (isometric, three-quarter, top-down, brawler, side), with skeleton and lighting toggles.",
          "links": [["Open", ""]]
        },
        {
          "page": "stress-test",
          "title": "Stress test",
          "what": "Raise the load (up to 5,000 monsters, torches, particles) until the frame rate drops, or run the benchmark to rate this device. Any view the engine can draw (side scrolling, with depth drawn the Mode 7 way, or a custom turn and tilt), fixed in place if you like.",
          "links": [["Open", ""], ["Three-quarter view", "?view=threequarter"], ["Side scrolling", "?view=side"], ["Side scrolling with depth (Mode 7)", "?view=side&depth=1"], ["Custom camera, fixed", "?cam=300,20,1.25,8,1.2,520,410"]]
        }
      ]
    },
    {
      "id": "demos",
      "title": "Demos and starters",
      "entries": [
        {
          "page": "arena",
          "title": "Emberwell",
          "what": "The action-RPG arena demo with GPU lighting, in four views.",
          "links": [["Isometric", ""], ["Three-quarter", "#threequarter"], ["Top-down", "#topdown"], ["Brawler", "#brawler"]]
        },
        {
          "page": "dist/my-3d2dge.html",
          "title": "Starter games",
          "what": "The file to hand an AI model: the engine, its API card and five small games. The kits are one game each.",
          "links": [["All five", ""], ["Adventure kit", "dist/kits/my-3d2dge-adventure.html"], ["Platformer kit", "dist/kits/my-3d2dge-platformer.html"], ["Brawler kit", "dist/kits/my-3d2dge-brawler.html"], ["Shooter kit", "dist/kits/my-3d2dge-shooter.html"], ["RPG kit", "dist/kits/my-3d2dge-rpg.html"], ["Animation kit", "dist/kits/my-3d2dge-animlab.html"]]
        },
        {
          "page": "scarfrunner-side",
          "title": "Scarfrunner",
          "what": "The side-scrolling prototype that came before the engine.",
          "links": [["Open", ""]]
        }
      ]
    },
    {
      "id": "temporary",
      "title": "Temporary",
      "empty": "Nothing here right now. One-off comparisons and experiments land here, with the date and the question each one answers, and are deleted once it is settled.",
      "entries": [
        {
          "page": "shapes-compare",
          "title": "Shapes vs props",
          "added": "2026-10-08",
          "question": "Are 3D models converted to shapes worth building, next to our flat props?",
          "what": "Twelve free 3D models (Kenney and KayKit, CC0) converted to shapes and drawn by the engine in every view and turning, beside the hero and our closest flat prop, ranked from the best case to the worst, with what is off and what would fix it.",
          "links": [["Open", ""]]
        },
        {
          "page": "free-camera",
          "title": "Free camera room",
          "added": "2026-10-08",
          "question": "What does a free camera look like in our engine, and which objects hold up when you turn it?",
          "what": "A small room with four pillars, crates and the hero walking a lap. Drag to turn and tilt, zoom, move up and down, then fix the camera anywhere and copy its code or link. The crates switch between a converted 3D shape, today's flat prop and the engine's plain box. Fly mode (G) is a first-person camera on a small renderer of its own, to show what the engine can't do and what carries over.",
          "links": [["Open", ""], ["Fixed: low corner", "?cam=320,18,1.6,6,1,104,88"], ["Fixed: straight down", "?cam=0,90,1.2,0,1,104,88"], ["Fly: eye level", "?fly=104,150,20,-90,-7,70"]]
        },
        {
          "page": "lab-3d",
          "title": "3D world lab",
          "added": "2026-10-08",
          "question": "Can our characters, animation and look live in a real 3D world (three.js r182 and Rapier), with all its art drawn by code, and stay easy for AI agents to work on?",
          "deviates": "keeps three.js's WebGL 2 fallback as its cross-check that gameplay never reads the renderer (principle 6: WebGPU only).",
          "what": "A stone room in real 3D (three.js r182 on WebGPU, or WebGL 2 by itself, and Rapier physics), every texture and shape drawn by code. The hero walks a lap or you play it (move, swing, dash, knock the crates about); a mocap figure and Emberdeep's Dan stand by. Each character is a Card (the engine's own drawing on a card facing the camera) or a Puppet (3D parts on the same joints), or both side by side, in the engine's five fixed views or a free orbit, fly or chase camera. The decisions and trade-offs are in docs/LAB-3D.md.",
          "links": [["Open", ""], ["Side by side", "?look=both&view=threequarter"], ["Puppets, fly", "?look=puppet&view=fly"], ["Play: chase camera", "?view=chase"], ["On WebGL 2", "?backend=webgl"]]
        },
        {
          "page": "stress-world",
          "title": "Stress test: 3D world",
          "added": "2026-10-09",
          "question": "What does the stress test become built from the ground up as a 3D game (three.js r182, Rapier physics, a hall written as text), sharing only the engine's animation system, and how does it hold up?",
          "deviates": "keeps three.js's WebGL 2 fallback as its cross-check that gameplay never reads the renderer (principle 6: WebGPU only).",
          "what": "The stress test's job done as a 3D game, its own way: every monster is a Rapier body (the crowd pushes and piles up by itself, big hits throw bodies into the air, crates and barrels fly), the hero walks, dashes and jumps onto low walls and galleries, monsters find their way up the stairs after him. The hall is the 2D one's layout written as ASCII text, with a raised rune dais and two galleries. Characters are Cards (the engine draws them) or Puppets, in the engine's views (perspective or orthographic), side scrolling with depth, chase, first person, fly or fixed; filters (Comic cel or Pixel on the scene, the characters or the hall, bloom, FXAA). The benchmark adds a physics column.",
          "links": [["Open", ""], ["Puppets", "?look=puppet"], ["400 monsters", "?monsters=400"], ["Chase camera", "?cam3=chase&look=puppet&res=balanced"], ["Side scrolling with depth", "?view=side&depth=1"], ["Orthographic three-quarter", "?view=threequarter&proj=ortho"], ["Comic cel", "?fx=cel&look=puppet&res=full"], ["On WebGL 2", "?backend=webgl"]]
        }
      ]
    }
  ]
}
;
// On the site the pages have short addresses (/mocap-lab, and this page is /labs or /labs.html); as files (on disk, or
// the site's /examples/ folder) they sit next to this one (examples/mocap-lab.html) and the starters are in ../dist/
const LOCAL = location.protocol === 'file:' || /\/examples\/[^/]*$/.test(location.pathname);
const url = p => p.startsWith('dist/') ? (LOCAL ? '../' : '/') + p : LOCAL ? p + '.html' : '/' + p;
const target = (page, add) => add.startsWith('dist/') ? url(add) : url(page) + add;
const el = (tag, cls, text, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; if (parent) parent.appendChild(e); return e; };
const list = document.getElementById('list');
for (const S of LABS.sections) {
  el('h2', '', S.title, list);
  if (!S.entries.length) { el('p', 'empty', S.empty || 'Nothing here.', list); continue; }
  for (const L of S.entries) {
    const card = el('section', 'card', '', list), h = el('h3', '', '', card), a = el('a', '', L.title, h);
    a.href = target(L.page, L.links[0][1]);
    if (L.added) el('div', 'date', 'Added ' + L.added + (L.question ? ' · ' + L.question : ''), card);
    if (L.deviates) el('div', 'date', 'Deviates: ' + L.deviates, card);   // a prototype's departure from DOCTRINE.md, in a line
    el('p', '', L.what, card);
    const row = el('div', 'links', '', card);
    for (const [label, add] of L.links) el('a', '', label, row).href = target(L.page, add);
  }
}
// which copy of the site this is: Vercel builds a preview of each branch at an address with -git- in it
const preview = /-git-/.test(location.hostname);
document.getElementById('where').innerHTML = location.protocol === 'file:' ? 'files on this computer' : preview ? '<b>preview</b> of work not merged yet' : location.hostname ? 'live site' : '';
const foot = document.getElementById('foot');
foot.append('The list is src/labs.json; ');
el('a', '', 'the game', foot).href = LOCAL ? 'emberdeep.html' : '/';
foot.append(' links here from its Developer panel.');
// the release and the commit it was deployed from (tools/stamp.mjs fills the build in on the site)
el('div', 'ver', 'my-3D2dge v0.16.0 · dev-build', foot);
</script>
</body>
</html>
