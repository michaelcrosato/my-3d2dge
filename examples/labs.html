<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labs · my-3D2dge</title>
<meta name="theme-color" content="#06050b">
<!--
  The Labs page: one place to open every test page, lab and demo of my-3D2dge (my-3d2dge.vercel.app/labs).
  Built by tools/build.mjs from the list in src/labs.json; edit the list, not this page. tools/labs-test.mjs opens
  every link. The links work from the site (/mocap-lab) and from the files on disk (examples/mocap-lab.html).
  A bar at the top jumps to each section (it marks the one on screen). A card opens its page from anywhere on it; its
  chips are other places to start. The kits are small tiles; the Temporary cards lead with their question, newest first.
-->
<style>
:root{
  --bg:#f0e6d6; --panel:#faf2e4; --ink:#2a2140; --muted:#63557a; --accent:#b8612a; --accent-ink:#fff6e6;
  --line:rgba(42,33,64,.18); --chip:rgba(42,33,64,.07); --hover:rgba(184,97,42,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#06050b; --panel:#141022; --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.14); --chip:rgba(241,228,200,.08); --hover:rgba(240,162,58,.16); }
}
:root[data-theme="dark"]{ --bg:#06050b; --panel:#141022; --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.14); --chip:rgba(241,228,200,.08); --hover:rgba(240,162,58,.16); }
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:60px}
@media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth} }
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Trebuchet MS',system-ui,sans-serif;line-height:1.4;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:1080px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
h1{margin:0;font-size:28px}
.where{font-size:12px;color:var(--muted);padding:2px 9px;border:1px solid var(--line);border-radius:999px}
.where.preview{color:var(--accent);border-color:var(--accent)}
.intro{margin:6px 0 10px;color:var(--muted);font-size:15px;max-width:64ch}
/* the jump bar: one chip a section, with its count; it stays at the top as the page scrolls */
nav{position:sticky;top:0;z-index:5;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:14px}
@media (max-width:420px){ nav a{padding:5px 8px;font-size:13px} }
nav a span{font-size:12px;color:var(--muted)}
nav a.on{background:var(--accent);color:var(--accent-ink)}
nav a.on span{color:inherit;opacity:.8}
section.sec{padding-top:20px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin:0 0 10px}
h2{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.sec-head p{margin:0;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px;align-items:start}
.grid.tiles{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));align-items:stretch}
@media (max-width:520px){ .grid.tiles{grid-template-columns:1fr 1fr;gap:8px} }
/* a card: its title's link covers the whole card; the chips and the details sit above it */
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 13px}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:18px;line-height:1.25}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0;border-radius:inherit}
.card h3 a:focus-visible{outline:none}
.card h3 a:focus-visible::after{outline:2px solid var(--accent);outline-offset:2px}
.card h3 i{font-style:normal;color:var(--accent)}
.card p{margin:0;font-size:14px;color:var(--muted)}
.tiles .card{padding:10px 12px 11px;gap:4px}
.tiles .card h3{font-size:16px}
.tiles .card p{font-size:13px}
.card .meta{font-size:12px;color:var(--muted)}
.card .q{color:var(--ink);font-size:15px;border-left:3px solid var(--accent);padding-left:9px}
.card .dev{font-size:13px}
.card .dev b{color:var(--accent);font-weight:600}
details,.links{position:relative;z-index:1}
details{font-size:14px;color:var(--muted)}
summary{width:max-content;padding:2px 0;cursor:pointer;color:var(--ink);font-size:13px}
details p{margin-top:4px!important}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.links a{display:inline-flex;align-items:center;min-height:34px;padding:6px 11px;border-radius:7px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:14px}
.links a:hover{background:var(--hover)}
.links a:focus-visible,nav a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{font-size:14px;color:var(--muted);margin:0;padding:10px 14px;border:1px dashed var(--line);border-radius:10px}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
footer .ver{margin-top:6px;font-size:12px;opacity:.8}
</style>
</head>
<body>
<main>
  <header><h1>Labs</h1><span class="where" id="where"></span></header>
  <p class="intro">Every page of my-3D2dge to play, test or judge, one tap away. Each opens in this tab; your browser's back button returns here.</p>
  <nav id="jump" aria-label="Sections"></nav>
  <div id="list"></div>
  <footer id="foot"></footer>
</main>
<script>
const LABS = {
  "$about": "The Labs page (examples/labs.html, my-3d2dge.vercel.app/labs) is built from this list by tools/build.mjs. Each section has a title, a line saying what it holds (about) and its entries. Each entry is one page: page is an examples/ page name (examples/<page>.html, served at /<page>) or a dist/ path; its title opens the page, and links are other places to start, [label, what to add to the address] (or another dist/ path). play, kits and keep (Tools) are kept. temporary holds the prototypes (DOCTRINE.md), one-off comparisons and experiments, each with the date it was added and the question it answers, and deviates: one line for each way it departs from the doctrine, if any; when the question is settled, delete the page and its entry, or graduate it to another section (it is then held to the engine tier). A change to a prototype alone needs no version bump. tools/labs-test.mjs opens every link.",
  "sections": [
    {
      "id": "play",
      "title": "Play",
      "about": "The game and the demos.",
      "entries": [
        {
          "page": "emberdeep",
          "title": "Emberdeep",
          "what": "The game itself. Its own test areas are inside it: the Proving Grounds, the Gallery (every monster, skill and pose) and the Developer panel's sandbox.",
          "links": [["Town", "#town"], ["Depth 7", "#depth-7"], ["Proving Grounds", "#proving"], ["Gallery", "#gallery"], ["Bestiary: husk", "#gallery/bestiary/husk"], ["Three-quarter view", "?view=threequarter"]]
        },
        {
          "page": "arena",
          "title": "Emberwell",
          "what": "The action-RPG arena demo with GPU lighting. It opens isometric; three more views below.",
          "links": [["Three-quarter", "#threequarter"], ["Top-down", "#topdown"], ["Brawler", "#brawler"]]
        },
        {
          "page": "scarfrunner-side",
          "title": "Scarfrunner",
          "what": "The side-scrolling prototype that came before the engine.",
          "links": []
        }
      ]
    },
    {
      "id": "kits",
      "title": "Starter kits",
      "about": "Small games for an AI model to build from: one genre each, engine and API card included.",
      "entries": [
        {
          "page": "dist/kits/my-3d2dge-adventure.html",
          "title": "Adventure",
          "what": "Top-down action adventure (Secret of Mana, Zelda): a village, ruins and a shrine.",
          "links": []
        },
        {
          "page": "dist/kits/my-3d2dge-platformer.html",
          "title": "Platformer",
          "what": "Side-scroller (Castlevania, Mega Man X): a night approach to a castle, in five zones.",
          "links": []
        },
        {
          "page": "dist/kits/my-3d2dge-brawler.html",
          "title": "Brawler",
          "what": "Beat-'em-up (Final Fight, Streets of Rage 2): a city block at dusk, wave after wave.",
          "links": []
        },
        {
          "page": "dist/kits/my-3d2dge-shooter.html",
          "title": "Shooter",
          "what": "Vertical shoot-'em-up (Raiden, 1943): farmland, a river town and an air base.",
          "links": []
        },
        {
          "page": "dist/kits/my-3d2dge-rpg.html",
          "title": "RPG battle",
          "what": "Side-view battle (Final Fantasy VI, Chrono Trigger): three heroes, three monsters.",
          "links": []
        },
        {
          "page": "dist/kits/my-3d2dge-stealth.html",
          "title": "Stealth",
          "what": "Rooftops at dusk (Tenchu, Assassin's Creed): steal the ledger past three guards.",
          "links": []
        },
        {
          "page": "dist/kits/my-3d2dge-animlab.html",
          "title": "Animation lab",
          "what": "Every move, pose and skin the character rigs have, from every view.",
          "links": []
        },
        {
          "page": "dist/my-3d2dge.html",
          "title": "All in one file",
          "what": "The engine, its API card, all six games and the animation lab, with a title menu. A kit is one game of it, small enough for a chat model.",
          "links": [["Compact edition", "dist/my-3d2dge-compact.html"]]
        }
      ]
    },
    {
      "id": "keep",
      "title": "Tools",
      "about": "For looking closely: every animation clip, every camera view, and how hard a device can be pushed.",
      "entries": [
        {
          "page": "mocap-lab",
          "title": "Mocap Lab",
          "what": "Every imported animation clip, on a mannequin and on the hero, in every view, slow or frame by frame. Sets: Quaternius, Mesh2Motion, CMU motion capture, and the clips the hero uses; the CMU library holds every one of its 2,548 takes.",
          "links": [["CMU clips", "?set=cmu"], ["Every CMU take", "?set=library"], ["Mesh2Motion", "?set=mesh2motion"], ["Hero's clips", "?set=hero"], ["Side view", "?view=side"], ["Hero only, slow", "?cast=hero&speed=.25"]]
        },
        {
          "page": "perspective-lab",
          "title": "Perspective Lab",
          "what": "One room in every camera view (isometric, three-quarter, top-down, brawler, side), with skeleton and lighting toggles.",
          "links": []
        },
        {
          "page": "stress-test",
          "title": "Stress test",
          "what": "Raise the load (up to 5,000 monsters, torches, particles) until the frame rate drops, or run the benchmark to rate this device. Any view the engine can draw (side scrolling, with depth drawn the Mode 7 way, or a custom turn and tilt), fixed in place if you like.",
          "links": [["Three-quarter view", "?view=threequarter"], ["Side scrolling", "?view=side"], ["Side scrolling with depth (Mode 7)", "?view=side&depth=1"], ["Custom camera, fixed", "?cam=300,20,1.25,8,1.2,520,410"]]
        }
      ]
    },
    {
      "id": "temporary",
      "title": "Temporary",
      "about": "Prototypes, each answering one question, newest first. Once it is answered, one is deleted or kept as a tool.",
      "empty": "Nothing here right now. One-off comparisons and experiments land here, each with its date and the question it answers.",
      "entries": [
        {
          "page": "vesper-ui",
          "title": "Vesper's interface on E.Shell",
          "added": "2026-10-11",
          "question": "Does E.Shell bring a modern adaptation's interface (Vesper's: 15.2k tokens of HTML, CSS and glue) down to a quarter?",
          "what": "Vesper's title, HUD (objective and distance, status, health, awareness, seals, hold-to-interact prompt, tip, district name, control bar, minimap), toasts, tutorial card, pause, settings, help, district map with a waypoint and results, rebuilt on E.Shell over a small stand-in game: climb to the bell tower, take the ledger, leave by boat. Keyboard, gamepad and touch. The interface is src/vesper-ui.ui.js; the pull request that added it gives the count.",
          "links": [["Three-quarter view", "#threequarter"]]
        },
        {
          "page": "shapes-compare",
          "title": "Shapes vs props",
          "added": "2026-10-08",
          "question": "Are 3D models converted to shapes worth building, next to our flat props?",
          "what": "Twelve free 3D models (Kenney and KayKit, CC0) converted to shapes and drawn by the engine in every view and turning, beside the hero and our closest flat prop, ranked from the best case to the worst, with what is off and what would fix it.",
          "links": []
        },
        {
          "page": "free-camera",
          "title": "Free camera room",
          "added": "2026-10-08",
          "question": "What does a free camera look like in our engine, and which objects hold up when you turn it?",
          "what": "A small room with four pillars, crates and the hero walking a lap. Drag to turn and tilt, zoom, move up and down, then fix the camera anywhere and copy its code or link. The crates switch between a converted 3D shape, today's flat prop and the engine's plain box. Fly mode (G) is a first-person camera on a small renderer of its own, to show what the engine can't do and what carries over.",
          "links": [["Fixed: low corner", "?cam=320,18,1.6,6,1,104,88"], ["Fixed: straight down", "?cam=0,90,1.2,0,1,104,88"], ["Fly: eye level", "?fly=104,150,20,-90,-7,70"]]
        },
        {
          "page": "lab-3d",
          "title": "3D world lab",
          "added": "2026-10-08",
          "question": "Can our characters, animation and look live in a real 3D world (three.js r182 and Rapier), with all its art drawn by code, and stay easy for AI agents to work on?",
          "deviates": "keeps three.js's WebGL 2 fallback as its cross-check that gameplay never reads the renderer (principle 6: WebGPU only).",
          "what": "A stone room in real 3D (three.js r182 on WebGPU, or WebGL 2 by itself, and Rapier physics), every texture and shape drawn by code. The hero walks a lap or you play it (move, swing, dash, knock the crates about); a mocap figure and Emberdeep's Dan stand by. Each character is a Card (the engine's own drawing on a card facing the camera) or a Puppet (3D parts on the same joints), or both side by side, in the engine's five fixed views or a free orbit, fly or chase camera. The decisions and trade-offs are in docs/LAB-3D.md.",
          "links": [["Side by side", "?look=both&view=threequarter"], ["Puppets, fly", "?look=puppet&view=fly"], ["Play: chase camera", "?view=chase"], ["On WebGL 2", "?backend=webgl"]]
        },
        {
          "page": "stress-world",
          "title": "Stress test: 3D world",
          "added": "2026-10-09",
          "question": "What does the stress test become built from the ground up as a 3D game (three.js r182, Rapier physics, a hall written as text), sharing only the engine's animation system, and how does it hold up?",
          "deviates": "keeps three.js's WebGL 2 fallback as its cross-check that gameplay never reads the renderer (principle 6: WebGPU only).",
          "what": "The stress test's job done as a 3D game, its own way: every monster is a Rapier body (the crowd pushes and piles up by itself, big hits throw bodies into the air, crates and barrels fly), the hero walks, dashes and jumps onto low walls and galleries, monsters find their way up the stairs after him. The hall is the 2D one's layout written as ASCII text, with a raised rune dais and two galleries. Characters are Cards (the engine draws them) or Puppets, in the engine's views (perspective or orthographic), side scrolling with depth, chase, first person, fly or fixed; filters (Comic cel or Pixel on the scene, the characters or the hall, bloom, FXAA). The benchmark adds a physics column.",
          "links": [["Puppets", "?look=puppet"], ["400 monsters", "?monsters=400"], ["Chase camera", "?cam3=chase&look=puppet&res=balanced"], ["Side scrolling with depth", "?view=side&depth=1"], ["Orthographic three-quarter", "?view=threequarter&proj=ortho"], ["Comic cel", "?fx=cel&look=puppet&res=full"], ["On WebGL 2", "?backend=webgl"]]
        }
      ]
    }
  ]
}
;
// On the site the pages have short addresses (/mocap-lab, and this page is /labs or /labs.html); as files (on disk, or
// the site's /examples/ folder) they sit next to this one (examples/mocap-lab.html) and the starters are in ../dist/
const LOCAL = location.protocol === 'file:' || /\/examples\/[^/]*$/.test(location.pathname);
const url = p => p.startsWith('dist/') ? (LOCAL ? '../' : '/') + p : LOCAL ? p + '.html' : '/' + p;
const target = (page, add) => add.startsWith('dist/') ? url(add) : url(page) + add;
const el = (tag, cls, text, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; if (parent) parent.appendChild(e); return e; };
// how long a prototype has been up: the doctrine deletes or graduates it once its question is settled
const age = d => { const n = Math.floor((Date.now() - Date.parse(d + 'T00:00:00')) / 864e5); return n < 1 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; };
const list = document.getElementById('list'), jump = document.getElementById('jump');
for (const S of LABS.sections) {
  const sec = el('section', 'sec', '', list), head = el('div', 'sec-head', '', sec);
  sec.id = S.id;
  el('h2', '', S.title, head);
  if (S.about) el('p', '', S.about, head);
  const j = el('a', '', S.title + ' ', jump); j.href = '#' + S.id; el('span', '', String(S.entries.length), j);
  if (!S.entries.length) { el('p', 'empty', S.empty || 'Nothing here.', sec); continue; }
  const temp = S.id === 'temporary', kits = S.id === 'kits';
  const grid = el('div', kits ? 'grid tiles' : 'grid', '', sec);
  // the prototypes newest first (the sort is stable: same-day ones keep the list's order)
  const entries = temp ? S.entries.slice().sort((a, b) => (b.added || '').localeCompare(a.added || '')) : S.entries;
  for (const L of entries) {
    const card = el('article', 'card', '', grid), a = el('a', '', L.title, el('h3', '', '', card));
    a.href = target(L.page, ''); el('i', '', ' →', a);
    if (L.added) el('div', 'meta', 'Added ' + L.added + ' · ' + age(L.added), card);
    if (L.question) el('p', 'q', L.question, card);
    if (L.deviates) { const d = el('p', 'dev', '', card); el('b', '', 'Deviates: ', d); d.append(L.deviates); }   // a prototype's departure from DOCTRINE.md, in a line
    if (temp && L.question) { const det = el('details', '', '', card); el('summary', '', 'What it is', det); el('p', '', L.what, det); }
    else el('p', '', L.what, card);
    if (L.links.length) { const row = el('div', 'links', '', card); for (const [label, add] of L.links) el('a', '', label, row).href = target(L.page, add); }
  }
}
// the jump bar marks the section in the middle of the screen
if ('IntersectionObserver' in window) {
  const mark = id => { for (const a of jump.children) a.classList.toggle('on', a.hash === '#' + id); };
  const io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) mark(e.target.id); }, { rootMargin: '-40% 0px -55% 0px' });
  for (const s of list.children) io.observe(s);
}
// which copy of the site this is: Vercel builds a preview of each branch at an address with -git- in it
const preview = /-git-/.test(location.hostname), where = document.getElementById('where');
where.textContent = location.protocol === 'file:' ? 'files on this computer' : preview ? 'preview of work not merged yet' : location.hostname ? 'live site' : '';
where.classList.toggle('preview', preview);
if (!where.textContent) where.remove();
const foot = document.getElementById('foot');
foot.append('The list is src/labs.json; ');
el('a', '', 'the game', foot).href = LOCAL ? 'emberdeep.html' : '/';
foot.append(' links here from its Developer panel.');
// the release and the commit it was deployed from (tools/stamp.mjs fills the build in on the site)
el('div', 'ver', 'my-3D2dge v0.33.0 · dev-build', foot);
</script>
</body>
</html>
