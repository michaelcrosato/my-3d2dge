<aside class="library-panel scene-library scene-only" aria-label="Scene assets">
  <div class="panel-heading"><h2>Level</h2><button id="sceneNewLevelBtn" type="button" class="small-button" title="Create an empty level">+ New</button></div>
  <select id="sceneLevel" aria-label="Current level"></select>
  <div class="library-heading"><h2>Objects</h2><span id="sceneObjectCount" class="count"></span></div>
  <div id="sceneObjectList" class="asset-list object-list" role="group" aria-label="Level objects"></div>
  <div class="add-object-row"><select id="sceneObjectModel" aria-label="Model to place"></select><button id="sceneNewObject" type="button" title="Place the chosen model">+ Place</button></div>
  <button id="sceneAddActor" type="button" class="full subtle">+ Place animation actor</button>
  <div class="library-heading"><h2>Reusable models</h2><button id="sceneNewModel" type="button" class="small-button">+ New</button></div>
  <div id="sceneModelList" class="asset-list model-list" role="group" aria-label="Reusable models"></div>
  <div class="library-heading"><h2>Materials &amp; textures</h2><button id="sceneNewMaterial" type="button" class="small-button">+ New</button></div>
  <div id="sceneMaterialList" class="asset-list material-list" role="group" aria-label="Materials"></div>
  <div class="library-footer"><span class="tiny-mark">◇</span><span>One project. One live history.<br>Animation, models and levels.</span></div>
</aside>
