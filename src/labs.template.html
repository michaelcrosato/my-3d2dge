<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labs · my-3D2dge</title>
<meta name="theme-color" content="#06050b">
<!--
  The Labs page: one place to open every test page, lab and demo of my-3D2dge (my-3d2dge.vercel.app/labs).
  Built by tools/build.mjs from the list in src/labs.json; edit the list, not this page. tools/labs-test.mjs opens
  every link. The links work from the site (/mocap-lab) and from the files on disk (examples/mocap-lab.html).
-->
<style>
:root{
  --bg:#f0e6d6; --panel:#faf2e4; --ink:#2a2140; --muted:#63557a; --accent:#b8612a; --accent-ink:#fff6e6;
  --line:rgba(42,33,64,.18); --chip:rgba(42,33,64,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#06050b; --panel:#141022; --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.14); --chip:rgba(241,228,200,.08); }
}
:root[data-theme="dark"]{ --bg:#06050b; --panel:#141022; --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.14); --chip:rgba(241,228,200,.08); }
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Trebuchet MS',system-ui,sans-serif;line-height:1.4;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:760px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:6px}
h1{margin:0;font-size:26px}
.where{font-size:13px;color:var(--muted)}
.where b{color:var(--accent);font-weight:600}
.intro{margin:0 0 18px;color:var(--muted);font-size:15px}
h2{margin:22px 0 8px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 13px;margin-bottom:10px}
.card h3{margin:0 0 3px;font-size:18px}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a::after{content:" →";color:var(--accent)}
.card p{margin:0 0 9px;font-size:14px;color:var(--muted)}
.card .date{font-size:12px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-block;padding:7px 11px;border-radius:7px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:14px;min-height:34px}
.links a:first-child{background:var(--accent);color:var(--accent-ink)}
.links a:focus-visible,.card h3 a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{font-size:14px;color:var(--muted);margin:0;padding:10px 14px;border:1px dashed var(--line);border-radius:10px}
footer{margin-top:26px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <header><h1>Labs</h1><span class="where" id="where"></span></header>
  <p class="intro">Every test page, lab and demo, one tap away. Each opens in this tab; your browser's back button returns here.</p>
  <div id="list"></div>
  <footer id="foot"></footer>
</main>
<script>
const LABS = <!-- @inline-raw src/labs.json -->;
// On the site the pages have short addresses (/mocap-lab, and this page is /labs or /labs.html); as files (on disk, or
// the site's /examples/ folder) they sit next to this one (examples/mocap-lab.html) and the starters are in ../dist/
const LOCAL = location.protocol === 'file:' || /\/examples\/[^/]*$/.test(location.pathname);
const url = p => p.startsWith('dist/') ? (LOCAL ? '../' : '/') + p : LOCAL ? p + '.html' : '/' + p;
const target = (page, add) => add.startsWith('dist/') ? url(add) : url(page) + add;
const el = (tag, cls, text, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; if (parent) parent.appendChild(e); return e; };
const list = document.getElementById('list');
for (const S of LABS.sections) {
  el('h2', '', S.title, list);
  if (!S.entries.length) { el('p', 'empty', S.empty || 'Nothing here.', list); continue; }
  for (const L of S.entries) {
    const card = el('section', 'card', '', list), h = el('h3', '', '', card), a = el('a', '', L.title, h);
    a.href = target(L.page, L.links[0][1]);
    if (L.added) el('div', 'date', 'Added ' + L.added + (L.question ? ' · ' + L.question : ''), card);
    el('p', '', L.what, card);
    const row = el('div', 'links', '', card);
    for (const [label, add] of L.links) el('a', '', label, row).href = target(L.page, add);
  }
}
// which copy of the site this is: Vercel builds a preview of each branch at an address with -git- in it
const preview = /-git-/.test(location.hostname);
document.getElementById('where').innerHTML = location.protocol === 'file:' ? 'files on this computer' : preview ? '<b>preview</b> of work not merged yet' : location.hostname ? 'live site' : '';
const foot = document.getElementById('foot');
foot.append('The list is src/labs.json; ');
el('a', '', 'the game', foot).href = LOCAL ? 'emberdeep.html' : '/';
foot.append(' links here from its Developer panel.');
</script>
</body>
</html>
