<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

.ed-dialog::backdrop{background:#05030cc4}.ed-dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px}.ed-dialog h2{margin:0;color:#ffd36a;font-size:24px}.ed-dialog h3{color:#b5eaff;margin:20px 0 8px}.ed-dialog p{color:#c8c0d8}.ed-dialog button,.ed-dialog select,.ed-dialog input{font:inherit;min-height:44px;border:1px solid #6a5a88;border-radius:6px;background:#302542;color:#fff;padding:6px 10px;max-width:100%;box-sizing:border-box}.ed-dialog button{cursor:pointer;margin:3px}.ed-dialog button:hover{background:#49375e}.ed-dialog :focus-visible{outline:3px solid #ffd36a;outline-offset:2px}.ed-field{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:50px;border-bottom:1px solid #ffffff12}.ed-field input[type=range]{width:45%;padding:0}.ed-field input[type=checkbox]{width:24px;accent-color:#6fd6cc}.ed-field select{max-width:55%}.ed-field input[type=number]{width:100px}.ed-meter{font:12px/1.5 monospace;overflow-wrap:anywhere;background:#0004;padding:10px;border-radius:6px}.ed-status{color:#ffd36a!important;position:sticky;top:-20px;z-index:1;background:#211931;padding:10px;min-height:24px}.ed-binding{display:grid;grid-template-columns:100px 1fr 1fr;align-items:center;gap:5px;border-top:1px solid #ffffff12;padding:8px 0}.ed-binding strong{font-size:13px}.ed-binding>div{display:flex;flex-wrap:wrap;gap:2px}.ed-binding button{font-size:12px;margin:0}.ed-binding button:first-child{flex:1}.ed-binding button+button{color:#b8adc9}
.ed-touch{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:var(--touch-opacity)}.ed-touch button{pointer-events:auto;touch-action:none;user-select:none;min-width:44px;min-height:44px;border:1px solid #b3a0cc80;background:#160f28cc;color:#fff;font:600 11px system-ui,sans-serif;border-radius:12px}.ed-touch button.on{background:#665185;border-color:#ffd36a}.ed-touch-actions{position:absolute;right:max(8px,env(safe-area-inset-right));bottom:max(76px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,var(--touch-size));gap:5px}.ed-touch-actions button{width:var(--touch-size);height:var(--touch-size)}.ed-touch-bar{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 16px);gap:5px}.ed-left .ed-touch-actions,.ed-left .ed-touch-bar{left:max(8px,env(safe-area-inset-left));right:auto}
