<!doctype html>
<html><head><meta charset="utf-8"><title>motion fixture</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#screen{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head>
<body><canvas id="screen"></canvas>
<script src="../../dist/my-3d2dge.js"></script>
<script>
// the motion suite's page (tools/motion-test.mjs): two scenes to go between, and the weather over them. The query picks
// what it shows: ?view=threequarter|iso|topdown|side, &fade=<a transition> (window.__go() goes from a to b with it),
// &seconds=.4, &reduce=1 (reduce motion), &weather=<kind>&amount=.8&wind=.3&lightning=0, &filter=scanlines|crt
(() => {
const E = My3D2dge, Q = new URLSearchParams(location.search), view = Q.get('view') || 'threequarter';
const game = new E.Game({ canvas: 'screen', res: 'ps1', view, menu: false, fullscreen: false, corner: false });
if (Q.get('reduce')) game.settings.set('motion', true);
if (Q.get('filter')) game.settings.set('filter', Q.get('filter'));
const map = new E.TileMap({
  rows: ['##############',
         '#............#',
         '#..##....##..#',
         '#............#',
         '#.....@......#',
         '#..##....##..#',
         '#............#',
         '##############'],
  legend: { '#': 1, '@': 'hero' },
  types: { 1: { h: 26, top: '#8a80a0', side: '#4a4560' } },
  floorTex: (x, y) => E.tex.grass(x, y)
});
const hero = map.find('hero'), rig = new E.Humanoid({ size: 1.3, outfit: 'tunic', colors: { cloth: '#3a8a4a', hair: '#e0b040' } });
const level = new E.PlatformMap({ rows: ['....................', '....................', '......===....===....', '....................', '####################', '####################'], legend: { '#': 1, '=': 2 }, types: { 1: { color: '#6a5a4a' }, 2: { color: '#8a7a5a' } } });
const weather = () => Q.get('weather') ? { kind: Q.get('weather'), amount: +(Q.get('amount') || .8), wind: +(Q.get('wind') || .3), lightning: +(Q.get('lightning') || 0) } : null;
const a = {
  enter() { game.cam.bounds = v => map.bounds(v); game.focus(hero.x, hero.y, 16); game.cam.snap = true; game.weather = weather(); if (view === 'side') game.particles.ground = () => 32; },
  update(dt) { rig.update(dt, { x: hero.x, y: hero.y, z: 0, vx: 0, vy: 0, facing: Math.PI / 2 }); },
  draw(r) {
    r.sky(['#101848', '#5a3a80']);
    if (view === 'side') level.draw(r); else { map.drawFloor(r); map.queueWalls(r); }
    r.actor(hero.x, hero.y, 0, (g, x, y) => rig.draw(g, x, y, r.view));
    r.text('SCENE A', 6, 6, '#ffffff', { shadow: '#000' });
  }
};
const b = {
  enter() { game.weather = weather(); },
  update() {},
  draw(r) { r.sky(['#3a1a10', '#e0a040']); r.overlay(g => { E.px.rect(g, 40, 120, 240, 40, '#20a080'); E.font.title(g, 'SCENE B', r.W / 2, 80, { scale: 2, align: 'center' }); }); }
};
game.start({ scenes: { a, b }, scene: 'a' });
window.__go = () => game.go('b', null, { fade: Q.get('fade') || 'black', seconds: +(Q.get('seconds') || .4), at: hero });
window.__game = { game, scenes: { a, b } };
})();
</script>
</body></html>
